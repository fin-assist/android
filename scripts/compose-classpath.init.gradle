import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.result.UnresolvedDependencyResult

// Metadata only: do not download AARs, build APKs or mutate application dependencies.
gradle.projectsEvaluated {
    def app = gradle.rootProject.findProject(':app')
    if (app == null) return // The init script also runs in the included build-logic build.
    def libs = app.extensions.getByType(org.gradle.api.artifacts.VersionCatalogsExtension).named('libs')
    def configurations = ['mockE2eRuntimeClasspath', 'stageDebugRuntimeClasspath', 'stageReleaseRuntimeClasspath', 'prodReleaseRuntimeClasspath']
    def baselines = [:]
    configurations.each { name ->
        def runtime = app.configurations.getByName(name)
        def baseline = app.configurations.detachedConfiguration(
            app.dependencies.enforcedPlatform(libs.findLibrary('androidx-compose-bom').get().get()),
            app.dependencies.create('androidx.compose.ui:ui'),
            app.dependencies.create('androidx.compose.foundation:foundation'),
            app.dependencies.create(libs.findLibrary('androidx-navigation-compose').get().get()),
            app.dependencies.create(libs.findLibrary('androidx-lifecycle-runtime-compose').get().get())
        )
        runtime.attributes.keySet().each { key ->
            baseline.attributes.attribute(key, runtime.attributes.getAttribute(key))
        }
        baselines[name] = baseline
    }
    app.tasks.register('composeClasspathReport') {
        doLast {
            def modules = { configuration ->
                def result = configuration.incoming.resolutionResult
                def failures = result.allDependencies.findAll { it instanceof UnresolvedDependencyResult }
                if (!failures.empty) {
                    throw new GradleException("Cannot resolve ${configuration.name}: " + failures.collect {
                        "${it.attempted.displayName}: ${it.failure.message}"
                    }.unique().join('\n'))
                }
                result.allComponents.findAll { it.id instanceof ModuleComponentIdentifier }.collectEntries {
                    [("${it.id.group}:${it.id.module}".toString()): it.id.version]
                }
            }
            def report = configurations.collectEntries { name ->
                [(name): [baseline: modules(baselines[name]), resolved: modules(app.configurations.getByName(name))]]
            }
            def output = app.layout.buildDirectory.file('reports/compose-classpath.json').get().asFile
            output.parentFile.mkdirs()
            output.text = JsonOutput.prettyPrint(JsonOutput.toJson(report)) + '\n'
            println "Compose classpath metadata: ${output}"
        }
    }
}
