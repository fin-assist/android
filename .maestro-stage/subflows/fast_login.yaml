# FIN-386. Stage-only helper; run scripts/stage-e2e.py to prepare owned state first.
appId: ru.finassist.pf.stage.e2e
---
- runFlow:
    file: config.yaml
    env:
      LINK: "pfe2e://config?sign_in=existing"
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      id: "operations.feed|applock.unlock"
    timeout: 40000
- runFlow:
    when:
      visible:
        id: "applock.unlock"
    commands:
      - runFlow:
          file: enter_code.yaml
          env:
            CODE: "1234"
- extendedWaitUntil:
    visible:
      id: "operations.feed"
    timeout: 40000
- extendedWaitUntil:
    visible:
      id: "operations.row"
    timeout: 20000
