# Fixture setup keeps the first registration session; no second Phone Start.
appId: ru.finassist.pf.stage.e2e
---
- runFlow:
    file: config.yaml
    env:
      LINK: "pfe2e://config?setup_run=seeded_needs_code"
- launchApp:
    stopApp: false
- runFlow: set_passcode.yaml
- extendedWaitUntil:
    visible:
      id: "operations.feed"
    timeout: 40000
- extendedWaitUntil:
    visible:
      id: "operations.row"
    timeout: 20000
