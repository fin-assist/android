# Select the fixture month explicitly; stage uses its real current clock.
appId: ru.finassist.pf.stage.e2e
---
- scrollUntilVisible:
    element:
      id: "ds.period.pick"
    direction: UP
- tapOn:
    id: "ds.period.pick"
- extendedWaitUntil:
    visible:
      id: "analytics.period.option"
    timeout: 20000
- scrollUntilVisible:
    element:
      text: ${PERIOD_TITLE}
      childOf:
        id: "analytics.period.option"
- tapOn:
    text: ${PERIOD_TITLE}
    childOf:
      id: "analytics.period.option"
- extendedWaitUntil:
    visible: ${PERIOD_TITLE}
    timeout: 20000
