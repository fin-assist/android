# FIN-386. Stage-only helper; run scripts/stage-e2e.py to prepare owned state first.
appId: ru.finassist.pf.stage.e2e
---
- extendedWaitUntil:
    visible:
      id: "applock.setup"
    timeout: 20000
- runFlow:
    file: enter_code.yaml
    env:
      CODE: "1234"
- extendedWaitUntil:
    visible:
      id: "applock.setup.repeat"
    timeout: 5000
- runFlow:
    file: enter_code.yaml
    env:
      CODE: "1234"
- runFlow:
    when:
      visible:
        id: "applock.biometric_offer"
    commands:
      - tapOn:
          id: "applock.biometric_offer.skip"
