# FIN-386. Source: .maestro/flows/assistant/retry_without_transfers.yaml; Qase 25.
# Persisted model failure, retry and original transfer mode.
# BLOCKED: RetryAnswer must recover a persisted MODEL_ERROR using the original question and transfer mode; no run-scoped fail-once provider is available.
appId: ru.finassist.pf.stage.e2e
name: "[stage] Помощник — «Повторить» после сбоя модели сохраняет режим «Без переводов»"
tags:
  - assistant
---
# This case is blocked; direct execution must fail instead of claiming coverage.
- assertTrue: ${false}
- runFlow: ../../subflows/clear_state.yaml
- runFlow: ../../subflows/fast_login.yaml
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?assistant_model_errors=1"
- tapOn:
    id: "ds.tab.analytics"
- extendedWaitUntil:
    visible:
      id: "analytics.transfers"
    timeout: 15000
- tapOn:
    id: "analytics.transfers"
- tapOn:
    id: "analytics.transfers.without"
- extendedWaitUntil:
    visible: "Без переводов"
    timeout: 5000
- tapOn:
    id: "analytics.ask"
- extendedWaitUntil:
    visible:
      id: "assistant.chat"
    timeout: 10000
- tapOn:
    id: "ds.chat.input"
- inputText: "${STAGE_FINANCIAL_QUESTION}"
- tapOn:
    id: "ds.chat.send"
- extendedWaitUntil:
    visible:
      id: "assistant.consent"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "assistant.consent.checkbox"
- tapOn:
    id: "assistant.consent.checkbox"
- scrollUntilVisible:
    element:
      id: "assistant.consent.submit"
- tapOn:
    id: "assistant.consent.submit"

- extendedWaitUntil:
    visible:
      id: "assistant.answer.failed"
    timeout: 20000
- assertVisible: ".*[Оо]сталось 5 из 5.*"
- tapOn: "Повторить"

- extendedWaitUntil:
    visible:
      id: "assistant.answer"
    timeout: 20000
- assertNotVisible:
    id: "assistant.answer.failed"
- assertVisible: ".*[Оо]сталось 4 из 5.*"
- scrollUntilVisible:
    element: ".*· без переводов"
    direction: DOWN
