# FIN-386. Source: .maestro/flows/assistant/off_topic_limit.yaml; Qase 49.
# Five real fake-LLM off_topic outcomes enforce actual rolling-window block; draft and daily quota remain.
appId: ru.finassist.pf.stage.e2e
name: "[stage] OFF_TOPIC — недельная блокировка сохраняет черновик и дневной остаток"
tags:
  - assistant
  - errors
---
- runFlow: ../../subflows/clear_state.yaml
- runFlow: ../../subflows/fast_login.yaml
- tapOn:
    id: "ds.tab.analytics"
- extendedWaitUntil:
    visible:
      id: "analytics.ask"
    timeout: 15000
- tapOn:
    id: "analytics.ask"
- extendedWaitUntil:
    visible:
      id: "assistant.chat"
    timeout: 10000

- tapOn:
    id: "ds.chat.input"
- inputText: "#FIN362_OFF_TOPIC"
- tapOn:
    id: "ds.chat.send"
- extendedWaitUntil:
    visible:
      id: "assistant.consent"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "assistant.consent.checkbox"
- tapOn:
    id: "assistant.consent.checkbox"
- scrollUntilVisible:
    element:
      id: "assistant.consent.submit"
- tapOn:
    id: "assistant.consent.submit"
- extendedWaitUntil:
    visible:
      id: "assistant.answer.failed"
    timeout: 20000
- assertVisible: "Вопрос не по теме — помощник отвечает только на вопросы о ваших финансах.*"
- assertNotVisible:
    id: "assistant.answer.failed.retry"
- assertVisible: ".*[Оо]сталось 5 из 5.*"

- repeat:
    times: 4
    commands:
      - tapOn:
          id: "ds.chat.input"
      - inputText: "#FIN362_OFF_TOPIC"
      - tapOn:
          id: "ds.chat.send"
      - extendedWaitUntil:
          visible:
            id: "ds.chat.send"
            enabled: true
          timeout: 20000
      - assertVisible: ".*[Оо]сталось 5 из 5.*"
- tapOn:
    id: "ds.chat.input"
- inputText: "${STAGE_FINANCIAL_QUESTION}"
- tapOn:
    id: "ds.chat.send"
- extendedWaitUntil:
    visible:
      id: "assistant.chat.send_failed"
    timeout: 20000
- assertVisible: "Слишком много запросов[.] Попробуйте позже"
- assertVisible: "${STAGE_FINANCIAL_QUESTION}"
- assertVisible: ".*[Оо]сталось 5 из 5.*"
- assertVisible:
    id: "assistant.answer.failed"
- assertNotVisible:
    id: "assistant.answer.failed.retry"
- pressKey: back
- tapOn:
    id: "analytics.ask"
- extendedWaitUntil:
    visible:
      id: "assistant.answer.failed"
    timeout: 15000
- assertVisible: ".*[Оо]сталось 5 из 5.*"
