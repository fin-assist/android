# FIN-386. Source: .maestro/flows/assistant/answer_retry.yaml; Qase 26.
# Persisted model failure, double retry and one charged result.
# BLOCKED: A real persisted failed answer must succeed on retry; a client-only SSE substitution cannot create that server state.
appId: ru.finassist.pf.stage.e2e
name: "[stage] Помощник — ответ не получился, двойное нажатие «Повторить» даёт один ответ без ошибки"
tags:
  - assistant
---
# This case is blocked; direct execution must fail instead of claiming coverage.
- assertTrue: ${false}
- runFlow: ../../subflows/clear_state.yaml
- runFlow: ../../subflows/fast_login.yaml
- tapOn:
    id: "ds.tab.analytics"
- extendedWaitUntil:
    visible:
      id: "analytics.ask"
    timeout: 15000
- tapOn:
    id: "analytics.ask"
- extendedWaitUntil:
    visible:
      id: "assistant.chat"
    timeout: 10000

- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?assistant_model_errors=1"
- tapOn:
    id: "ds.chat.input"
- inputText: "${STAGE_FINANCIAL_QUESTION}"
- tapOn:
    id: "ds.chat.send"
- extendedWaitUntil:
    visible:
      id: "assistant.consent"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "assistant.consent.checkbox"
- tapOn:
    id: "assistant.consent.checkbox"
- scrollUntilVisible:
    element:
      id: "assistant.consent.submit"
- tapOn:
    id: "assistant.consent.submit"
- extendedWaitUntil:
    visible:
      id: "assistant.answer.failed"
    timeout: 20000
- assertVisible: "Не получилось ответить. Вопрос не потрачен"
- assertVisible: ".*[Оо]сталось 5 из 5.*"

- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?network_delay_ms=1500"
- doubleTapOn:
    id: "assistant.answer.failed.retry"
- extendedWaitUntil:
    visible:
      id: "assistant.answer"
    timeout: 20000
- assertNotVisible:
    id: "assistant.answer.failed"
- assertNotVisible:
    id: "assistant.chat.send_failed"
- assertVisible: ".*[Оо]сталось 4 из 5.*"
