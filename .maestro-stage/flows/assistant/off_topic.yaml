# FIN-386. Source: .maestro/flows/assistant/off_topic.yaml; Qase 39.
# Real fake-LLM off_topic terminal outcome refunds quota, then real tool-backed answer.
appId: ru.finassist.pf.stage.e2e
name: "[stage] Помощник — вопрос не по теме даёт текст сервера без «Повторить» и не тратит попытку"
tags:
  - assistant
---
- runFlow: ../../subflows/clear_state.yaml
- runFlow: ../../subflows/fast_login.yaml
- tapOn:
    id: "ds.tab.analytics"
- extendedWaitUntil:
    visible:
      id: "analytics.ask"
    timeout: 15000
- tapOn:
    id: "analytics.ask"
- extendedWaitUntil:
    visible:
      id: "assistant.chat"
    timeout: 10000

- tapOn:
    id: "ds.chat.input"
- inputText: "#FIN362_OFF_TOPIC"
- tapOn:
    id: "ds.chat.send"
- extendedWaitUntil:
    visible:
      id: "assistant.consent"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "assistant.consent.checkbox"
- tapOn:
    id: "assistant.consent.checkbox"
- scrollUntilVisible:
    element:
      id: "assistant.consent.submit"
- tapOn:
    id: "assistant.consent.submit"
- extendedWaitUntil:
    visible:
      id: "assistant.answer.failed"
    timeout: 20000
- assertVisible: "Вопрос не по теме — помощник отвечает только на вопросы о ваших финансах.*"
- assertNotVisible:
    id: "assistant.answer.failed.retry"
- assertVisible: ".*[Оо]сталось 5 из 5.*"

- extendedWaitUntil:
    visible:
      id: "ds.chat.input"
      enabled: true
    timeout: 20000
- tapOn:
    id: "ds.chat.input"
- inputText: "${STAGE_FINANCIAL_QUESTION}"
- tapOn:
    id: "ds.chat.send"
- extendedWaitUntil:
    visible:
      id: "assistant.answer"
    timeout: 20000
- assertVisible: ".*[Оо]сталось 4 из 5.*"
