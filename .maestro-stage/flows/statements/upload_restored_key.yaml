# FIN-386. Source: .maestro/flows/statements/upload_restored_key.yaml; Qase 51.
# Closed local unknown-age upload-key seed; real GET count proves no automatic upload and exactly one explicit new intent.
appId: ru.finassist.pf.stage.e2e
name: "[stage] Загрузка — неизвестный возраст ключа и явное новое действие"
tags:
  - statements
  - errors
---
- runFlow: ../../subflows/clear_state.yaml
- runFlow: ../../subflows/fast_login.yaml
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?pending_upload_fixture=october&expect_uploads=1"
- tapOn:
    id: "ds.tab.profile"
- tapOn:
    id: "profile.statements"
- extendedWaitUntil:
    visible:
      id: "statements.history"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "statements.history.upload"
- tapOn:
    id: "statements.history.upload"
- extendedWaitUntil:
    visible:
      id: "statements.upload"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "statements.upload.pick"
- tapOn:
    id: "statements.upload.pick"
- tapOn:
    id: "e2e.picker.october.ofx"
- extendedWaitUntil:
    visible:
      id: "statements.upload.recovery"
    timeout: 10000
- assertVisible: "Результат предыдущей загрузки неизвестен.*"
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?expect_uploads=1"
- tapOn:
    id: "statements.upload.new_intent"
- extendedWaitUntil:
    visible:
      id: "statements.result"
    timeout: 20000
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?expect_uploads=2"
