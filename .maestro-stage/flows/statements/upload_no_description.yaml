# FIN-386. Source: .maestro/flows/statements/upload_no_description.yaml; Qase 23.
# Real OFX operation without NAME displays fallback title; fixed 7 October header replaces frozen yesterday.
appId: ru.finassist.pf.stage.e2e
name: "[stage] Загрузка — операция без описания принимается и видна в ленте как «Без описания»"
tags:
  - statements
---
- runFlow: ../../subflows/clear_state.yaml
- runFlow: ../../subflows/fast_login.yaml
- tapOn:
    id: "ds.tab.profile"
- extendedWaitUntil:
    visible:
      id: "profile.statements"
    timeout: 10000
- tapOn:
    id: "profile.statements"
- extendedWaitUntil:
    visible:
      id: "statements.history"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "statements.history.upload"
- tapOn:
    id: "statements.history.upload"
- scrollUntilVisible:
    element:
      id: "statements.upload.pick"
- tapOn:
    id: "statements.upload.pick"

- tapOn:
    id: "e2e.picker.no-description.ofx"
- extendedWaitUntil:
    visible:
      id: "statements.result"
    timeout: 20000
- assertVisible:
    id: "statements.result.new"
- assertNotVisible:
    id: "statements.result.unread"

- scrollUntilVisible:
    element:
      id: "statements.result.done"
- tapOn:
    id: "statements.result.done"
- extendedWaitUntil:
    visible:
      id: "operations.feed"
    timeout: 10000
- assertVisible: "(?iu)7.октября"
- assertVisible: "Без описания"
- tapOn: "Без описания"
- extendedWaitUntil:
    visible:
      id: "operations.detail.title"
    timeout: 10000
- assertVisible: "Без описания"
- assertNotVisible: "Описание в выписке"
- assertVisible: "Фастфуд"
