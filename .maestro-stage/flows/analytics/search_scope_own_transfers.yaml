# FIN-386. Source: .maestro/flows/analytics/search_scope_own_transfers.yaml; Qase 38.
# Real own-transfer 6000 is absent from scoped analytics search and present after scope removal.
appId: ru.finassist.pf.stage.e2e
name: "[stage] Аналитика — Поиск «как на Аналитике» не показывает переводы себе"
tags:
  - analytics
---
- runFlow: ../../subflows/clear_state.yaml
- runFlow: ../../subflows/fast_login.yaml
- tapOn:
    id: "ds.tab.analytics"
- extendedWaitUntil:
    visible:
      id: "analytics.block.tiles"
    timeout: 15000
- runFlow:
    file: ../../subflows/select_fixture_month.yaml
    env:
      PERIOD_TITLE: "Сентябрь 2026"

- tapOn:
    id: "analytics.tile.expense"
- extendedWaitUntil:
    visible:
      id: "operations.search.count"
    timeout: 10000
- swipe:
    from:
      id: "operations.search.chip.category"
    direction: LEFT
- assertVisible:
    id: "operations.search.chip.scope"
- tapOn:
    id: "operations.search.chip.kind"
- assertVisible:
    id: "operations.search.chip.kind"
    checked: false
- tapOn:
    id: "operations.search.chip.amount"
- tapOn:
    id: "operations.search.amount.from"
- inputText: "6000"
- tapOn:
    id: "operations.search.amount.to"
- inputText: "6000"
- hideKeyboard
- tapOn:
    id: "operations.search.amount.apply"
- extendedWaitUntil:
    visible:
      id: "operations.search.empty"
    timeout: 10000
- assertNotVisible: "Себе в другой банк"

- swipe:
    from:
      id: "operations.search.chip.amount"
    direction: LEFT
- tapOn:
    id: "operations.search.chip.scope"
- extendedWaitUntil:
    visible: "Себе в другой банк"
    timeout: 10000
- assertVisible:
    id: "operations.row"
