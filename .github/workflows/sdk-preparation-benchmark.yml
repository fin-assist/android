# Opt-in SDK transfer experiment only; the UI workflow does not consume these caches.
name: SDK preparation benchmark

on:
  workflow_call:

permissions:
  contents: read

jobs:
  seed:
    name: Seed two SDK packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      emulator-key: ${{ steps.prepare.outputs.emulator-key }}
      image-key: ${{ steps.prepare.outputs.image-key }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      # Identical unmeasured disk preparation on all nine disposable runners.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/android/sdk/ndk /usr/local/share/powershell /usr/share/swift
          df -h /
      - name: Start clean package measurement
        id: start
        run: python3 scripts/sdk-preparation-benchmark.py start --mode seed
      - name: Install current SDK packages
        id: prepare
        run: python3 scripts/sdk-preparation-benchmark.py prepare --mode seed
      # Sole writer. Run-scoped immutable keys permit exact, bounded cleanup after the experiment.
      - name: Save emulator package
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.start.outputs.emulator-path }}
          key: ${{ steps.prepare.outputs.emulator-key }}
      - name: Save system image package
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.start.outputs.image-path }}
          key: ${{ steps.prepare.outputs.image-key }}
      - name: Finish seed measurement
        run: python3 scripts/sdk-preparation-benchmark.py finish
      - name: Publish seed metadata
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sdk-preparation-seed
          path: build/sdk-preparation-benchmark/
          if-no-files-found: error
          retention-days: 3

  measure:
    name: SDK ${{ matrix.mode }} ${{ matrix.shard }}
    needs: seed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [baseline, warm]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - name: Read seed compatibility metadata
        uses: actions/download-artifact@v8
        with:
          name: sdk-preparation-seed
          path: seed
      # Identical unmeasured disk preparation on all nine disposable runners.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/android/sdk/ndk /usr/local/share/powershell /usr/share/swift
          df -h /
      - name: Start clean package measurement
        id: start
        env:
          MODE: ${{ matrix.mode }}
          SHARD: ${{ matrix.shard }}
        run: python3 scripts/sdk-preparation-benchmark.py start --mode "$MODE" --shard "$SHARD"
      - name: Restore emulator package
        if: matrix.mode == 'warm'
        id: emulator
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.start.outputs.emulator-path }}
          key: ${{ needs.seed.outputs.emulator-key }}
          fail-on-cache-miss: true
      - name: Restore system image package
        if: matrix.mode == 'warm'
        id: image
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.start.outputs.image-path }}
          key: ${{ needs.seed.outputs.image-key }}
          fail-on-cache-miss: true
      - name: Require both exact hits
        if: matrix.mode == 'warm'
        env:
          EMULATOR_HIT: ${{ steps.emulator.outputs.cache-hit }}
          IMAGE_HIT: ${{ steps.image.outputs.cache-hit }}
        run: test "$EMULATOR_HIT" = true && test "$IMAGE_HIT" = true
      # Identical online update checks in both arms: restored binaries never pin an obsolete revision.
      - name: Install current SDK packages and compare seed
        env:
          MODE: ${{ matrix.mode }}
        run: python3 scripts/sdk-preparation-benchmark.py prepare --mode "$MODE"
      - name: Finish measurement
        run: python3 scripts/sdk-preparation-benchmark.py finish
      - name: Publish measurement metadata
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sdk-preparation-${{ matrix.mode }}-${{ matrix.shard }}
          path: build/sdk-preparation-benchmark/
          if-no-files-found: error
          retention-days: 3
