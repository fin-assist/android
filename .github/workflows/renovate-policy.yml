name: Renovate policy controller
on:
  workflow_run:
    workflows: [CI, Renovate policy tests]
    types: [completed]
    branches: ['renovate/**']
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  checks: read
concurrency:
  group: renovate-policy-controller
  queue: max
jobs:
  gate:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.actor.id == 29139614 &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      enabled: ${{ steps.activation.outputs.enabled }}
    steps:
      - id: activation
        env:
          RENOVATE_POLICY_ENABLED: ${{ vars.RENOVATE_POLICY_ENABLED }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # POSIX cron fires every Monday. Run reconciliation every 14 days
          # from a fixed UTC Monday, independent of ISO week/year boundaries.
          if [ "$EVENT_NAME" = schedule ]; then
            epoch_monday=345600
            days_since_monday=$(( ($(date -u +%s) - epoch_monday) / 86400 ))
            if [ "$((days_since_monday / 7 % 2))" -ne 0 ]; then
              printf 'enabled=false\n' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if [ "$RENOVATE_POLICY_ENABLED" = true ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
          fi
  reconcile:
    needs: gate
    if: github.ref == 'refs/heads/main' && needs.gate.outputs.enabled == 'true'
    environment: renovate-policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Only trusted main configuration is read; all executable policy comes from the pinned action.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.15'
      - name: Reconcile Renovate PRs
        uses: fin-assist/renovate-actions/.github/actions/renovate-policy@c84edb2879d994d8b1026d15cc4c839112c65a43 # main
        with:
          enabled: ${{ needs.gate.outputs.enabled }}
          repository-root: ${{ github.workspace }}
          read-token: ${{ github.token }}
          token: ${{ secrets.RENOVATE_POLICY_TOKEN }}
