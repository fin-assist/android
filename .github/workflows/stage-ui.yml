name: Stage UI tests (manual)

# Intentionally no push, pull_request, schedule, workflow_run or workflow_call.
# This rare full run is started only by the owner from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage-ui-manual
  cancel-in-progress: false

jobs:
  stage-ui:
    name: Actual stage · full UI inventory
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Check complete case inventory
        run: python3 scripts/stage-ui.py --prepare-report
      - name: Build isolated stage test APKs
        timeout-minutes: 20
        run: ./gradlew :app:assembleStageE2e :app:assembleStageE2eAndroidTest --no-daemon --console=plain
      - name: Install pinned Maestro
        timeout-minutes: 5
        env:
          MAESTRO_VERSION: 2.11.0
        run: |
          curl --fail --silent --show-error --location --max-time 120 https://get.maestro.mobile.dev -o /tmp/install-maestro
          bash /tmp/install-maestro
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Execute real stage UI cases
        timeout-minutes: 150
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2, same audited action as mock UI
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: stage-ui-disposable
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -timezone Europe/Moscow
          script: python3 scripts/stage-ui.py --no-build
      - name: Publish stage report to Qase
        if: ${{ always() && !cancelled() && hashFiles('build/stage-ui/report.xml') != '' }}
        continue-on-error: true
        timeout-minutes: 3
        env:
          QASE_API_TOKEN: ${{ secrets.QASE_API_TOKEN }}
        run: |
          python3 scripts/qase-report.py \
            --title "Stage UI · manual · ${GITHUB_SHA::7}" \
            --description "Real Go/DB/Object Storage, fake phone/LLM. Client fault injections are labelled in the stage report. Blocked and missing cases are failures. ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            build/stage-ui/report.xml
      - name: Stage results and failure materials
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stage-ui-reports
          path: build/stage-ui/
          if-no-files-found: error
          retention-days: 7
