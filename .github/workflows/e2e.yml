# UI tests on Android emulators: Maestro flows (.maestro/) and the native instrumented tests
# (app/src/androidTestMock) against the mock e2e build, then their code coverage (JaCoCo, docs/testing.md).
# Runs after a merge to main (a failed run is re-run from the Actions tab with «Re-run jobs»), or by hand for any
# branch («Run workflow») to check a flow or the coverage pipeline before the merge. Details: docs/e2e.md.
#
# The flows are split into shards, one emulator each (scripts/e2e-shards.py, docs/e2e.md «Shards in CI»); the
# native tests run in shard 1. The `reports` job merges what the shards left — whatever they ended with, unless the
# run was cancelled — into one Maestro report, one coverage report, one Qase run and the `e2e-reports` artifact.
name: UI tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  # The number of shards; the matrix below lists 1..SHARDS.
  SHARDS: 4
  AVD_NAME: pf-e2e
  AVD_API: 34
  AVD_TARGET: google_apis
  AVD_ARCH: x86_64
  AVD_PROFILE: pixel_6
  AVD_CORES: 4
  AVD_RAM: 4096M
  AVD_DISK: 4096M
  AVD_OPTIONS: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -timezone Europe/Moscow

jobs:
  shard:
    name: Shard ${{ matrix.shard }} (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # A failed shard must not cancel the others: their results still count, and the run is red anyway.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      # The split (scripts/e2e-shards.py) and the reports job count on SHARDS; the matrix must list exactly 1..SHARDS.
      - name: Check the shard count
        env:
          JOBS: ${{ strategy.job-total }}
        run: |
          if [ "$JOBS" != "$SHARDS" ]; then
            echo "::error::the matrix has $JOBS shards, SHARDS is $SHARDS"
            exit 1
          fi

      # The runner image leaves ~5 GB free; the emulator's userdata partition alone needs more.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/android/sdk/ndk /usr/local/share/powershell /usr/share/swift
          df -h /

      # Hardware acceleration for the emulator on GitHub's Linux runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # Every shard builds the APKs itself, mostly from the build cache (~40 s): the native tests and the coverage
      # report need the Gradle build anyway, and a separate build job would delay every emulator (docs/e2e.md).
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' || matrix.shard != 1 }}

      - name: Build APKs
        run: ./gradlew :app:assembleMockE2e :app:assembleMockE2eAndroidTest --no-daemon --console=plain

      # Pinned: the reports job matches flows by the JUnit report Maestro writes, so a new version is a deliberate
      # change (bump it here and check one run), not something that arrives with the next run.
      - name: Install Maestro
        env:
          MAESTRO_VERSION: 2.11.0
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # Resolve the actual installed versions before selecting an AVD cache. The runner action also calls
      # sdkmanager, even on a hit; an AVD cache does not promise to avoid SDK downloads (docs/e2e.md).
      - name: Prepare SDK and fingerprint the AVD
        id: avd-key
        run: |
          python3 scripts/e2e-cache.py mark sdk-start
          # yes exits on SIGPIPE when sdkmanager has read all answers; only sdkmanager failure matters here.
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager --install emulator "system-images;android-${AVD_API};${AVD_TARGET};${AVD_ARCH}" --channel=0
          python3 scripts/e2e-cache.py key
          python3 scripts/e2e-cache.py mark restore-start

      # Separate restore/save: a post-job cache save would persist the device AFTER the financial tests.
      - name: Restore clean AVD
        id: avd-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.android/avd/${{ env.AVD_NAME }}.avd
            ~/.android/avd/${{ env.AVD_NAME }}.ini
          key: ${{ steps.avd-key.outputs.key }}

      - name: Validate restored AVD
        id: avd
        run: python3 scripts/e2e-cache.py validate

      - name: Create clean AVD snapshot
        if: steps.avd.outputs.usable != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ env.AVD_API }}
          target: ${{ env.AVD_TARGET }}
          arch: ${{ env.AVD_ARCH }}
          profile: ${{ env.AVD_PROFILE }}
          cores: ${{ env.AVD_CORES }}
          ram-size: ${{ env.AVD_RAM }}
          disk-size: ${{ env.AVD_DISK }}
          avd-name: ${{ env.AVD_NAME }}
          disable-animations: true
          force-avd-creation: true
          emulator-options: ${{ env.AVD_OPTIONS }} -no-snapshot-load -no-snapshot-save
          pre-emulator-launch-script: python3 scripts/e2e-cache.py mark create-boot-start
          script: python3 scripts/e2e-cache.py snapshot

      # Save only the pristine, stopped AVD, never adb keys, APKs, or the post-test writable device.
      - name: Seal clean AVD
        if: steps.avd.outputs.usable != 'true'
        run: python3 scripts/e2e-cache.py seal

      - name: Save clean AVD
        if: steps.avd.outputs.usable != 'true' && steps.avd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.android/avd/${{ env.AVD_NAME }}.avd
            ~/.android/avd/${{ env.AVD_NAME }}.ini
          key: ${{ steps.avd-key.outputs.key }}

      - name: Mark cache ready
        run: python3 scripts/e2e-cache.py mark cache-ready

      - name: Run UI tests from clean snapshot
        id: ui
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ env.AVD_API }}
          target: ${{ env.AVD_TARGET }}
          arch: ${{ env.AVD_ARCH }}
          profile: ${{ env.AVD_PROFILE }}
          cores: ${{ env.AVD_CORES }}
          ram-size: ${{ env.AVD_RAM }}
          disk-size: ${{ env.AVD_DISK }}
          avd-name: ${{ env.AVD_NAME }}
          disable-animations: true
          force-avd-creation: false
          emulator-options: ${{ env.AVD_OPTIONS }} -snapshot clean -no-snapshot-save
          pre-emulator-launch-script: python3 scripts/e2e-cache.py mark test-boot-start
          script: python3 scripts/e2e-cache.py test --shard ${{ matrix.shard }}/${{ env.SHARDS }}

      # Retry preparation only. Once e2e.sh starts, an assertion/native-test failure remains a failure.
      - name: Decide whether clean cold boot is needed
        id: fallback
        if: steps.ui.outcome == 'failure'
        run: python3 scripts/e2e-cache.py fallback

      - name: Run UI tests on a fresh AVD after snapshot boot failure
        id: cold-ui
        if: steps.ui.outcome == 'failure' && steps.fallback.outputs.needed == 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ env.AVD_API }}
          target: ${{ env.AVD_TARGET }}
          arch: ${{ env.AVD_ARCH }}
          profile: ${{ env.AVD_PROFILE }}
          cores: ${{ env.AVD_CORES }}
          ram-size: ${{ env.AVD_RAM }}
          disk-size: ${{ env.AVD_DISK }}
          avd-name: ${{ env.AVD_NAME }}
          disable-animations: true
          force-avd-creation: true
          emulator-options: ${{ env.AVD_OPTIONS }} -no-snapshot-load -no-snapshot-save -wipe-data
          pre-emulator-launch-script: python3 scripts/e2e-cache.py mark fallback-boot-start
          script: python3 scripts/e2e-cache.py test --cold --shard ${{ matrix.shard }}/${{ env.SHARDS }}

      - name: Preserve UI test failure
        if: steps.ui.outcome == 'failure' && steps.fallback.outputs.needed != 'true'
        run: exit 1

      - name: Emulator preparation timings
        if: always()
        run: python3 scripts/e2e-cache.py report

      # Whatever the shard ended with: the reports job needs the flows' report, execution data and logs of each one.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-shard-${{ matrix.shard }}
          path: build/e2e/
          retention-days: 3

  reports:
    name: Reports
    needs: shard
    # Also after a failed or timed-out shard: the other shards' results and coverage must not be lost. Not for a
    # cancelled run (a newer merge cancels it): nothing of it goes to Qase, and with fail-fast off a shard is cancelled
    # only together with the run.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      # No artifact at all (every shard failed before uploading) is not an error here: gather reports it.
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: e2e-shard-*
          path: build/e2e-shards

      # One Maestro report (a shard without one: its flows as failures), every shard's execution data and the native
      # tests' outputs where :e2eCoverageReport and qase-report.py read them.
      - name: Merge shard reports
        id: merge
        run: |
          {
            echo "### UI tests"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/e2e-shards.py gather --shards "$SHARDS" --dir build/e2e-shards --out build/e2e \
            --summary "$GITHUB_STEP_SUMMARY" --github-output "$GITHUB_OUTPUT"

      # The report does not fail the job: without data it is empty and the summary says so.
      - name: UI test coverage report
        continue-on-error: true
        run: ./gradlew :e2eCoverageReport --no-daemon --console=plain

      - name: Test report
        if: always()
        run: |
          {
            if [ -f build/e2e/maestro-report.xml ]; then
              python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("build/e2e/maestro-report.xml").getroot()
          rows = []
          for suite in root.iter("testsuite"):
              for c in suite.iter("testcase"):
                  failed = c.find("failure") is not None or c.find("error") is not None
                  rows.append(f"| {'❌' if failed else '✅'} | {c.get('name')} | {suite.get('name')} | {float(c.get('time') or 0):.0f} s |")
          print("| | Flow | Shard | Time |\n|---|---|---|---|\n" + "\n".join(rows))
          PY
            else
              echo "No merged Maestro report (merging the shards' reports failed)."
            fi
            echo
            python3 scripts/ui-coverage.py summary --jacoco build/reports/e2e-coverage/report.xml || echo "UI test coverage: the summary script failed."
          } >> "$GITHUB_STEP_SUMMARY"

      # One Qase run per merge to main for all shards (project PLAINFIN, cases in scripts/qase-cases.json). Cancelled
      # runs are not sent — neither a cancelled workflow (a newer merge cancels the run) nor one with a cancelled shard:
      # partial results would read as lost coverage; manual runs of a branch are not either — Qase tracks main.
      # Without the QASE_API_TOKEN secret the script only prints a notice; a Qase outage does not fail the job.
      - name: Send results to Qase
        if: ${{ !cancelled() && needs.shard.result != 'cancelled' && github.event_name == 'push' }}
        continue-on-error: true
        env:
          QASE_API_TOKEN: ${{ secrets.QASE_API_TOKEN }}
        run: |
          python3 scripts/qase-report.py \
            --title "UI tests · ${GITHUB_REF_NAME} · ${GITHUB_SHA::7}" \
            --description "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            build/e2e/maestro-report.xml \
            'app/build/outputs/androidTest-results/connected/**/TEST-*.xml'

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-reports
          path: |
            build/e2e/maestro-report.xml
            build/e2e/coverage/
            build/e2e-shards/
            build/reports/e2e-coverage/
            app/build/outputs/androidTest-results/
            app/build/outputs/code_coverage/
          retention-days: 14

      # Last, after everything is published: the run is red when any shard failed (fail-fast is off, so the matrix
      # result is `failure` if one shard failed and `success` only if all passed), and also when the merged report is
      # not a pass although every job was green — a shard's report that never arrived (the download above may fail),
      # flows missing from a report or failed in it.
      - name: Fail if a shard failed or its report is missing
        if: needs.shard.result != 'success' || steps.merge.outputs.incomplete == 'true'
        env:
          RESULT: ${{ needs.shard.result }}
          PROBLEMS: ${{ steps.merge.outputs.problems }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "::error::UI tests: at least one shard did not pass (matrix result: $RESULT); see the summary and the e2e-reports artifact"
          fi
          if [ -n "$PROBLEMS" ]; then
            echo "::error::UI tests: the merged report is incomplete or failed: $PROBLEMS"
          fi
          exit 1
