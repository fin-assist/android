# UI tests on an Android emulator: Maestro flows (.maestro/) and the native instrumented tests
# (app/src/androidTestMock) against the mock e2e build, then their code coverage (JaCoCo, docs/testing.md).
# Runs after a merge to main (a failed run is re-run from the Actions tab with «Re-run jobs»), or by hand for any
# branch («Run workflow») to check a flow or the coverage pipeline before the merge. Details: docs/e2e.md.
name: UI tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Maestro + instrumented (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      # The runner image leaves ~5 GB free; the emulator's userdata partition alone needs more.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/android/sdk/ndk /usr/local/share/powershell /usr/share/swift
          df -h /

      # Hardware acceleration for the emulator on GitHub's Linux runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build APKs
        run: ./gradlew :app:assembleMockE2e :app:assembleMockE2eAndroidTest --no-daemon --console=plain

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -timezone Europe/Moscow
          script: scripts/e2e.sh --no-build

      # Flows and instrumented tests leave JaCoCo execution data (scripts/e2e.sh pulls the flows', AGP the tests');
      # the report does not fail the job: without data it is empty and the summary says so.
      - name: UI test coverage report
        if: always()
        continue-on-error: true
        run: ./gradlew :e2eCoverageReport --no-daemon --console=plain

      - name: Test report
        if: always()
        run: |
          {
            echo "### UI tests"
            if [ -f build/e2e/maestro-report.xml ]; then
              python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("build/e2e/maestro-report.xml").getroot()
          cases = root.iter("testcase")
          rows = []
          for c in cases:
              failed = c.find("failure") is not None or c.find("error") is not None
              rows.append(f"| {'❌' if failed else '✅'} | {c.get('name')} | {float(c.get('time') or 0):.0f} s |")
          print("| | Flow | Time |\n|---|---|---|\n" + "\n".join(rows))
          PY
            else
              echo "No Maestro report (the run stopped before the flows)."
            fi
            # A workaround in a test must stay visible: the native test logs «FIN-63 workaround» when it had to
            # recreate the activity after a stalled sign-in. The issue stays open while this line shows up.
            if grep -rl "FIN-63 workaround" app/build/outputs/androidTest-results 2>/dev/null | grep -q .; then
              echo
              echo "> ⚠️ **FIN-63 workaround triggered**: the native test recreated the activity after a stalled sign-in — see \`logcat-*.txt\` in the \`e2e-reports\` artifact (breadcrumbs \`session …\` / \`ui session …\`)."
            fi
            echo
            python3 scripts/ui-coverage.py summary --jacoco build/reports/e2e-coverage/report.xml || echo "UI test coverage: the summary script failed."
          } >> "$GITHUB_STEP_SUMMARY"
          # Workflow commands are read from stdout, not from the summary file.
          if grep -rl "FIN-63 workaround" app/build/outputs/androidTest-results 2>/dev/null | grep -q .; then
            echo "::warning title=FIN-63::StatementPickerTest recreated the activity after a stalled sign-in; evidence in the e2e-reports artifact"
          fi

      # One Qase run per merge to main (project PLAINFIN, cases in scripts/qase-cases.json). Cancelled runs are not
      # sent (a newer merge cancels the run: its partial results would read as lost coverage); manual runs of a
      # branch are not either — Qase tracks main.
      # Without the QASE_API_TOKEN secret the script only prints a notice; a Qase outage does not fail the job.
      - name: Send results to Qase
        if: ${{ !cancelled() && github.event_name == 'push' }}
        continue-on-error: true
        env:
          QASE_API_TOKEN: ${{ secrets.QASE_API_TOKEN }}
        run: |
          python3 scripts/qase-report.py \
            --title "UI tests · ${GITHUB_REF_NAME} · ${GITHUB_SHA::7}" \
            --description "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            build/e2e/maestro-report.xml \
            'app/build/outputs/androidTest-results/connected/**/TEST-*.xml'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-reports
          path: |
            build/e2e/
            build/reports/e2e-coverage/
            app/build/outputs/androidTest-results/
            app/build/outputs/code_coverage/
            app/build/reports/androidTests/
          retention-days: 14
