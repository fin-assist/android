# UI tests on Android emulators: Maestro flows (.maestro/) and the native instrumented tests
# (app/src/androidTestMock) against the mock e2e build, then their code coverage (JaCoCo, docs/testing.md).
# Runs after a merge to main (a failed run is re-run from the Actions tab with «Re-run jobs»), or by hand for any
# branch («Run workflow») to check a flow or the coverage pipeline before the merge. Details: docs/e2e.md.
#
# The flows are split into shards, one emulator each (scripts/e2e-shards.py, docs/e2e.md «Shards in CI»); the
# native tests run on their own fresh emulator and process budget. The `reports` job merges what the shards left — whatever they ended with, unless the
# run was cancelled — into one Maestro report, one coverage report, one Qase run and the `e2e-reports` artifact.
name: UI tests

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sdk_benchmark:
        description: Run only the SDK package cache experiment (no emulator or UI)
        type: boolean
        default: false
      avd_cache:
        description: Opt in to the experimental clean AVD snapshot cache
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}${{ inputs.sdk_benchmark && '-sdk-benchmark' || '' }}
  cancel-in-progress: true

env:
  # The number of shards; the matrix below lists 1..SHARDS.
  SHARDS: 5
  # Shared by the actual process coordinator and the compact result's configuration metadata.
  MAESTRO_TEST_SECONDS: 2400
  NATIVE_TEST_SECONDS: 600
  COMPONENT_TEST_SECONDS: 900
  MAESTRO_VERSION: 2.11.0
  MAESTRO_SHA256: 5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a
  AVD_NAME: pf-e2e
  AVD_API: 34
  AVD_TARGET: google_apis
  AVD_ARCH: x86_64
  AVD_PROFILE: pixel_6
  AVD_CORES: 4
  AVD_RAM: 4096M
  AVD_DISK: 4096M
  AVD_DISABLE_ANIMATIONS: "true"
  AVD_OPTIONS: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -timezone Europe/Moscow

jobs:
  sdk-benchmark:
    if: github.event_name == 'workflow_dispatch' && inputs.sdk_benchmark
    permissions:
      contents: read
    uses: ./.github/workflows/sdk-preparation-benchmark.yml

  shard:
    if: github.event_name != 'workflow_dispatch' || !inputs.sdk_benchmark
    name: Shard ${{ matrix.shard }} (emulator)
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    strategy:
      # A failed shard must not cancel the others: their results still count, and the run is red anyway.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v7

      - name: Initialize execution evidence
        run: python3 scripts/e2e_execution.py init

      # The split (scripts/e2e-shards.py) and the reports job count on SHARDS; the matrix must list exactly 1..SHARDS.
      - name: Check the shard count
        env:
          JOBS: ${{ strategy.job-total }}
        run: |
          if [ "$JOBS" != "$SHARDS" ]; then
            echo "::error::the matrix has $JOBS shards, SHARDS is $SHARDS"
            exit 1
          fi

      # The runner image leaves ~5 GB free; the emulator's userdata partition alone needs more.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/android/sdk/ndk /usr/local/share/powershell /usr/share/swift
          df -h /

      # Hardware acceleration for the emulator on GitHub's Linux runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # Every shard builds the APKs itself, mostly from the build cache (~40 s): the native tests and the coverage
      # report need the Gradle build anyway, and a separate build job would delay every emulator (docs/e2e.md).
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' || matrix.shard != 1 }}

      - name: Build APKs
        timeout-minutes: 10
        run: |
          status=0
          python3 scripts/e2e-cache.py run-command --timeout 540 -- ./gradlew :app:assembleMockE2e :app:assembleMockE2eAndroidTest --no-daemon --console=plain || status=$?
          if [ "$status" != 0 ]; then python3 scripts/e2e_execution.py finish "$status"; exit "$status"; fi
          python3 scripts/e2e_execution.py identity

      # Pinned: the reports job matches flows by the JUnit report Maestro writes, so a new version is a deliberate
      # change (bump it here and check one run), not something that arrives with the next run.
      - name: Restore pinned Maestro archive
        id: maestro-cache
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/maestro-package
          key: maestro-archive-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.MAESTRO_VERSION }}-${{ env.MAESTRO_SHA256 }}

      - name: Install Maestro
        id: maestro-install
        timeout-minutes: 6
        run: bash scripts/install-maestro.sh

      - name: Save verified Maestro archive
        if: matrix.shard == 1 && steps.maestro-install.outcome == 'success' && steps.maestro-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/maestro-package
          key: maestro-archive-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.MAESTRO_VERSION }}-${{ env.MAESTRO_SHA256 }}

      # SDK caches contain only binaries, never AVD state or adb keys. Prefix restore may select an older
      # revision, so online SDK checks always run before immutable final keys are computed.
      - name: Select SDK package caches
        id: sdk-paths
        run: |
          python3 scripts/e2e-cache.py mark sdk-start
          python3 scripts/e2e-sdk-cache.py paths

      - name: Restore emulator SDK package
        id: sdk-emulator
        if: steps.sdk-paths.outputs.emulator-restore == 'true'
        continue-on-error: true
        timeout-minutes: 2
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 2
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.sdk-paths.outputs.emulator-path }}
          key: ${{ steps.sdk-paths.outputs.emulator-prefix }}lookup
          restore-keys: ${{ steps.sdk-paths.outputs.emulator-prefix }}

      - name: Restore system image SDK package
        id: sdk-image
        if: steps.sdk-paths.outputs.image-restore == 'true'
        continue-on-error: true
        timeout-minutes: 2
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 2
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.sdk-paths.outputs.image-path }}
          key: ${{ steps.sdk-paths.outputs.image-prefix }}lookup
          restore-keys: ${{ steps.sdk-paths.outputs.image-prefix }}

      - name: Recover missing or failed SDK restores
        env:
          EMULATOR_OUTCOME: ${{ steps.sdk-emulator.outcome }}
          EMULATOR_MATCHED_KEY: ${{ steps.sdk-emulator.outputs.cache-matched-key }}
          IMAGE_OUTCOME: ${{ steps.sdk-image.outcome }}
          IMAGE_MATCHED_KEY: ${{ steps.sdk-image.outputs.cache-matched-key }}
        run: python3 scripts/e2e-sdk-cache.py recover

      - name: Prepare current SDK packages
        id: sdk-install
        run: |
          sdkmanager_path="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # yes exits on SIGPIPE when sdkmanager has read all answers; only sdkmanager failure matters here.
          set +o pipefail
          yes | timeout 120 "$sdkmanager_path" --licenses >/dev/null
          set -o pipefail
          timeout 600 "$sdkmanager_path" --install platform-tools emulator "system-images;android-${AVD_API};${AVD_TARGET};${AVD_ARCH}" --channel=0
          python3 scripts/e2e-sdk-cache.py finalize

      # One shard publishes actual online-installed revisions, strictly before starting any emulator/tests.
      - name: Save current emulator SDK package
        if: matrix.shard == 1 && steps.sdk-install.outputs.emulator-save == 'true'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.sdk-paths.outputs.emulator-path }}
          key: ${{ steps.sdk-install.outputs.emulator-key }}

      - name: Save current system image SDK package
        if: matrix.shard == 1 && steps.sdk-install.outputs.image-save == 'true'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.sdk-paths.outputs.image-path }}
          key: ${{ steps.sdk-install.outputs.image-key }}

      - name: Finish SDK preparation timings
        run: |
          python3 scripts/e2e-sdk-cache.py complete
          python3 scripts/e2e-cache.py mark sdk-ready
          python3 scripts/e2e_execution.py identity
          python3 scripts/e2e_execution.py phase device

      - name: Fingerprint the optional AVD cache
        id: avd-key
        if: inputs.avd_cache
        run: |
          python3 scripts/e2e-cache.py key
          python3 scripts/e2e-cache.py mark restore-start

      - name: Initialize disposable CI adb key
        if: inputs.avd_cache
        run: python3 scripts/e2e-cache.py adb-init

      # Separate restore/save: a post-job cache save would persist the device AFTER the financial tests.
      - name: Restore clean AVD
        if: inputs.avd_cache
        id: avd-cache
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.android/avd/${{ env.AVD_NAME }}.avd
            ~/.android/avd/${{ env.AVD_NAME }}.ini
            ~/.android/adbkey
            ~/.android/adbkey.pub
            ~/.android/finassist-ci-adb.json
          key: ${{ steps.avd-key.outputs.key }}

      - name: Validate restored AVD
        if: inputs.avd_cache
        id: avd
        continue-on-error: true
        run: python3 scripts/e2e-cache.py validate

      - name: Create clean AVD snapshot
        id: create
        continue-on-error: true
        if: inputs.avd_cache && steps.avd.outcome == 'success' && steps.avd.outputs.usable != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ env.AVD_API }}
          target: ${{ env.AVD_TARGET }}
          arch: ${{ env.AVD_ARCH }}
          profile: ${{ env.AVD_PROFILE }}
          cores: ${{ env.AVD_CORES }}
          ram-size: ${{ env.AVD_RAM }}
          disk-size: ${{ env.AVD_DISK }}
          avd-name: ${{ env.AVD_NAME }}
          disable-animations: ${{ env.AVD_DISABLE_ANIMATIONS }}
          force-avd-creation: true
          emulator-options: ${{ env.AVD_OPTIONS }} -no-snapshot-load -no-snapshot-save
          pre-emulator-launch-script: python3 scripts/e2e-cache.py mark create-boot-start
          script: python3 scripts/e2e-cache.py snapshot

      # Save only the pristine, stopped AVD and its generated disposable CI adb pair. Never cache
      # developer keys, APKs or the post-test writable device (the helper verifies key provenance).
      - name: Seal clean AVD
        id: seal
        continue-on-error: true
        if: inputs.avd_cache && steps.create.outcome == 'success'
        run: python3 scripts/e2e-cache.py seal

      - name: Save clean AVD
        continue-on-error: true
        if: inputs.avd_cache && steps.seal.outcome == 'success' && steps.avd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.android/avd/${{ env.AVD_NAME }}.avd
            ~/.android/avd/${{ env.AVD_NAME }}.ini
            ~/.android/adbkey
            ~/.android/adbkey.pub
            ~/.android/finassist-ci-adb.json
          key: ${{ steps.avd-key.outputs.key }}

      - name: Mark cache ready
        if: inputs.avd_cache && steps.avd.outcome == 'success' && (steps.avd.outputs.usable == 'true' || steps.seal.outcome == 'success')
        run: python3 scripts/e2e-cache.py mark cache-ready

      - name: Run UI tests from clean snapshot
        id: ui
        if: inputs.avd_cache && steps.avd.outcome == 'success' && (steps.avd.outputs.usable == 'true' || steps.seal.outcome == 'success')
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ env.AVD_API }}
          target: ${{ env.AVD_TARGET }}
          arch: ${{ env.AVD_ARCH }}
          profile: ${{ env.AVD_PROFILE }}
          cores: ${{ env.AVD_CORES }}
          ram-size: ${{ env.AVD_RAM }}
          # First boot may raise requested userdata size to the image minimum (6 GiB on API 34).
          # Reapplying the original requested 4 GiB changes hardware.ini and invalidates the snapshot.
          disk-size: ${{ steps.avd.outputs.disk-size || steps.seal.outputs.disk-size }}
          avd-name: ${{ env.AVD_NAME }}
          disable-animations: ${{ env.AVD_DISABLE_ANIMATIONS }}
          force-avd-creation: false
          emulator-options: ${{ env.AVD_OPTIONS }} -snapshot clean -no-snapshot-save
          pre-emulator-launch-script: python3 scripts/e2e-cache.py mark test-boot-start
          script: python3 scripts/e2e-cache.py test --shard ${{ matrix.shard }}/${{ env.SHARDS }} --timeout "$MAESTRO_TEST_SECONDS"

      # Publish tiny sanitized preparation telemetry before a fallback starts, so it is readable while tests run.
      - name: Publish failed snapshot preparation diagnostics
        if: inputs.avd_cache && steps.ui.outcome != 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: e2e-preparation-${{ matrix.shard }}
          path: build/e2e/preparation.json
          retention-days: 14

      # Validation, snapshot creation, sealing, or snapshot boot may fail before UI tests start.
      # Retry preparation only. Once e2e.sh starts, an assertion/native-test failure remains a failure.
      - name: Decide whether clean cold boot is needed
        id: fallback
        if: inputs.avd_cache && steps.ui.outcome != 'success'
        run: python3 scripts/e2e-cache.py fallback

      - name: Initialize fresh fallback CI adb key
        if: inputs.avd_cache && steps.fallback.outputs.needed == 'true'
        run: python3 scripts/e2e-cache.py adb-init

      - name: Run UI tests on a fresh AVD after snapshot boot failure
        id: cold-ui
        if: inputs.avd_cache && steps.fallback.outputs.needed == 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ env.AVD_API }}
          target: ${{ env.AVD_TARGET }}
          arch: ${{ env.AVD_ARCH }}
          profile: ${{ env.AVD_PROFILE }}
          cores: ${{ env.AVD_CORES }}
          ram-size: ${{ env.AVD_RAM }}
          disk-size: ${{ env.AVD_DISK }}
          avd-name: ${{ env.AVD_NAME }}
          disable-animations: ${{ env.AVD_DISABLE_ANIMATIONS }}
          force-avd-creation: true
          emulator-options: ${{ env.AVD_OPTIONS }} -no-snapshot-load -no-snapshot-save -wipe-data
          pre-emulator-launch-script: python3 scripts/e2e-cache.py mark fallback-boot-start
          script: python3 scripts/e2e-cache.py test --cold --shard ${{ matrix.shard }}/${{ env.SHARDS }} --timeout "$MAESTRO_TEST_SECONDS"

      - name: Preserve UI test failure
        if: inputs.avd_cache && steps.ui.outcome != 'success' && steps.fallback.outputs.needed != 'true'
        run: exit 1

      - name: Run UI tests on a fresh cold AVD
        id: direct-ui
        if: ${{ !inputs.avd_cache }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ env.AVD_API }}
          target: ${{ env.AVD_TARGET }}
          arch: ${{ env.AVD_ARCH }}
          profile: ${{ env.AVD_PROFILE }}
          cores: ${{ env.AVD_CORES }}
          ram-size: ${{ env.AVD_RAM }}
          disk-size: ${{ env.AVD_DISK }}
          avd-name: ${{ env.AVD_NAME }}
          disable-animations: ${{ env.AVD_DISABLE_ANIMATIONS }}
          force-avd-creation: true
          emulator-options: ${{ env.AVD_OPTIONS }} -no-snapshot-load -no-snapshot-save -wipe-data
          pre-emulator-launch-script: python3 scripts/e2e-cache.py mark direct-boot-start
          script: python3 scripts/e2e-cache.py test --direct-cold --shard ${{ matrix.shard }}/${{ env.SHARDS }} --timeout "$MAESTRO_TEST_SECONDS"

      - name: Emulator preparation timings
        if: always()
        run: python3 scripts/e2e-cache.py report

      - name: Finalize execution evidence
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: python3 scripts/e2e_execution.py finish "$JOB_STATUS"

      # Whatever the shard ended with: the reports job needs the flows' report, execution data and logs of each one.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-shard-${{ matrix.shard }}
          # Raw output may still have writers after a failed exit check; keep the other reports uploadable.
          path: |
            build/e2e/
            !build/e2e/maestro/**
          retention-days: 14

  native:
    if: github.event_name != 'workflow_dispatch' || !inputs.sdk_benchmark
    name: Native (fresh emulator)
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Initialize execution evidence
        run: python3 scripts/e2e_execution.py init

      # The runner image leaves ~5 GB free; the emulator's userdata partition alone needs more.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/android/sdk/ndk /usr/local/share/powershell /usr/share/swift
          df -h /

      # Hardware acceleration for the emulator on GitHub's Linux runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # Every shard builds the APKs itself, mostly from the build cache (~40 s): the native tests and the coverage
      # report need the Gradle build anyway, and a separate build job would delay every emulator (docs/e2e.md).
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Build APKs
        timeout-minutes: 10
        run: |
          status=0
          python3 scripts/e2e-cache.py run-command --timeout 540 -- ./gradlew :app:assembleMockE2e :app:assembleMockE2eAndroidTest --no-daemon --console=plain || status=$?
          if [ "$status" != 0 ]; then python3 scripts/e2e_execution.py finish "$status"; exit "$status"; fi
          python3 scripts/e2e_execution.py identity

      # SDK caches contain only binaries, never AVD state or adb keys. Prefix restore may select an older
      # revision, so online SDK checks always run before immutable final keys are computed.
      - name: Select SDK package caches
        id: sdk-paths
        run: |
          python3 scripts/e2e-cache.py mark sdk-start
          python3 scripts/e2e-sdk-cache.py paths

      - name: Restore emulator SDK package
        id: sdk-emulator
        if: steps.sdk-paths.outputs.emulator-restore == 'true'
        continue-on-error: true
        timeout-minutes: 2
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 2
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.sdk-paths.outputs.emulator-path }}
          key: ${{ steps.sdk-paths.outputs.emulator-prefix }}lookup
          restore-keys: ${{ steps.sdk-paths.outputs.emulator-prefix }}

      - name: Restore system image SDK package
        id: sdk-image
        if: steps.sdk-paths.outputs.image-restore == 'true'
        continue-on-error: true
        timeout-minutes: 2
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 2
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.sdk-paths.outputs.image-path }}
          key: ${{ steps.sdk-paths.outputs.image-prefix }}lookup
          restore-keys: ${{ steps.sdk-paths.outputs.image-prefix }}

      - name: Recover missing or failed SDK restores
        env:
          EMULATOR_OUTCOME: ${{ steps.sdk-emulator.outcome }}
          EMULATOR_MATCHED_KEY: ${{ steps.sdk-emulator.outputs.cache-matched-key }}
          IMAGE_OUTCOME: ${{ steps.sdk-image.outcome }}
          IMAGE_MATCHED_KEY: ${{ steps.sdk-image.outputs.cache-matched-key }}
        run: python3 scripts/e2e-sdk-cache.py recover

      - name: Prepare current SDK packages
        id: sdk-install
        run: |
          sdkmanager_path="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # yes exits on SIGPIPE when sdkmanager has read all answers; only sdkmanager failure matters here.
          set +o pipefail
          yes | timeout 120 "$sdkmanager_path" --licenses >/dev/null
          set -o pipefail
          timeout 600 "$sdkmanager_path" --install platform-tools emulator "system-images;android-${AVD_API};${AVD_TARGET};${AVD_ARCH}" --channel=0
          python3 scripts/e2e-sdk-cache.py finalize

      - name: Finish SDK preparation timings
        run: |
          python3 scripts/e2e-sdk-cache.py complete
          python3 scripts/e2e-cache.py mark sdk-ready
          python3 scripts/e2e_execution.py identity
          python3 scripts/e2e_execution.py phase device

      - name: Run native UI tests on a fresh cold AVD
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ env.AVD_API }}
          target: ${{ env.AVD_TARGET }}
          arch: ${{ env.AVD_ARCH }}
          profile: ${{ env.AVD_PROFILE }}
          cores: ${{ env.AVD_CORES }}
          ram-size: ${{ env.AVD_RAM }}
          disk-size: ${{ env.AVD_DISK }}
          avd-name: ${{ env.AVD_NAME }}
          disable-animations: ${{ env.AVD_DISABLE_ANIMATIONS }}
          force-avd-creation: true
          emulator-options: ${{ env.AVD_OPTIONS }} -no-snapshot-load -no-snapshot-save -wipe-data
          pre-emulator-launch-script: python3 scripts/e2e-cache.py mark direct-boot-start
          script: python3 scripts/e2e-cache.py test --direct-cold --native-only --timeout "$NATIVE_TEST_SECONDS"

      - name: Emulator preparation timings
        if: always()
        run: python3 scripts/e2e-cache.py report
      - name: Finalize execution evidence
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: python3 scripts/e2e_execution.py finish "$JOB_STATUS"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-native
          path: build/e2e/
          retention-days: 14

  components:
    if: github.event_name != 'workflow_dispatch' || !inputs.sdk_benchmark
    name: Analytics UI components (JVM)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Initialize execution evidence
        run: python3 scripts/e2e_execution.py init
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Test Analytics UI components
        run: |
          python3 scripts/e2e_execution.py identity
          python3 scripts/e2e_execution.py phase components
          status=0
          python3 scripts/e2e-cache.py run-command --timeout "$COMPONENT_TEST_SECONDS" -- ./gradlew :feature:analytics:impl:testDebugUnitTest --tests '*AnalyticsReliabilityComponentTest' --no-daemon --console=plain || status=$?
          python3 scripts/e2e_execution.py finish "$status"
          exit "$status"
      - name: Finalize component evidence
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          python3 scripts/e2e_execution.py finish "$JOB_STATUS"
          mkdir -p build/e2e-components
          cp build/e2e/execution.json build/e2e-components/
          report=feature/analytics/impl/build/test-results/testDebugUnitTest/TEST-ru.finassist.pf.feature.analytics.impl.ui.AnalyticsReliabilityComponentTest.xml
          if [ -f "$report" ]; then cp "$report" build/e2e-components/; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-components
          path: build/e2e-components/
          retention-days: 14

  reports:
    name: Reports
    needs: [shard, native, components]
    # Also after a failed or timed-out shard: the other shards' results and coverage must not be lost. Not for a
    # cancelled run (a newer merge cancels it): nothing of it goes to Qase, and with fail-fast off a shard is cancelled
    # only together with the run.
    if: ${{ !cancelled() && !inputs.sdk_benchmark }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      # No artifact at all (every shard failed before uploading) is not an error here: gather reports it.
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: e2e-shard-*
          path: build/e2e-shards

      - name: Download native evidence
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: e2e-native
          path: build/e2e-native

      - name: Download component evidence
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: e2e-components
          path: build/e2e-components

      # One Maestro report (a shard without one: its flows as failures), every shard's execution data and the native
      # tests' outputs where :e2eCoverageReport and qase-report.py read them.
      - name: Merge shard reports
        id: merge
        run: |
          {
            echo "### UI tests"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/e2e-shards.py gather --shards "$SHARDS" --dir build/e2e-shards --out build/e2e \
            --native-dir build/e2e-native --jvm-dir build/e2e-components \
            --summary "$GITHUB_STEP_SUMMARY" --github-output "$GITHUB_OUTPUT"

      # The report does not fail the job: without data it is empty and the summary says so.
      - name: UI test coverage report
        continue-on-error: true
        timeout-minutes: 10
        run: timeout --kill-after=10s 540s ./gradlew :e2eCoverageReport --no-daemon --console=plain

      - name: Test report
        if: always()
        run: |
          # Gather above is the authoritative result table, including NOT RUN/skipped and setup causes.
          python3 scripts/ui-coverage.py summary --jacoco build/reports/e2e-coverage/report.xml >> "$GITHUB_STEP_SUMMARY" || echo "UI test coverage: the summary script failed." >> "$GITHUB_STEP_SUMMARY"

      # One Qase run per merge to main for all shards (project PLAINFIN, cases in scripts/qase-cases.json). Cancelled
      # runs are not sent — neither a cancelled workflow (a newer merge cancels the run) nor one with a cancelled shard:
      # partial results would read as lost coverage; manual runs of a branch are not either — Qase tracks main.
      # Without the QASE_API_TOKEN secret the script only prints a notice; a Qase outage does not fail the job.
      - name: Send results to Qase
        if: ${{ !cancelled() && needs.shard.result != 'cancelled' && needs.native.result != 'cancelled' && needs.components.result != 'cancelled' && github.event_name == 'push' }}
        continue-on-error: true
        env:
          QASE_API_TOKEN: ${{ secrets.QASE_API_TOKEN }}
        run: |
          python3 scripts/qase-report.py \
            --title "UI tests · ${GITHUB_REF_NAME} · ${GITHUB_SHA::7}" \
            --description "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            build/e2e/maestro-report.xml \
            'app/build/outputs/androidTest-results/connected/**/TEST-*.xml' \
            --jvm-reports build/e2e/jvm-report.xml \
            --delivery-status build/e2e/qase-delivery.json

      - name: Qase delivery status
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          try:
              status = json.loads(Path("build/e2e/qase-delivery.json").read_text())
          except (OSError, ValueError):
              status = {}
          if not isinstance(status, dict):
              status = {}
          labels = {
              "published": "published", "not_configured": "NOT CONFIRMED (token unavailable)",
              "failed": "NOT CONFIRMED (delivery failed)", "pending": "NOT CONFIRMED (pending)",
              "dry_run": "NOT PUBLISHED (dry run)", "empty": "NOT PUBLISHED (empty result set)",
          }
          print("\nQase delivery: " + labels.get(status.get("result"), "NOT CONFIRMED (no valid status record)"))
          run_id = status.get("run_id")
          if status.get("result") == "published" and type(run_id) is int and run_id > 0:
              print(f"[Qase run {run_id}](https://app.qase.io/run/PLAINFIN/dashboard/{run_id})")
          PY

      - name: Package compact UI result
        id: compact
        if: always()
        env:
          E2E_SHARD_RESULT: ${{ needs.shard.result }}
          E2E_NATIVE_RESULT: ${{ needs.native.result }}
          E2E_COMPONENT_RESULT: ${{ needs.components.result }}
        run: |
          python3 scripts/e2e-result.py \
            --maestro-budget-seconds "$MAESTRO_TEST_SECONDS" \
            --native-budget-seconds "$NATIVE_TEST_SECONDS" \
            --jvm-budget-seconds "$COMPONENT_TEST_SECONDS"

      - name: Upload compact UI result
        uses: actions/upload-artifact@v7
        if: ${{ always() && steps.compact.outcome == 'success' }}
        with:
          name: e2e-result-attempt-${{ github.run_attempt }}
          path: build/e2e-result/
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-reports
          path: |
            build/e2e/maestro-report.xml
            build/e2e/native-report.xml
            build/e2e/jvm-report.xml
            build/e2e/execution-status.json
            build/e2e/expected-tests.json
            build/e2e/qase-delivery.json
            build/e2e/coverage/
            build/e2e-native/
            build/e2e-components/
            build/e2e-shards/
            build/reports/e2e-coverage/
            app/build/outputs/androidTest-results/
            app/build/outputs/code_coverage/
          retention-days: 14

      # Last, after everything is published: the run is red when any shard failed (fail-fast is off, so the matrix
      # result is `failure` if one shard failed and `success` only if all passed), and also when the merged report is
      # not a pass although every job was green — a shard's report that never arrived (the download above may fail),
      # flows missing from a report or failed in it.
      - name: Fail if a shard failed or its report is missing
        if: needs.shard.result != 'success' || needs.native.result != 'success' || needs.components.result != 'success' || steps.merge.outputs.incomplete == 'true' || steps.merge.outcome != 'success'
        env:
          RESULT: ${{ needs.shard.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          COMPONENT_RESULT: ${{ needs.components.result }}
          PROBLEMS: ${{ steps.merge.outputs.problems }}
        run: |
          if [ "$RESULT" != "success" ] || [ "$NATIVE_RESULT" != "success" ] || [ "$COMPONENT_RESULT" != "success" ]; then
            echo "::error::UI tests did not pass: Maestro=$RESULT native=$NATIVE_RESULT components=$COMPONENT_RESULT; see the e2e-reports artifact"
          fi
          if [ -n "$PROBLEMS" ]; then
            echo "::error::UI tests: the merged report is incomplete or failed: $PROBLEMS"
          fi
          exit 1
