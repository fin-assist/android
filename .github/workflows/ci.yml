name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, lint (mock flavor)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Module dependency rules are checked during configuration: a violation fails here.
      - name: Configure
        run: ./gradlew help --no-daemon

      - name: Unit tests
        run: ./gradlew testMockDebugUnitTest testDebugUnitTest test --continue --no-daemon

      - name: Lint
        run: ./gradlew lintMockDebug --no-daemon

      - name: Assemble
        run: ./gradlew assembleMockDebug --no-daemon

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-mock-debug
          path: app/build/outputs/apk/mock/debug/*.apk
          retention-days: 14
