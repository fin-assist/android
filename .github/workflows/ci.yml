name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Module graph rules run at configuration time: a violation fails here, before any compilation.
      - name: Check module rules
        run: ./gradlew help --no-daemon 2>&1 | tee -a build.log

      - name: Check flags registry matches docs/flags.md
        run: ./scripts/check-flags.sh 2>&1 | tee -a build.log

      - name: Unit tests
        run: set -o pipefail; ./gradlew testMockDebugUnitTest testDebugUnitTest --continue --no-daemon 2>&1 | tee -a build.log

      - name: Lint
        run: set -o pipefail; ./gradlew lintMockDebug --no-daemon 2>&1 | tee -a build.log

      - name: Assemble mock debug
        run: set -o pipefail; ./gradlew assembleMockDebug --no-daemon 2>&1 | tee -a build.log

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-mock-debug
          path: app/build/outputs/apk/mock/debug/*.apk
          retention-days: 14

      # Raw job logs are not reachable from every environment; on failure, post the relevant excerpt on the PR.
      - name: Report failure on the PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### CI failed (run ${{ github.run_id }}, \`${GITHUB_SHA::7}\`)"
            echo '```'
            grep -nE "^e: |error:|FAILED|What went wrong|Exception|> Task .* FAILED|tests completed|Execution failed" build.log | head -80
            echo '--- tail ---'
            tail -n 60 build.log
            echo '```'
            for f in $(find . -path "*/test-results/*" -name "*.xml" 2>/dev/null); do
              if grep -q "<failure" "$f"; then echo "#### $f"; echo '```'; grep -A12 "<failure" "$f" | head -60; echo '```'; fi
            done
          } > comment.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file comment.md
