name: CI

on:
  push:
    branches: [main, 'release/**', 'stage-*/**']
  pull_request:

# Read-only by default; each job asks for what it writes (commit comments on failure, the coverage comment on the PR).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The Gradle checks run as three parallel jobs (FIN-176): unit tests with coverage, lint, and the build of the
# variants with the build separation checks. Each one configures the project, so a violation of the module dependency
# rules fails all three in their first Gradle call. Every job reads the shared Gradle cache (setup-gradle) and writes
# it from main and release branches only: a PR reads its base branch's cache first, and PRs target the current release
# branch, so a cache written from main alone would be from older code and miss the compile tasks (FIN-181). On failure
# each job posts the tail of its own build.log as a commit comment.
jobs:
  # AGENTS.md is the agents' map of the repo; stale generated blocks or registries out of sync with the code
  # fail here, in seconds and without Gradle (scripts/agent-docs.py).
  agent-docs:
    name: Agent docs up to date
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - name: Test the scripts (agent-docs parsers, Qase report and case map, UI coverage, design-check export)
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      # Both PR directions matter: feature → release and release → main, as well as direct release pushes.
      - name: App version matches the release branch
        run: python3 scripts/check-app-version.py

      # Which screens and test tags the Maestro flows refer to (docs/testing.md, «UI test coverage»). Static, no
      # device: the number next to the code coverage the UI-tests workflow measures after a merge.
      - name: Scenario coverage of the flows
        run: python3 scripts/ui-coverage.py summary --summary "$GITHUB_STEP_SUMMARY"

      - name: Check AGENTS.md and docs registries
        run: python3 scripts/agent-docs.py --check

      # :core:api and :mock:backend go to Kotlin Multiplatform when iOS starts: no JVM-only APIs or dependencies
      # beyond scripts/kmp-baseline.json (FIN-144, docs/kmp-readiness.md).
      - name: No new JVM-only code in core/api and mock/backend
        run: python3 scripts/check-kmp-ready.py

  unit-tests:
    name: Unit tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write        # commit comment on failure
      pull-requests: write   # coverage comment on the PR
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: coverage of changed lines diffs the PR against its base branch.
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/release/') }}

      # Robolectric fetches the Android framework jars (android-all-instrumented, one per SDK) into ~/.m2 the first time
      # a test needs them; setup-gradle caches ~/.gradle only. Without this cache every job downloads them from Maven
      # Central, and a failed download fails every Robolectric test of the run (FIN-90). The jars depend on the
      # Robolectric version and the SDK levels the tests run on (`@Config(sdk = …)`, `robolectric.properties`, else
      # targetSdk), so both are in the key; a new key starts from the previous version's jars (restore-keys).
      - name: Robolectric cache key
        id: robolectric
        run: |
          version=$(sed -n 's/^robolectric = "\(.*\)"$/\1/p' gradle/libs.versions.toml)
          sdks=$( {
            grep -rhoE 'sdk *= *(\[[^]]*\]|[0-9][0-9, ]*)' --include='*.kt' --include=robolectric.properties --exclude-dir=build --exclude-dir=.git .
            grep -E '^(compileSdk|targetSdk) =' gradle/libs.versions.toml
          } | sort -u | sha256sum | cut -c1-12)
          echo "prefix=robolectric-$version-" >> "$GITHUB_OUTPUT"
          echo "key=robolectric-$version-$sdks" >> "$GITHUB_OUTPUT"

      - name: Restore Robolectric jars
        id: robolectric-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: ${{ steps.robolectric.outputs.key }}
          restore-keys: ${{ steps.robolectric.outputs.prefix }}

      # PR: `unitTest` of every module — the variant the coverage is measured on (jvm, debug of libraries, mockDebug
      # of the app; build-logic Coverage.kt). Push (main, release/**, stage-*/**): `test`, the unit tests of every
      # variant — release, local, prod and e2e included — so a test failing only there is caught before a release.
      - name: Unit tests
        id: unit-tests
        env:
          TEST_TASK: ${{ github.event_name == 'pull_request' && 'unitTest' || 'test' }}
        run: ./gradlew "$TEST_TASK" :build-logic:convention:test --continue --no-daemon 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}

      # Saved from main and release branches only, like the Gradle cache: their caches are the ones every PR can read.
      # Only after green tests: then every jar a test needed has been fetched, and an entry, once saved, never changes.
      - name: Save Robolectric jars
        if: >-
          steps.unit-tests.outcome == 'success' && steps.robolectric-cache.outputs.cache-hit != 'true' &&
          github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
        uses: actions/cache/save@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: ${{ steps.robolectric.outputs.key }}

      # Kover instruments the test runs above; the report reuses them (docs/testing.md). Root tasks only (`:…`): an
      # unqualified name would also build a separate report in every module. Informational for now: the numbers go
      # to the run summary, nothing fails on a low value, and a script error does not fail the build either.
      - name: Coverage report
        run: ./gradlew :koverXmlReportUnit :koverHtmlReportUnit --no-daemon 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}

      # Full table in the run summary; a capped one (50 files, short cells) for the PR comment below. The branch
      # name goes through env, never into the script text.
      - name: Coverage of changed lines
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          rm -f coverage.md
          python3 scripts/coverage-diff.py --base "origin/$BASE_REF" --summary "$GITHUB_STEP_SUMMARY" --full
          python3 scripts/coverage-diff.py --base "origin/$BASE_REF" --summary coverage.md > /dev/null

      - name: Coverage of the project
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: python3 scripts/coverage-diff.py --summary "$GITHUB_STEP_SUMMARY"

      # One comment per PR, found by its marker and edited on every push. PRs from forks get a read-only token,
      # so they are skipped; a failed post never fails the build.
      - name: Coverage comment on the PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && hashFiles('coverage.md') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          marker='<!-- coverage-report (ci.yml) -->'
          {
            echo "$marker"
            cat coverage.md
            echo
            echo "<sub>Commit ${HEAD_SHA::7} · [CI run]($RUN_URL) · HTML report: artifact \`coverage-report\` · docs/testing.md</sub>"
          } > comment.md
          id=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate \
            | jq -rs --arg m "$marker" \
              '[.[][] | select(.user.login == "github-actions[bot]" and (.body | startswith($m)))][0].id // empty')
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$id" -F body=@comment.md > /dev/null
          else
            gh api "repos/${{ github.repository }}/issues/$PR/comments" -F body=@comment.md > /dev/null
          fi

      - uses: actions/upload-artifact@v7
        if: always() && hashFiles('build/reports/kover/**') != ''
        with:
          name: coverage-report
          path: build/reports/kover/
          retention-days: 14

      # Raw logs are not reachable through the API from every environment; the tail of a failed build is posted
      # as a commit comment so it can be read via REST.
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_NAME: Unit tests and coverage
        run: |
          {
            echo "CI failed on \`${{ github.workflow }} / $JOB_NAME\` — last lines of the build log:"
            echo
            echo '```'
            # Compiler errors and failed tests first (these are what matters), then the Gradle failure summary.
            grep -E "^e: |error:|Unresolved reference|Test.*FAILED|tests completed|FAILED$" build.log | head -n 120
            echo "--- summary ---"
            grep -E "^(> Task .* FAILED|FAILURE|\* What went wrong|\* Where|Caused by|Execution failed|Could not|Build file|Line:)" build.log | tail -n 40
            echo '```'
          } > comment.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -f body="$(cat comment.md)" >/dev/null

  lint:
    name: Lint (mock flavor)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write        # commit comment on failure
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/release/') }}

      - name: Lint
        run: ./gradlew lintMockDebug --no-daemon 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_NAME: Lint (mock flavor)
        run: |
          {
            echo "CI failed on \`${{ github.workflow }} / $JOB_NAME\` — last lines of the build log:"
            echo
            echo '```'
            grep -E "^e: |error:|Error:|Unresolved reference|FAILED$" build.log | head -n 120
            echo "--- summary ---"
            grep -E "^(> Task .* FAILED|FAILURE|\* What went wrong|\* Where|Caused by|Execution failed|Could not|Build file|Line:)" build.log | tail -n 40
            echo '```'
          } > comment.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -f body="$(cat comment.md)" >/dev/null

  assemble:
    name: Build variants and separation checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write        # commit comment on failure
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/release/') }}

      # Resolve the actual e2e/prod graph before compiling, without changing dependency selection.
      # The init script uses Gradle's resolution model; its one-off metadata task is not configuration-cache compatible.
      - name: Compose runtime classpaths match the BOM and lifecycle baseline
        run: |
          {
            ./gradlew -I scripts/compose-classpath.init.gradle :app:composeClasspathReport --no-daemon --no-configuration-cache &&
            python3 scripts/check-compose-classpath.py app/build/reports/compose-classpath.json
          } 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}

      # Environments (FIN-120, AGENTS.md «Flavors»): mock as the working product, localDebug for the local backend,
      # prodRelease as what users get (unsigned: CI has no signing key). The localRelease manifest is checked below.
      # Other variants (mockRelease, prodDebug, localRelease) are not built here.
      - name: Assemble
        run: ./gradlew assembleMockDebug assembleLocalDebug assembleProdRelease processLocalReleaseManifest :app:checkNoMockCode --no-daemon 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}

      # Check AGP output too: Android keeps flavor suffixes, the version sent in X-Client-Version does not.
      - name: Manifest and client versions match the app version
        run: |
          m=app/build/intermediates/merged_manifests
          b=app/build/generated/source/buildConfig
          python3 scripts/check-app-version.py --suffix=-mock \
            --manifest "$m/mockDebug/processMockDebugManifest/AndroidManifest.xml" \
            --build-config "$b/mock/debug/ru/finassist/pf/BuildConfig.java"
          python3 scripts/check-app-version.py --suffix=-local \
            --manifest "$m/localDebug/processLocalDebugManifest/AndroidManifest.xml" \
            --build-config "$b/local/debug/ru/finassist/pf/BuildConfig.java"
          python3 scripts/check-app-version.py \
            --manifest "$m/prodRelease/processProdReleaseManifest/AndroidManifest.xml" \
            --build-config "$b/prod/release/ru/finassist/pf/BuildConfig.java"

      # CI has no Tracer token: the SDK must not be able to start (scripts/check-tracer-off.py, README).
      - name: Tracer is off without a token
        run: |
          m=app/build/intermediates/merged_manifests
          python3 scripts/check-tracer-off.py $m/mockDebug/processMockDebugManifest/AndroidManifest.xml \
            $m/localDebug/processLocalDebugManifest/AndroidManifest.xml \
            $m/prodRelease/processProdReleaseManifest/AndroidManifest.xml 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}

      # No e2e/mock hooks and no cleartext in release builds; in localDebug cleartext only to the host of the compiled
      # API_BASE_URL, none for https (scripts/check-build-separation.py). Mock code on the HTTP flavors' classpath fails
      # `:app:checkNoMockCode` above.
      - name: Test hooks and cleartext stay out of release
        run: |
          m=app/build/intermediates/merged_manifests
          {
            python3 scripts/check-build-separation.py release \
              $m/prodRelease/processProdReleaseManifest/AndroidManifest.xml \
              $m/localRelease/processLocalReleaseManifest/AndroidManifest.xml &&
            python3 scripts/check-build-separation.py local-debug \
              $m/localDebug/processLocalDebugManifest/AndroidManifest.xml \
              app/build/intermediates/packaged_res/localDebug/packageLocalDebugResources/xml/network_security_config.xml \
              app/build/generated/source/buildConfig/local/debug/ru/finassist/pf/BuildConfig.java
          } 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}

      # Certificate pinning of prod (FIN-121): CI has no real pins, so the generator is checked with test values (32
      # fixed bytes, not keys of any certificate). Rebuilds only manifests and resources, after the checks above have
      # read them: prodRelease must be pinned, while localRelease and mockDebug built with the same pins must stay
      # without a network security config.
      - name: API pins in prodRelease only
        run: |
          m=app/build/intermediates/merged_manifests
          {
            ./gradlew processProdReleaseManifest packageProdReleaseResources processLocalReleaseManifest \
              processMockDebugManifest --no-daemon \
              -Ppf.apiPins="sha256/$(head -c 32 /dev/zero | tr '\0' '\1' | base64),sha256/$(head -c 32 /dev/zero | tr '\0' '\2' | base64)" \
              -Ppf.apiPinsExpiration="$(date -u -d '+180 days' +%F)" &&
            python3 scripts/check-build-separation.py pinned-release \
              $m/prodRelease/processProdReleaseManifest/AndroidManifest.xml \
              app/build/intermediates/packaged_res/prodRelease/packageProdReleaseResources/xml/network_security_config.xml \
              app/build/generated/source/buildConfig/prod/release/ru/finassist/pf/BuildConfig.java &&
            python3 scripts/check-build-separation.py release $m/localRelease/processLocalReleaseManifest/AndroidManifest.xml &&
            if grep -q networkSecurityConfig $m/mockDebug/processMockDebugManifest/AndroidManifest.xml; then
              echo "mockDebug got a network security config with the API pins"; false
            fi
          } 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}

      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: app-mock-debug
          path: app/build/outputs/apk/mock/debug/*.apk
          retention-days: 14

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_NAME: Build variants and separation checks
        run: |
          {
            echo "CI failed on \`${{ github.workflow }} / $JOB_NAME\` — last lines of the build log:"
            echo
            echo '```'
            grep -E "^e: |error:|Unresolved reference|FAILED$" build.log | head -n 120
            echo "--- summary ---"
            grep -E "^(> Task .* FAILED|FAILURE|\* What went wrong|\* Where|Caused by|Execution failed|Could not|Build file|Line:)" build.log | tail -n 40
            echo '```'
          } > comment.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -f body="$(cat comment.md)" >/dev/null
