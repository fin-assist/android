name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Module graph rules run at configuration time: a violation fails here, before any compilation.
      - name: Check module rules
        run: ./gradlew help --no-daemon

      - name: Check flags registry matches docs/flags.md
        run: ./scripts/check-flags.sh

      - name: Unit tests
        run: ./gradlew testMockDebugUnitTest testDebugUnitTest --continue --no-daemon

      - name: Lint
        run: ./gradlew lintMockDebug --no-daemon

      - name: Assemble mock debug
        run: ./gradlew assembleMockDebug --no-daemon

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-mock-debug
          path: app/build/outputs/apk/mock/debug/*.apk
          retention-days: 14
