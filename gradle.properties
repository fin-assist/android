org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
# FIN-187: avoid CheckAarMetadataTask artifact-collection serialization failures.
# Re-enable only after validating a compatible toolchain fix; see docs/gradle-configuration-cache.md.
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
# KSP2 is the default in KSP 2.x; keep it explicit.
ksp.useKSP2=true
