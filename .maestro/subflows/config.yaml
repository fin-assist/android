# Opens the e2e control link and waits until it is applied (docs/e2e.md, «Control link»).
# The receipt persists until explicitly acknowledged; a slow driver cannot miss a four-second pulse.
# The original minimum dwell remains for elapsed-time probes before the continue action is enabled.
# env: LINK — the whole link, e.g. "pfe2e://config?flag.auth.registration=false".
#
# Cold fixture preparation (60 s) completes before the unchanged sign-in deadline (30 s).
appId: ru.finassist.pf.mock.e2e
---
- openLink: ${LINK}
- extendedWaitUntil:
    visible:
      id: "e2e.config.applied"
    timeout: 100000
- extendedWaitUntil:
    visible:
      id: "e2e.config.continue"
      enabled: true
    timeout: 100000
- tapOn:
    id: "e2e.config.continue"
    enabled: true
- extendedWaitUntil:
    notVisible:
      id: "e2e.config.applied"
    timeout: 10000
