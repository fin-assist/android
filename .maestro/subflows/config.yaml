# Opens the e2e control link and waits until it is applied (docs/e2e.md, «Control link»).
# The control activity writes the values, shows `e2e.config.applied` for a moment and finishes; waiting for the tag
# to come and go keeps the next step (often `launchApp`) from cutting the writes short.
# env: LINK — the whole link, e.g. "pfe2e://config?flag.auth.registration=false".
appId: ru.finassist.pf.mock.e2e
---
- openLink: ${LINK}
- extendedWaitUntil:
    visible:
      id: "e2e.config.applied"
    timeout: 30000
- extendedWaitUntil:
    notVisible:
      id: "e2e.config.applied"
    timeout: 10000
