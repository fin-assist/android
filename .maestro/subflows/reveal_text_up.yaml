# Scoped text remains a separate assertion from its parent container's visibility.
# env: TARGET_TEXT, PARENT_ID.
appId: ru.finassist.pf.mock.e2e
---
- scrollUntilVisible:
    element:
      text: ${TARGET_TEXT}
      childOf:
        id: ${PARENT_ID}
    direction: UP
    visibilityPercentage: 100
- assertVisible:
    text: ${TARGET_TEXT}
    childOf:
      id: ${PARENT_ID}
