# Independent bundled-ledger oracle for FIN-438, before/after excluding RBC.
# Caller starts at a row of this card. Money regexes accept the formatter's space variants.
# env: TOTAL, COUNT, CHANGED_ROW, CHANGED_TITLE, CHANGED_AMOUNT, MORE, MORE_AMOUNT.
appId: ru.finassist.pf.mock.e2e
---
- scrollUntilVisible:
    element:
      id: "analytics.block.regular_payments"
      containsDescendants:
        - text: ${TOTAL}
        - text: ${COUNT}
    direction: UP
- assertVisible: "Подписки и регулярные платежи"
- assertVisible: ${TOTAL}
- assertVisible: ${COUNT}
- assertVisible:
    id: "analytics.block.regular_payments"
    containsDescendants:
      - text: ${TOTAL}
      - text: ${COUNT}
- scrollUntilVisible:
    element:
      id: "analytics.regular_payments.item"
      containsDescendants:
        - text: "Ростелеком"
        - text: '1[\s\u00A0\u202F]089[\s\u00A0\u202F]₽'
- assertVisible: "Ростелеком"
- assertVisible:
    id: "analytics.regular_payments.item"
    containsDescendants:
      - text: "Ростелеком"
      - text: '1[\s\u00A0\u202F]089[\s\u00A0\u202F]₽'
- scrollUntilVisible:
    element:
      id: "analytics.regular_payments.item"
      containsDescendants:
        - text: "Мой телефон.*"
        - text: '1[\s\u00A0\u202F]000[\s\u00A0\u202F]₽'
- assertVisible:
    id: "analytics.regular_payments.item"
    containsDescendants:
      - text: "Мой телефон.*"
      - text: '1[\s\u00A0\u202F]000[\s\u00A0\u202F]₽'
- scrollUntilVisible:
    element: ${TOTAL}
    direction: UP
- scrollUntilVisible:
    element:
      id: "analytics.regular_payments.item"
      containsDescendants:
        - text: ${CHANGED_TITLE}
        - text: ${CHANGED_AMOUNT}
    direction: DOWN
- assertVisible:
    id: "analytics.regular_payments.item"
    containsDescendants:
      - text: ${CHANGED_TITLE}
      - text: ${CHANGED_AMOUNT}
- scrollUntilVisible:
    element: ${CHANGED_ROW}
- assertVisible: ${CHANGED_ROW}
- scrollUntilVisible:
    element:
      id: "analytics.regular_payments.more"
      containsDescendants:
        - text: ${MORE}
        - text: ${MORE_AMOUNT}
- assertVisible:
    id: "analytics.regular_payments.more"
    containsDescendants:
      - text: ${MORE}
      - text: ${MORE_AMOUNT}
