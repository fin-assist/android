# Explicit fixture consent and 14+ before any phone submission, including an existing account (FIN-365).
appId: ru.finassist.pf.mock.e2e
---
# Initial consent GET waits for the cold mock fixture. This is preparation before phone submission,
# not an extension of authentication, call or stream deadlines (FIN-473).
- extendedWaitUntil:
    visible:
      id: "auth.phone.document"
    timeout: 60000
- scrollUntilVisible:
    element:
      id: "auth.phone.age"
- runFlow:
    when:
      visible:
        id: "auth.phone.age"
        checked: false
    commands:
      - tapOn:
          id: "auth.phone.age"
- assertVisible:
    id: "auth.phone.age"
    checked: true
- scrollUntilVisible:
    element:
      id: "auth.phone.consent"
- runFlow:
    when:
      visible:
        id: "auth.phone.consent"
        checked: false
    commands:
      - tapOn:
          id: "auth.phone.consent"
- assertVisible:
    id: "auth.phone.consent"
    checked: true
