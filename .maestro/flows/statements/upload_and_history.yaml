appId: ru.finassist.pf.mock.e2e
name: Загрузка новых операций, повтор той же выписки, удаление загрузки
tags:
  - smoke
  - statements
---
- runFlow: ../../subflows/clear_state.yaml
- runFlow: ../../subflows/fast_login.yaml
# Open Analytics before mutating statements: the saved tab must refresh without a cold start.
# October is covered by the fixture but has no operations until this import.
- tapOn:
    id: "ds.tab.analytics"
- extendedWaitUntil:
    visible:
      id: "analytics.block.tiles"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "analytics.tile.income"
- assertVisible:
    id: "analytics.tile.income"
    text: ".*0[ \u00a0\u202f].*"
- tapOn:
    id: "ds.tab.profile"
- extendedWaitUntil:
    visible:
      id: "profile.statements"
    timeout: 10000
- tapOn:
    id: "profile.statements"
- extendedWaitUntil:
    visible:
      id: "statements.history.row"
    timeout: 10000

# October on top of the preloaded year: three new operations.
- scrollUntilVisible:
    element:
      id: "statements.history.upload"
- tapOn:
    id: "statements.history.upload"
- scrollUntilVisible:
    element:
      id: "statements.upload.pick"
- tapOn:
    id: "statements.upload.pick"
- tapOn:
    id: "e2e.picker.october.ofx"
- extendedWaitUntil:
    visible:
      id: "statements.result"
    timeout: 20000
- assertVisible:
    id: "statements.result.new"
- assertNotVisible: "Все операции.*"

# Finish to Operations, then use the bottom tab: this restores the Analytics entry opened before import.
- tapOn:
    id: "statements.result.done"
- extendedWaitUntil:
    visible:
      id: "ds.tab.analytics"
    timeout: 10000
- tapOn:
    id: "ds.tab.analytics"
- scrollUntilVisible:
    element:
      id: "analytics.tile.income"
- extendedWaitUntil:
    visible:
      id: "analytics.tile.income"
      text: ".*1[ \u00a0\u202f]200.*"
    timeout: 15000
- assertNotVisible:
    id: "analytics.empty"
# The income node changed from 0 to +1200 for the saved October context.

# The same October file again: nothing new.
- tapOn:
    id: "ds.tab.profile"
- extendedWaitUntil:
    notVisible:
      id: "statements.result"
    timeout: 10000
- runFlow:
    when:
      notVisible:
        id: "statements.history"
    commands:
      - tapOn:
          id: "ds.tab.profile"
      - tapOn:
          id: "profile.statements"
- extendedWaitUntil:
    visible:
      id: "statements.history.row"
      index: 1
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "statements.history.upload"
- tapOn:
    id: "statements.history.upload"
- scrollUntilVisible:
    element:
      id: "statements.upload.pick"
- tapOn:
    id: "statements.upload.pick"
- tapOn:
    id: "e2e.picker.october.ofx"
- extendedWaitUntil:
    visible:
      id: "statements.result.no_new"
    timeout: 20000
# «История загрузок» under the result leads back to the history.
- tapOn:
    id: "statements.result.history"
- extendedWaitUntil:
    visible:
      id: "statements.history"
    timeout: 10000

# Delete an upload: the dialog, then one row less.
- extendedWaitUntil:
    visible:
      id: "statements.history.row"
      index: 2
    timeout: 10000
- tapOn:
    id: "statements.history.delete"
    index: 0
- assertVisible: "Удалить загрузку .*\\?"
- tapOn:
    id: "ds.dialog.confirm"
- extendedWaitUntil:
    notVisible:
      id: "statements.history.row"
      index: 2
    timeout: 15000

# Delete the other October source: the original year still supplies analytics.
- tapOn:
    id: "statements.history.delete"
    index: 0
- tapOn:
    id: "ds.dialog.confirm"
- extendedWaitUntil:
    notVisible:
      id: "statements.history.row"
      index: 1
    timeout: 15000
- back
- tapOn:
    id: "ds.tab.analytics"
- extendedWaitUntil:
    visible:
      id: "analytics.block.tiles"
    timeout: 15000
- assertNotVisible:
    id: "analytics.empty"
- tapOn:
    id: "ds.tab.profile"
- tapOn:
    id: "profile.statements"
- extendedWaitUntil:
    visible:
      id: "statements.history.row"
    timeout: 15000
# Delete the last source: no old numbers survive on the saved Analytics tab.
- tapOn:
    id: "statements.history.delete"
    index: 0
- tapOn:
    id: "ds.dialog.confirm"
- extendedWaitUntil:
    notVisible:
      id: "statements.history.row"
    timeout: 15000
- back
- tapOn:
    id: "ds.tab.analytics"
- extendedWaitUntil:
    visible:
      id: "analytics.empty"
    timeout: 15000
- assertNotVisible:
    id: "analytics.block.tiles"
- assertNotVisible:
    id: "analytics.updating"
