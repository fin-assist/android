appId: ru.finassist.pf.mock.e2e
name: Загрузка — обрыв потока, 429, сворачивание и возврат, снова 429 — итог без ошибки
tags:
  - statements
---
# FIN-170 (api.md «SSE»): the progress stream drops after its first event (`stream_drops=1`), and every opening after the
# drop is turned away with 429 `Retry-After: 120` (`stream_rate_limits=100&stream_retry_s=120`), so the app keeps waiting
# for as long as the flow needs. Each return to the screen — from the control link and from the background — makes the
# screen open the stream itself; the fake server counts the 429s it gave (`expect_stream_rate_limited`), which proves
# those openings got 429 and were waited for, not shown as an upload error. Lifting the limit brings the result.
- runFlow: ../../subflows/clear_state.yaml
- runFlow: ../../subflows/fast_login.yaml
- tapOn:
    id: "ds.tab.profile"
- extendedWaitUntil:
    visible:
      id: "profile.statements"
    timeout: 10000
- tapOn:
    id: "profile.statements"
- extendedWaitUntil:
    visible:
      id: "statements.history"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "statements.history.upload"
- tapOn:
    id: "statements.history.upload"
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?stream_drops=1&stream_rate_limits=100&stream_retry_s=120"
- scrollUntilVisible:
    element:
      id: "statements.upload.pick"
- tapOn:
    id: "statements.upload.pick"
- tapOn:
    id: "e2e.picker.october.ofx"
- extendedWaitUntil:
    visible:
      id: "statements.upload.busy"
    timeout: 10000
# A pause on the screen: the upload is accepted (50 ms), the stream drops after its first event and is re-opened within
# 1 s by the app's own loop, which gets the first 429. The marker id never appears; this is a bounded wait, not a sync.
- extendedWaitUntil:
    visible:
      id: "e2e.never"
    timeout: 3000
    optional: true
# First 429 given (the app's loop). Opening the link pauses the screen; its return opens the stream again: 429 #2.
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?expect_stream_rate_limited=1"
# To the background and back: the screen opens the stream itself once more and gets 429 #3.
- pressKey: Home
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      id: "statements.upload.busy"
    timeout: 10000
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?expect_stream_rate_limited=3"
# Every 429 after a return was waited for: still parsing, no upload error.
- extendedWaitUntil:
    visible:
      id: "statements.upload.busy"
    timeout: 10000
- assertNotVisible:
    id: "statements.upload.error.processing_failed"
- assertNotVisible:
    id: "statements.upload.offline"
# The limit lifted: the next opening (the return from this link) gets the stream, and the result opens.
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?stream_rate_limits=0"
- extendedWaitUntil:
    visible:
      id: "statements.result"
    timeout: 20000
- assertVisible:
    id: "statements.result.new"
