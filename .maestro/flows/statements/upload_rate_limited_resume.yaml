appId: ru.finassist.pf.mock.e2e
name: Загрузка — 429 сохраняет исходную паузу при возврате на экран
tags:
  - statements
---
# FIN-170 (api.md «SSE»): the progress stream drops after its first event (`stream_drops=1`), and every opening after the
# drop is turned away with 429 Retry-After: 30. Returning from a control link or background must retain the original
# deadline: the exact counter stays 1, rather than opening another stream early. After lifting the limit, wait for
# that same deadline and get the result without treating a temporary transport refusal as a parsing failure.
- runFlow: ../../subflows/clear_state.yaml
- runFlow: ../../subflows/fast_login.yaml
- tapOn:
    id: "ds.tab.profile"
- extendedWaitUntil:
    visible:
      id: "profile.statements"
    timeout: 10000
- tapOn:
    id: "profile.statements"
- extendedWaitUntil:
    visible:
      id: "statements.history"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "statements.history.upload"
- tapOn:
    id: "statements.history.upload"
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?stream_drops=1&stream_rate_limits=100&stream_retry_s=30"
- scrollUntilVisible:
    element:
      id: "statements.upload.pick"
- tapOn:
    id: "statements.upload.pick"
- tapOn:
    id: "e2e.picker.october.ofx"
- extendedWaitUntil:
    visible:
      id: "statements.upload.busy"
    timeout: 10000
# A pause on the screen: the upload is accepted (50 ms), the stream drops after its first event and is re-opened within
# 1 s by the app's own loop, which gets the first 429. The marker id never appears; this is a bounded wait, not a sync.
- extendedWaitUntil:
    visible:
      id: "e2e.never"
    timeout: 3000
    optional: true
# The first 429 is already given. Returning from this link must not skip its wait.
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?expect_stream_rate_limited_exact=1"
# To the background and back: still the same server deadline, no extra opening.
- pressKey: Home
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      id: "statements.upload.busy"
    timeout: 10000
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?expect_stream_rate_limited_exact=1"
# Still parsing, no upload error; cancellation never restarts or skips the wait.
- extendedWaitUntil:
    visible:
      id: "statements.upload.busy"
    timeout: 10000
- assertNotVisible:
    id: "statements.upload.error.processing_failed"
- assertNotVisible:
    id: "statements.upload.offline"
# The next opening happens only when the retained wait ends, even after returning from this link.
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?stream_rate_limits=0"
- extendedWaitUntil:
    visible:
      id: "statements.result"
    timeout: 45000
- assertVisible:
    id: "statements.result.new"
