appId: ru.finassist.pf.mock.e2e
name: Загрузка — операция без описания принимается и видна в ленте как «Без описания»
tags:
  - statements
---
- runFlow: ../../subflows/clear_state.yaml
- runFlow: ../../subflows/fast_login.yaml
- tapOn:
    id: "ds.tab.profile"
- extendedWaitUntil:
    visible:
      id: "profile.statements"
    timeout: 10000
- tapOn:
    id: "profile.statements"
- extendedWaitUntil:
    visible:
      id: "statements.history"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "statements.history.upload"
- tapOn:
    id: "statements.history.upload"
- scrollUntilVisible:
    element:
      id: "statements.upload.pick"
- tapOn:
    id: "statements.upload.pick"

# One debit without <NAME> (FIN-67): an operation with an empty title, not an unread line.
- tapOn:
    id: "e2e.picker.no-description.ofx"
- extendedWaitUntil:
    visible:
      id: "statements.result"
    timeout: 20000
- assertVisible:
    id: "statements.result.new"
- assertNotVisible:
    id: "statements.result.unread"

# 7 October is the day before the pinned «now» (E2E_NOW): the operation tops the feed under «Вчера», whatever the
# emulator's date (FIN-71). The day header is drawn in capitals.
- scrollUntilVisible:
    element:
      id: "statements.result.done"
- tapOn:
    id: "statements.result.done"
- extendedWaitUntil:
    visible:
      id: "operations.feed"
    timeout: 10000
- assertVisible: "(?iu)вчера"
- assertVisible:
    id: "operations.row"
    containsDescendants:
      - text: "Без описания"
- tapOn: "Без описания"
# The tag is on the header row, the title on a child node: id and text are checked apart (FIN-70).
- extendedWaitUntil:
    visible:
      id: "operations.detail.title"
    timeout: 10000
- assertVisible:
    id: "operations.detail.title"
    containsDescendants:
      - text: "Без описания"
# The exact fixture timestamp/amount binds the placeholder to the 7 October debit, not another row.
- assertVisible: "07\\.10\\.2026, 09:15"
- assertVisible: "−250[ \u00a0\u202f]₽"
# No description in the statement: no «Описание в выписке» row; the bank's category is still there.
- assertNotVisible: "Описание в выписке"
- assertVisible:
    id: "operations.detail.statement.category"
    containsDescendants:
      - text: "(?s).*Категория банка.*Фастфуд.*"
