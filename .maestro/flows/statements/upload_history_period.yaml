appId: ru.finassist.pf.mock.e2e
name: История загрузок показывает календарный период выписки
tags:
  - statements
---
- runFlow: ../../subflows/clear_state.yaml
- runFlow: ../../subflows/fast_login.yaml
- tapOn:
    id: "ds.tab.profile"
- extendedWaitUntil:
    visible:
      id: "profile.statements"
    timeout: 10000
- tapOn:
    id: "profile.statements"
- extendedWaitUntil:
    visible:
      id: "statements.history"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "statements.history.upload"
- tapOn:
    id: "statements.history.upload"
- scrollUntilVisible:
    element:
      id: "statements.upload.pick"
- tapOn:
    id: "statements.upload.pick"
- scrollUntilVisible:
    element:
      id: "e2e.picker.zz-history-period.ofx"
- tapOn:
    id: "e2e.picker.zz-history-period.ofx"
- extendedWaitUntil:
    visible:
      id: "statements.result"
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "statements.result.history"
- tapOn:
    id: "statements.result.history"
- extendedWaitUntil:
    visible:
      id: "statements.history"
    timeout: 10000
- assertVisible: "1–30.сентября · 1.операция"
- scrollUntilVisible:
    element:
      id: "statements.history.upload"
- tapOn:
    id: "statements.history.upload"
- scrollUntilVisible:
    element:
      id: "statements.upload.pick"
- tapOn:
    id: "statements.upload.pick"
- scrollUntilVisible:
    element:
      id: "e2e.picker.zz-history-fallback.ofx"
- tapOn:
    id: "e2e.picker.zz-history-fallback.ofx"
- extendedWaitUntil:
    visible:
      id: "statements.result"
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "statements.result.history"
- tapOn:
    id: "statements.result.history"
- extendedWaitUntil:
    visible:
      id: "statements.history"
    timeout: 10000
- assertVisible: "25.сентября · 1.операция"
- scrollUntilVisible:
    element:
      id: "statements.history.upload"
- tapOn:
    id: "statements.history.upload"
- scrollUntilVisible:
    element:
      id: "statements.upload.pick"
- tapOn:
    id: "statements.upload.pick"
- scrollUntilVisible:
    element:
      id: "e2e.picker.zz-history-empty.ofx"
- tapOn:
    id: "e2e.picker.zz-history-empty.ofx"
- extendedWaitUntil:
    visible:
      id: "statements.result"
    timeout: 20000
# An empty import has no history link; system Back finishes the import at Operations.
- assertVisible:
    id: "statements.result.empty"
- back
- extendedWaitUntil:
    visible:
      id: "operations.feed"
    timeout: 10000
- tapOn:
    id: "ds.tab.profile"
- extendedWaitUntil:
    visible:
      id: "profile.statements"
    timeout: 10000
- tapOn:
    id: "profile.statements"
- extendedWaitUntil:
    visible:
      id: "statements.history"
    timeout: 10000
- assertVisible: "^0.операций$"
