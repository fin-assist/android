appId: ru.finassist.pf.mock.e2e
name: Согласие до телефона — восстановление документа и отправки без сети
tags:
  - auth
  - offline
---
- runFlow: ../../subflows/clear_state.yaml
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?offline=true"
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      text: "(?s)Не получилось загрузить документ согласия.*Проверьте интернет.*"
      childOf:
        id: "ds.error.error"
    timeout: 20000
- assertNotVisible:
    id: "auth.phone.document"
- scrollUntilVisible:
    element:
      id: "auth.phone.submit"
- assertVisible:
    id: "auth.phone.submit"
    enabled: false
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?offline=false"
- scrollUntilVisible:
    element:
      id: "auth.phone.document_refresh"
- tapOn:
    id: "auth.phone.document_refresh"
- runFlow: ../../subflows/confirm_phone.yaml
- scrollUntilVisible:
    element:
      id: "auth.phone.input"
- tapOn:
    id: "auth.phone.input"
- inputText: "9161234567"
- hideKeyboard
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?offline=true"
- scrollUntilVisible:
    element:
      id: "auth.phone.submit"
- tapOn:
    id: "auth.phone.submit"
- extendedWaitUntil:
    visible:
      text: "Не удаётся подключиться к серверу"
      childOf:
        id: "ds.error.error"
    timeout: 10000
- assertVisible:
    text: "(?s)Не получилось отправить номер.*Проверьте интернет.*"
    childOf:
      id: "ds.error.error"
- scrollUntilVisible:
    element:
      id: "auth.phone.age"
- assertVisible:
    id: "auth.phone.age"
    checked: true
- scrollUntilVisible:
    element:
      id: "auth.phone.consent"
- assertVisible:
    id: "auth.phone.consent"
    checked: true
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?offline=false"
- scrollUntilVisible:
    element:
      id: "auth.phone.submit"
- tapOn:
    id: "auth.phone.submit"
- runFlow: ../../subflows/set_passcode.yaml
- extendedWaitUntil:
    visible:
      id: "operations.feed"
    timeout: 40000
- assertNotVisible:
    id: "auth.consent"
