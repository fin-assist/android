appId: ru.finassist.pf.mock.e2e
name: Проверка номера и «Изменить номер» на экране звонка
tags:
  - auth
---
- runFlow: ../../subflows/clear_state.yaml
- launchApp
- extendedWaitUntil:
    visible:
      id: "auth.phone"
    timeout: 20000
# The call «arrives» after a minute: enough time to look at the call screen.
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?call_delay_ms=60000"
- extendedWaitUntil:
    visible:
      id: "auth.phone"
    timeout: 10000

- scrollUntilVisible:
    element:
      id: "auth.phone.input"
- assertVisible: "Чтобы ввести номер, подтвердите, что вам исполнилось 14 лет"
- assertVisible: "Поле недоступно"
- runFlow: ../../subflows/confirm_phone.yaml
- assertNotVisible: "Поле недоступно"
# The call is paid at the subscriber's rate: nothing on the screens promises it is free (FIN-166).
- assertVisible: "Для подтверждения позвоните нам с этого номера"
- assertNotVisible: ".*бесплатн.*"
- scrollUntilVisible:
    element:
      id: "auth.phone.submit"
- tapOn:
    id: "auth.phone.submit"
- assertVisible: "В номере не хватает цифр"
- runFlow: ../../subflows/confirm_phone.yaml
- scrollUntilVisible:
    element:
      id: "auth.phone.input"
- tapOn:
    id: "auth.phone.input"
- inputText: "91612"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "auth.phone.submit"
- tapOn:
    id: "auth.phone.submit"
- assertVisible: "В номере не хватает цифр"

# Tap at the right edge: the cursor goes after the last digit, not into the middle of the masked number.
- runFlow: ../../subflows/confirm_phone.yaml
- scrollUntilVisible:
    element:
      id: "auth.phone.input"
- tapOn:
    id: "auth.phone.input"
    point: "90%,50%"
- eraseText: 20
- inputText: "9161234567"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "auth.phone.submit"
- tapOn:
    id: "auth.phone.submit"
- extendedWaitUntil:
    visible:
      id: "auth.call"
    timeout: 10000
- assertVisible: "Позвоните нам для подтверждения"
- assertVisible: "Позвоните с номера \\+7 916 123-45-67 на наш номер. Мы сразу сбросим звонок — по нему и поймём, что номер ваш"
# The end of the wait by the device clock: response time + expires_in (api.md 1.1), not a fixed «3 минуты».
- assertVisible:
    id: "auth.call.wait"
    text: "Как только дозвонитесь, вход продолжится сам\\. Ждём звонок до [0-2][0-9]:[0-5][0-9]"
- assertNotVisible: ".*бесплатн.*"
- tapOn:
    id: "auth.call.change_number"
# Back on the phone screen with the number kept.
- extendedWaitUntil:
    visible:
      id: "auth.phone"
    timeout: 10000
- assertVisible: ".*916.*123.*45.*67.*"
