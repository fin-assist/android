appId: ru.finassist.pf.mock.e2e
name: Регистрация нового номера до первой выписки
tags:
  - smoke
  - auth
---
- runFlow: ../../subflows/clear_state.yaml
- launchApp
- runFlow:
    file: ../../subflows/sign_in.yaml
    env:
      PHONE: "9001112233"

# Consent: the button without the tick shows the error and keeps the user here.
- extendedWaitUntil:
    visible:
      id: "auth.consent"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "auth.consent.submit"
- tapOn:
    id: "auth.consent.submit"
- assertVisible: "Без согласия мы не сможем создать аккаунт и хранить ваши данные"
- assertVisible:
    id: "auth.consent"
- tapOn:
    id: "auth.consent.checkbox"
- tapOn:
    id: "auth.consent.submit"

- runFlow: ../../subflows/set_passcode.yaml

# First run continues with the upload: the guide with «Загружу позже» (mockup `ImportGuide`, no step counter since FIN-40).
- extendedWaitUntil:
    visible:
      id: "statements.upload"
    timeout: 15000
- assertVisible:
    id: "statements.upload.later"
- scrollUntilVisible:
    element:
      id: "statements.upload.pick"
- tapOn:
    id: "statements.upload.pick"
- tapOn:
    id: "e2e.picker.october.ofx"
- extendedWaitUntil:
    visible:
      id: "statements.result"
    timeout: 20000
- assertVisible:
    id: "statements.result.new"
- tapOn:
    id: "statements.result.done"
- extendedWaitUntil:
    visible:
      id: "operations.feed"
    timeout: 10000
- assertVisible:
    id: "operations.row"
