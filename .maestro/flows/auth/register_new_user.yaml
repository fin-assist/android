appId: ru.finassist.pf.mock.e2e
name: Регистрация нового номера до первой выписки
tags:
  - smoke
  - auth
---
- runFlow: ../../subflows/clear_state.yaml
# The single-user mock preloads a statement even before registration. Prepare an empty server through
# the public UI, then keep this process alive while registering the new number (no clearState/relaunch).
- runFlow: ../../subflows/fast_login.yaml
- tapOn:
    id: "ds.tab.profile"
- tapOn:
    id: "profile.statements"
- extendedWaitUntil:
    visible:
      id: "statements.history.row"
    timeout: 10000
- tapOn:
    id: "statements.history.delete"
    index: 0
- tapOn:
    id: "ds.dialog.confirm"
- extendedWaitUntil:
    visible:
      id: "statements.history.empty"
    timeout: 10000
- tapOn:
    id: "ds.back"
- scrollUntilVisible:
    element:
      id: "profile.logout"
- tapOn:
    id: "profile.logout"
- tapOn:
    id: "ds.dialog.confirm"
- extendedWaitUntil:
    visible:
      id: "auth.phone"
    timeout: 15000
- runFlow:
    file: ../../subflows/sign_in.yaml
    env:
      PHONE: "9001112233"

# The consent was received on the phone step; registration never asks for it again.
- extendedWaitUntil:
    visible:
      id: "auth.consent"
    timeout: 15000
- assertNotVisible:
    id: "auth.consent.checkbox"
- scrollUntilVisible:
    element:
      id: "auth.consent.submit"
- tapOn:
    id: "auth.consent.submit"

- runFlow: ../../subflows/set_passcode.yaml

# First run continues with the upload: the guide with «Загружу позже» (mockup `ImportGuide`, no step counter since FIN-40).
- extendedWaitUntil:
    visible:
      id: "statements.upload"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "statements.upload.download"
- assertVisible:
    text: "Скачать за год"
    childOf:
      id: "statements.upload.download"
- assertNotVisible:
    id: "statements.upload.loaded"
- assertNotVisible: "Скачать новые данные"
- scrollUntilVisible:
    element:
      id: "statements.upload.later"
- assertVisible:
    id: "statements.upload.later"
- scrollUntilVisible:
    element:
      id: "statements.upload.pick"
- tapOn:
    id: "statements.upload.pick"
- tapOn:
    id: "e2e.picker.october.ofx"
- extendedWaitUntil:
    visible:
      id: "statements.result"
    timeout: 20000
- assertVisible:
    id: "statements.result.new"
- tapOn:
    id: "statements.result.done"
- extendedWaitUntil:
    visible:
      id: "operations.feed"
    timeout: 10000
- assertVisible:
    id: "operations.row"
