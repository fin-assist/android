appId: ru.finassist.pf.mock.e2e
name: 429 на переоткрытие потока звонка — ожидание без «Слишком много попыток», вход продолжается
tags:
  - auth
---
# FIN-170 (api.md «SSE»): the call stream drops twice (`stream_drops=2`), and the re-open after the first drop is
# turned away with 429 `Retry-After: 3` (`stream_rate_limits=1`). The app waits for Retry-After and re-opens; the
# screen is not locked («Слишком много попыток» is only for a 429 on the first opening) and sign-in goes on when the
# call «arrives» after 10 s.
- runFlow: ../../subflows/clear_state.yaml
- launchApp
- extendedWaitUntil:
    visible:
      id: "auth.phone"
    timeout: 20000
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?call_delay_ms=10000&stream_drops=2&stream_rate_limits=1"
- extendedWaitUntil:
    visible:
      id: "auth.phone"
    timeout: 10000
- tapOn:
    id: "auth.phone.input"
- inputText: "9161234567"
- hideKeyboard
- tapOn:
    id: "auth.phone.submit"
- extendedWaitUntil:
    visible:
      id: "auth.call"
    timeout: 10000
- assertVisible:
    id: "auth.call.dial"
- assertNotVisible: "Слишком много попыток.*"
- assertNotVisible: "Нет сети — не можем дождаться звонка. Проверьте интернет"
# A locked screen would never get here: the call is confirmed by the stream re-opened after the wait.
- runFlow: ../../subflows/set_passcode.yaml
- extendedWaitUntil:
    visible:
      id: "operations.row"
    timeout: 40000
