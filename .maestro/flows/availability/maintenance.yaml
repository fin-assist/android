appId: ru.finassist.pf.mock.e2e
name: Техработы — ожидание Retry-After, одна автопроверка и ручная проверка после нового отказа
tags:
  - availability
---
# FIN-22. The fake server answers 503 MAINTENANCE ending in 30 minutes of the fake «now» (8 October, 12:00 MSK): the
# screen promises the end time.
- runFlow: ../../subflows/clear_state.yaml
- runFlow: ../../subflows/fast_login.yaml
# The button visibly stays disabled until the server wait ends.
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?maintenance=30&maintenance_retry_after=15"
- tapOn:
    id: "ds.tab.analytics"
- extendedWaitUntil:
    visible:
      id: "availability.maintenance"
    timeout: 15000
- assertVisible: "Идут технические работы"
- assertVisible: "Закончим примерно к 12:\\d\\d"
- assertVisible:
    id: "availability.maintenance.check"
    enabled: false

# Each control acknowledgement is visible for 4 seconds. Keep maintenance enabled for at least 20 seconds:
# the one automatic probe receives a fresh refusal, which must not start another automatic loop.
- repeat:
    times: 5
    commands:
      - runFlow:
          file: ../../subflows/config.yaml
          env:
            LINK: "pfe2e://config?maintenance=30&maintenance_retry_after=15"

# End maintenance, then wait for the fresh refusal's original deadline before the manual check.
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?maintenance=off"
- extendedWaitUntil:
    visible:
      id: "availability.maintenance.check"
      enabled: true
    timeout: 20000
- tapOn:
    id: "availability.maintenance.check"
- extendedWaitUntil:
    notVisible:
      id: "availability.maintenance"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "operations.feed"
    timeout: 15000

# A new maintenance episode receives its own one-shot automatic probe.
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?maintenance=30&maintenance_retry_after=15"
- tapOn:
    id: "ds.tab.analytics"
- extendedWaitUntil:
    visible:
      id: "availability.maintenance"
    timeout: 15000
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?maintenance=off"
- extendedWaitUntil:
    notVisible:
      id: "availability.maintenance"
    timeout: 40000
