appId: ru.finassist.pf.mock.e2e
name: Техработы во время разбора выписки — переоткрытие потока получает 503, экран техработ поверх загрузки, после техработ выписка разобрана
tags:
  - availability
---
# FIN-22 + FIN-170 (api.md «SSE»: an open stream is cut when maintenance starts, a re-open gets 503 MAINTENANCE). The
# progress stream drops after its first event and receives a short 429 wait. Maintenance then starts: the next
# opening, AFTER the retained 429 deadline, gets 503 before the 429; the maintenance screen covers
# the app (the screens under it are created anew after the maintenance, FIN-22). The 503 is not a parsing failure
# (FIN-177): the server goes on parsing, and after the maintenance the history shows the upload done, not failed.
- runFlow: ../../subflows/clear_state.yaml
- runFlow: ../../subflows/fast_login.yaml
- tapOn:
    id: "ds.tab.profile"
- extendedWaitUntil:
    visible:
      id: "profile.statements"
    timeout: 10000
- tapOn:
    id: "profile.statements"
- extendedWaitUntil:
    visible:
      id: "statements.history"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "statements.history.upload"
- tapOn:
    id: "statements.history.upload"
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?stream_drops=1&stream_rate_limits=100&stream_retry_s=15"
- scrollUntilVisible:
    element:
      id: "statements.upload.pick"
- tapOn:
    id: "statements.upload.pick"
- tapOn:
    id: "e2e.picker.october.ofx"
- extendedWaitUntil:
    visible:
      id: "statements.upload.busy"
    timeout: 10000
# Let the first snapshot/drop/open reach 429, then enable maintenance. Returning cannot skip that original wait.
- extendedWaitUntil:
    visible:
      id: "e2e.never"
    timeout: 3000
    optional: true
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?maintenance=30&maintenance_retry_after=15"
- extendedWaitUntil:
    visible:
      id: "availability.maintenance"
    timeout: 30000
- assertVisible: "Идут технические работы"
# End maintenance and lift the limiter. The one-shot maintenance probe/recovery still waits its captured deadline;
# returning from the control link is not permission to open early. No repeated automatic loop is needed.
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?maintenance=off&stream_rate_limits=0"
- extendedWaitUntil:
    notVisible:
      id: "availability.maintenance"
    timeout: 40000
- extendedWaitUntil:
    visible:
      id: "operations.feed"
    timeout: 15000
# FIN-177: the server did not reject the file — the history has it done: no «Разбираем…» row, two uploads (the
# preloaded year and October).
- tapOn:
    id: "ds.tab.profile"
- tapOn:
    id: "profile.statements"
- extendedWaitUntil:
    visible:
      id: "statements.history.row"
      index: 1
    timeout: 15000
- extendedWaitUntil:
    notVisible: "Разбираем…"
    timeout: 15000
- assertVisible: "october.ofx"
