appId: ru.finassist.pf.mock.e2e
name: Техработы до входа — экран техработ поверх входа, без времени окончания
tags:
  - availability
---
# FIN-22. The overlay is above every layer of the app, sign-in included. The end time is unknown here.
- runFlow: ../../subflows/clear_state.yaml
- launchApp
- extendedWaitUntil:
    visible:
      id: "auth.phone"
    timeout: 40000
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?maintenance=unknown&maintenance_retry_after=600"
- tapOn:
    id: "auth.phone.input"
- inputText: "9161234567"
- hideKeyboard
- tapOn:
    id: "auth.phone.submit"
- extendedWaitUntil:
    visible:
      id: "availability.maintenance"
    timeout: 15000
- assertVisible: "Идут технические работы"
- assertVisible: "Пока не знаем, когда закончим"
