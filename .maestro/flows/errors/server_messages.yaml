appId: ru.finassist.pf.mock.e2e
name: Универсальные серверные сообщения вне помощника
tags:
  - profile
  - errors
---
- runFlow: ../../subflows/clear_state.yaml
- runFlow: ../../subflows/fast_login.yaml
- tapOn:
    id: "ds.tab.profile"
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?error_operation=profile_update&error_scenario=unknown_code"
- scrollUntilVisible:
    element:
      id: "profile.theme"
    direction: DOWN
- tapOn:
    id: "profile.theme"
- tapOn:
    id: "profile.theme.light"
- extendedWaitUntil:
    visible:
      id: "ds.error.warning"
    timeout: 20000
- assertVisible: "Сервис получил новый тип ошибки.*"
- assertNotVisible: ".*internal diagnostic.*"
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?error_operation=profile_update&error_scenario=unknown_severity"
- scrollUntilVisible:
    element:
      id: "profile.theme"
    direction: DOWN
- tapOn:
    id: "profile.theme"
- tapOn:
    id: "profile.theme.dark"
- extendedWaitUntil:
    visible:
      id: "ds.error.error"
    timeout: 20000
- assertVisible: "Сервис получил новый тип ошибки.*"
- assertNotVisible: ".*internal diagnostic.*"
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?error_operation=profile_update&error_scenario=invalid_message"
- scrollUntilVisible:
    element:
      id: "profile.theme"
    direction: DOWN
- tapOn:
    id: "profile.theme"
- tapOn:
    id: "profile.theme.light"
- extendedWaitUntil:
    visible:
      id: "ds.error.warning"
    timeout: 20000
- assertVisible: "Не получилось сохранить тему.*"
- assertNotVisible: ".*internal diagnostic.*"
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?error_operation=profile_update&error_scenario=legacy_response"
- scrollUntilVisible:
    element:
      id: "profile.theme"
    direction: DOWN
- tapOn:
    id: "profile.theme"
- tapOn:
    id: "profile.theme.system"
- extendedWaitUntil:
    visible:
      id: "ds.error.error"
    timeout: 20000
- assertVisible: "Не получилось сохранить тему.*"
- assertNotVisible: ".*internal diagnostic.*"
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?error_operation=off"
- scrollUntilVisible:
    element:
      id: "profile.theme"
- tapOn:
    id: "profile.theme"
- tapOn:
    id: "profile.theme.light"
- extendedWaitUntil:
    notVisible:
      id: "profile.theme.light"
    timeout: 5000
- assertVisible:
    id: "profile.theme"
    containsDescendants:
      - text: "Светлая"
- assertNotVisible:
    id: "ds.error.warning"
- assertNotVisible:
    id: "ds.error.error"
# Postcondition: failed/successful theme writes preserve the authenticated operations list.
- tapOn:
    id: "ds.tab.operations"
- extendedWaitUntil:
    visible:
      id: "operations.row"
    timeout: 20000
- assertNotVisible:
    id: "auth.phone"
