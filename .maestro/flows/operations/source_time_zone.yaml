appId: ru.finassist.pf.mock.e2e
name: Операции и поиск — несовместимый пояс и явное восстановление
tags:
  - operations
  - mock-only
---
- runFlow: ../../subflows/clear_state.yaml
- runFlow: ../../subflows/fast_login.yaml
- assertVisible: "Пополнение брокерского счета"
- assertVisible: "30.сентября"
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?response_time_zone=unsupported"
- swipe:
    start: "50%, 25%"
    end: "50%, 80%"
    duration: 700
- extendedWaitUntil:
    visible: "Устройство не поддерживает часовой пояс этих данных"
    timeout: 10000
- assertVisible: "Показаны ранее загруженные данные. Они могут быть неактуальны"
- assertVisible:
    id: "operations.row"
- assertVisible: "Пополнение брокерского счета"
- assertVisible: "30.сентября"
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?response_time_zone=default"
- tapOn:
    id: "operations.feed.retry"
- extendedWaitUntil:
    notVisible: "Устройство не поддерживает часовой пояс этих данных"
    timeout: 10000
- assertNotVisible: "Показаны ранее загруженные данные. Они могут быть неактуальны"
- assertVisible: "Пополнение брокерского счета"
- tapOn:
    id: "operations.feed.search"
- tapOn:
    id: "operations.search.input"
- inputText: "Krabsbir"
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: "operations.row"
    timeout: 10000
- assertVisible: 'Найдено 27[\s\u00A0\u202F]операций'
- assertVisible:
    id: "operations.row"
    containsDescendants:
      - text: "Krabsbir"
      - text: "28.сентября"
      - text: '−362,39[\s\u00A0\u202F]₽'
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?response_time_zone=unsupported"
- swipe:
    start: "50%, 25%"
    end: "50%, 80%"
    duration: 700
- extendedWaitUntil:
    visible: "Устройство не поддерживает часовой пояс этих данных"
    timeout: 10000
- assertVisible: "Показаны ранее загруженные данные. Они могут быть неактуальны"
- assertVisible: 'Найдено 27[\s\u00A0\u202F]операций'
- assertVisible:
    id: "operations.search.input"
    text: "Krabsbir"
- assertVisible:
    id: "operations.row"
    containsDescendants:
      - text: "Krabsbir"
      - text: "28.сентября"
      - text: '−362,39[\s\u00A0\u202F]₽'
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?response_time_zone=default"
- tapOn:
    id: "operations.search.retry"
- extendedWaitUntil:
    notVisible: "Устройство не поддерживает часовой пояс этих данных"
    timeout: 10000
- assertNotVisible: "Показаны ранее загруженные данные. Они могут быть неактуальны"
- assertVisible: 'Найдено 27[\s\u00A0\u202F]операций'
- assertVisible:
    id: "operations.row"
    containsDescendants:
      - text: "Krabsbir"
      - text: "28.сентября"
      - text: '−362,39[\s\u00A0\u202F]₽'
