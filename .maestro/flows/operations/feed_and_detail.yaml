appId: ru.finassist.pf.mock.e2e
name: Лента, карточка операции, смена категории
tags:
  - smoke
  - operations
---
- runFlow: ../../subflows/clear_state.yaml
- runFlow: ../../subflows/fast_login.yaml
- tapOn:
    id: "operations.row"
    index: 0
- extendedWaitUntil:
    visible:
      id: "operations.detail"
    timeout: 10000
- assertVisible:
    id: "operations.detail.title"
    containsDescendants:
      - text: "Пополнение брокерского счета"
- assertVisible: "Из выписки"
# The timestamp is visible in the hero, not only present in the transport request.
- assertVisible: '30\.09\.2026, 17:53'
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?expect_operation_details_requests=1&expect_operation_details_timestamp_exact=true"

# Category picker: choose another category and save.
- tapOn:
    id: "operations.detail.category"
- extendedWaitUntil:
    visible:
      id: "operations.category.search"
    timeout: 5000
- tapOn:
    id: "operations.category.option"
    index: 1
# The first options may include the current category: then «Сохранить» stays disabled, take another one.
- runFlow:
    when:
      visible:
        id: "operations.detail.save"
        enabled: false
    commands:
      - tapOn:
          id: "operations.category.option"
          index: 2
- tapOn:
    id: "operations.detail.save"
- extendedWaitUntil:
    notVisible:
      id: "operations.category.search"
    timeout: 10000
- assertVisible: "Вы выбрали сами"
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?expect_category_requests=1&expect_category_timestamp_exact=true"

- tapOn:
    id: "ds.back"
- assertVisible:
    id: "operations.feed"

# FIN-203: both reopening and saving require the list/details timestamp in the mock contract.
- tapOn:
    id: "operations.row"
    index: 0
- extendedWaitUntil:
    visible:
      id: "operations.detail"
    timeout: 10000
- assertVisible: "Вы выбрали сами"
- assertVisible: '30\.09\.2026, 17:53'
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?expect_operation_details_requests=2&expect_operation_details_timestamp_exact=true&expect_category_requests=1&expect_category_timestamp_exact=true"
- tapOn:
    id: "ds.back"
- assertVisible:
    id: "operations.feed"
