appId: ru.finassist.pf.mock.e2e
name: Аналитика — повтор неудавшейся смены периода
# Mock-only: transport failure is controlled locally, never injected into stage HTTP.
tags:
  - analytics
  - mock-only
---
- runFlow: ../../subflows/clear_state.yaml
# Keep fixture loading outside sign-in and complete passcode setup through the existing UI path.
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      id: "auth.phone.document"
    timeout: 60000
- runFlow: ../../subflows/login.yaml
- tapOn:
    id: "ds.tab.analytics"
- extendedWaitUntil:
    visible:
      text: "Октябрь 2026"
      childOf:
        id: "ds.period.pick"
    timeout: 15000
- tapOn:
    id: "ds.period.prev"
- extendedWaitUntil:
    visible:
      text: "Сентябрь 2026"
      childOf:
        id: "ds.period.pick"
    timeout: 10000
- assertVisible:
    id: "ds.segment.0"
    checked: true
- assertVisible:
    id: "analytics.block.tiles"
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?offline=true"
- tapOn:
    id: "ds.segment.2"
- extendedWaitUntil:
    visible:
      id: "analytics.period.retry"
    timeout: 15000
- assertVisible: "(?s).*Не удалось сменить период.*"
- assertVisible:
    text: "Сентябрь 2026"
    childOf:
      id: "ds.period.pick"
- assertVisible:
    id: "ds.segment.0"
    checked: true
- assertVisible:
    id: "analytics.period.retry"
# The saved month remains interactive. A known command refusal preserves the separate period error.
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?offline=false&error_operation=analytics_dismiss&error_scenario=unknown_code"
- scrollUntilVisible:
    element: "Не подписка"
    direction: DOWN
- tapOn:
    text: "Не подписка"
    index: 0
- extendedWaitUntil:
    visible: "Сервис получил новый тип ошибки\\. Попробуйте позже"
    timeout: 10000
- assertVisible: "(?s).*Не удалось сменить период.*"
- assertVisible:
    id: "analytics.period.retry"
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?error_operation=off&expect_analytics_dismiss_requests=1"
# Resume is not consent to retry the failed target, nor to replace its notice with a refresh of the old month.
# The content retained its scroll at regular payments. Bring the complete period controls back into view.
- scrollUntilVisible:
    element:
      id: "ds.period.pick"
    direction: UP
- scrollUntilVisible:
    element:
      id: "analytics.ask"
    direction: UP
- assertVisible:
    text: "Сентябрь 2026"
    childOf:
      id: "ds.period.pick"
- assertVisible:
    id: "analytics.period.retry"
- tapOn:
    id: "analytics.period.retry"
- extendedWaitUntil:
    visible:
      text: "2026"
      childOf:
        id: "ds.period.pick"
    timeout: 15000
- assertVisible:
    id: "ds.segment.2"
    checked: true
- assertNotVisible:
    id: "analytics.period.retry"
- assertNotVisible:
    id: "ds.error.error"
- tapOn:
    id: "ds.segment.0"
- extendedWaitUntil:
    visible:
      text: "Сентябрь 2026"
      childOf:
        id: "ds.period.pick"
    timeout: 10000
- assertVisible:
    id: "ds.segment.0"
    checked: true

# Selection during an unfinished command is deferred and resumed even when that command is refused.
- runFlow: ../../subflows/clear_state.yaml
# Keep fixture loading outside sign-in and complete passcode setup through the existing UI path.
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      id: "auth.phone.document"
    timeout: 60000
- runFlow: ../../subflows/login.yaml
- tapOn:
    id: "ds.tab.analytics"
- extendedWaitUntil:
    visible:
      text: "Октябрь 2026"
      childOf:
        id: "ds.period.pick"
    timeout: 15000
- tapOn:
    id: "ds.period.prev"
- extendedWaitUntil:
    visible:
      text: "Сентябрь 2026"
      childOf:
        id: "ds.period.pick"
    timeout: 10000
- scrollUntilVisible:
    element: "Не подписка — РБК"
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?network_delay_ms=20000&error_operation=analytics_dismiss&error_scenario=unknown_code"
- tapOn: "Не подписка — РБК"
- scrollUntilVisible:
    element:
      id: "ds.segment.2"
    direction: UP
- assertNotVisible: "Сервис получил новый тип ошибки\\. Попробуйте позже"
- tapOn:
    id: "ds.segment.2"
- extendedWaitUntil:
    visible:
      id: "analytics.period.rolling_year"
    timeout: 60000
# The response preserves the body offset. A clipped picker can be visible without its title;
# scroll to the expected year itself before asserting the completed selection.
- scrollUntilVisible:
    element:
      text: "2026"
      childOf:
        id: "ds.period.pick"
    direction: UP
- assertVisible:
    text: "2026"
    childOf:
      id: "ds.period.pick"
- assertVisible:
    id: "ds.segment.2"
    checked: true
- assertNotVisible:
    id: "analytics.period.retry"
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?network_delay_ms=0&error_operation=off&expect_error_requests=1&expect_analytics_dismiss_requests=1"
