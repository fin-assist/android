appId: ru.finassist.pf.mock.e2e
name: Аналитика — блоки, периоды, переводы, переход к операциям
tags:
  - smoke
  - analytics
---
- runFlow: ../../subflows/clear_state.yaml
- runFlow: ../../subflows/fast_login.yaml
- tapOn:
    id: "ds.tab.analytics"
- extendedWaitUntil:
    visible:
      id: "analytics.block.tiles"
    timeout: 15000
# "Now" is pinned to 8 October 2026. The fixture statement period runs to 1 October, so the latest month with
# data — October, empty so far — opens by default; September one step back holds the operations.
- assertVisible:
    text: "Октябрь 2026"
    childOf:
      id: "ds.period.pick"
- assertVisible:
    id: "analytics.ask"
- tapOn:
    id: "ds.period.prev"
- extendedWaitUntil:
    visible:
      text: "Сентябрь 2026"
      childOf:
        id: "ds.period.pick"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "analytics.expense_category"
- assertVisible:
    id: "analytics.expense_category"
- scrollUntilVisible:
    element:
      id: "analytics.income_category"
    direction: DOWN
- scrollUntilVisible:
    element:
      id: "ds.period.pick"
    direction: UP
# Scrolling up stops on the first strip of the period row, and that strip can lie under the screen title, where a tap
# lands on the title (FIN-188). Only the assistant card stands above the row, shorter than this swipe: one more
# swipe brings the list to its top. The card in view means the whole row is in view; a visible strip of the row
# alone would pass a check the same way `ds.period.pick` passed `scrollUntilVisible`.
- swipe:
    start: "50%, 30%"
    end: "50%, 60%"
- extendedWaitUntil:
    visible:
      id: "analytics.ask"
    timeout: 5000
- assertVisible:
    text: "Сентябрь 2026"
    childOf:
      id: "ds.period.pick"

# Each period type remembers its own choice (FIN-391). A successful switch must change
# the exact title and selected segment, rather than merely retain the old tiles after an error.
- tapOn:
    id: "ds.period.prev"
- extendedWaitUntil:
    visible:
      text: "Август 2026"
      childOf:
        id: "ds.period.pick"
    timeout: 10000
- tapOn:
    id: "ds.segment.1"
- extendedWaitUntil:
    visible:
      text: "III квартал 2026"
      childOf:
        id: "ds.period.pick"
    timeout: 10000
- assertVisible:
    id: "ds.segment.1"
    checked: true
- assertNotVisible:
    id: "ds.error.info"
- assertNotVisible:
    id: "ds.error.warning"
- assertNotVisible:
    id: "ds.error.error"
- assertNotVisible:
    id: "ds.snackbar"
- assertNotVisible: "Не получилось обновить. Попробуйте ещё раз"
- assertNotVisible: "Не получилось загрузить аналитику"
- tapOn:
    id: "ds.period.prev"
- extendedWaitUntil:
