appId: ru.finassist.pf.mock.e2e
name: Аналитика — блоки, периоды, переводы, переход к операциям
tags:
  - smoke
  - analytics
---
- runFlow: ../../subflows/clear_state.yaml
- runFlow: ../../subflows/fast_login.yaml
- tapOn:
    id: "ds.tab.analytics"
- extendedWaitUntil:
    visible:
      id: "analytics.block.tiles"
    timeout: 15000
# "Now" is pinned to 8 October 2026. The fixture statement period runs to 1 October, so the latest month with
# data — October, empty so far — opens by default; September one step back holds the operations.
- assertVisible: "Октябрь 2026"
- assertVisible:
    id: "analytics.ask"
- tapOn:
    id: "ds.period.prev"
- extendedWaitUntil:
    visible: "Сентябрь 2026"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "analytics.block.expense_categories"
- assertVisible:
    id: "analytics.expense_category"
- scrollUntilVisible:
    element:
      id: "analytics.block.income_categories"
    direction: DOWN
- scrollUntilVisible:
    element:
      id: "ds.period.pick"
    direction: UP
# Scrolling up stops on the first strip of the period row, and that strip can lie under the screen title, where a tap
# lands on the title (FIN-188). Only the assistant card stands above the row, shorter than this swipe: one more
# swipe brings the list to its top. The card in view means the whole row is in view; a visible strip of the row
# alone would pass a check the same way `ds.period.pick` passed `scrollUntilVisible`.
- swipe:
    start: "50%, 30%"
    end: "50%, 60%"
- extendedWaitUntil:
    visible:
      id: "analytics.ask"
    timeout: 5000
- assertVisible: "Сентябрь 2026"

# Previous month, then quarter / year / month again.
- tapOn:
    id: "ds.period.prev"
- extendedWaitUntil:
    visible: "Август 2026"
    timeout: 10000
- tapOn:
    id: "ds.segment.1"
- extendedWaitUntil:
    visible:
      id: "analytics.block.tiles"
    timeout: 10000
- tapOn:
    id: "ds.segment.2"
- extendedWaitUntil:
    visible:
      id: "analytics.block.tiles"
    timeout: 10000
- tapOn:
    id: "ds.segment.0"
- extendedWaitUntil:
    visible:
      id: "analytics.block.tiles"
    timeout: 10000
# Back to a month: if the latest (empty) one opened, step to September, which has categories.
- runFlow:
    when:
      visible: "Октябрь 2026"
    commands:
      - tapOn:
          id: "ds.period.prev"
      - extendedWaitUntil:
          visible: "Сентябрь 2026"
          timeout: 10000

# «С переводами» → «Без переводов».
- tapOn:
    id: "analytics.transfers"
- tapOn:
    id: "analytics.transfers.without"
- extendedWaitUntil:
    visible: "Без переводов"
    timeout: 5000
- assertVisible:
    id: "analytics.transfers"
    checked: true

# A category opens the operations it is made of.
- scrollUntilVisible:
    element:
      id: "analytics.expense_category"
- tapOn:
    id: "analytics.expense_category"
    index: 0
- extendedWaitUntil:
    visible:
      id: "operations.search"
    timeout: 10000
- assertVisible:
    id: "operations.row"
- tapOn:
    id: "ds.back"
- assertVisible:
    id: "analytics.screen"
