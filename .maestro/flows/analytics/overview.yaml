# «С переводами» → «Без переводов».
- tapOn:
    id: "analytics.transfers"
- tapOn:
    id: "analytics.transfers.without"
- extendedWaitUntil:
    visible: "Без переводов"
    timeout: 5000
- assertVisible:
    id: "analytics.transfers"
    checked: true

# A category opens the operations it is made of.
- scrollUntilVisible:
    element:
      id: "analytics.expense_category"
- tapOn:
    id: "analytics.expense_category"
    index: 0
- extendedWaitUntil:
    visible:
      id: "operations.search"
    timeout: 10000
- assertVisible:
    id: "operations.row"
- tapOn:
    id: "ds.back"
- assertVisible:
    id: "analytics.screen"
