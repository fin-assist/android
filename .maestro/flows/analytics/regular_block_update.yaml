appId: ru.finassist.pf.mock.e2e
name: Аналитика — полный блок после одного действия и ручной повтор неизвестного результата
tags:
  - analytics
  - mock-only
---
- runFlow: ../../subflows/clear_state.yaml
- runFlow: ../../subflows/fast_login.yaml
- tapOn:
    id: "ds.tab.analytics"
- extendedWaitUntil:
    visible:
      text: "Октябрь 2026"
      childOf:
        id: "ds.period.pick"
    timeout: 15000
- tapOn:
    id: "ds.period.prev"
- extendedWaitUntil:
    visible:
      text: "Сентябрь 2026"
      childOf:
        id: "ds.period.pick"
    timeout: 10000
# Freeze the full-screen GET path. Only the PUT's complete block can remove this row now.
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?analytics_recalculating_responses=100"
- scrollUntilVisible:
    element: "Не подписка — РБК"
- assertVisible: "РБК"
- tapOn: "Не подписка — РБК"
- extendedWaitUntil:
    notVisible: "Не подписка — РБК"
    timeout: 10000
- assertNotVisible: "РБК"
# Observe the applied PUT block for longer than two 3 s polls while GET still returns the old row.
# The promoted third row is a positive oracle: an offscreen RBC row alone would not prove retention.
# Stay in the same card before observing: do not let an offscreen old row look like a successful update.
- scrollUntilVisible:
    element: "Не подписка — планшет.*"
- evalScript: ${output.markedReadUntil = Date.now() + 7000}
- repeat:
    while:
      true: ${Date.now() < output.markedReadUntil}
    commands:
      - assertVisible: "Не подписка — планшет.*"
      - assertNotVisible: "Не подписка — РБК"
      - assertNotVisible: "РБК"
# UI interactions can consume the ten-response poll budget. Observe its bounded pause explicitly;
# a ready GET is still forbidden, and the PUT block must remain applied throughout.
- scrollUntilVisible:
    element:
      id: "analytics.recalculating"
    direction: UP
- extendedWaitUntil:
    visible: "Не удалось обновить показатели\\. Показаны данные до изменений"
    timeout: 40000
- assertVisible:
    id: "analytics.retry"
    enabled: true
# Keep the paused notice in view until the explicit retry. Scrolling up to the month here can
# trigger pull-to-refresh, restart polling and consume the ready GET before the retry is tapped.
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?analytics_recalculating_responses=0"
- assertVisible:
    id: "analytics.retry"
    enabled: true
- assertVisible: "Не удалось обновить показатели\\. Показаны данные до изменений"
- tapOn:
    id: "analytics.retry"
- extendedWaitUntil:
    notVisible:
      id: "analytics.recalculating"
    timeout: 15000
# Check the preserved month after the explicit retry has completed. The picker container can be
# clipped to a strip; wait for its actual label before checking the month.
- scrollUntilVisible:
    element:
      text: "Сентябрь 2026"
      childOf:
        id: "ds.period.pick"
    direction: UP
- assertVisible:
    text: "Сентябрь 2026"
    childOf:
      id: "ds.period.pick"
- scrollUntilVisible:
    element: "Не подписка — планшет.*"
- assertNotVisible: "РБК"

- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?expect_analytics_dismiss_requests=1"

# An offline result is unknown. Returning online and a read cannot claim this write succeeded.
- runFlow: ../../subflows/clear_state.yaml
- runFlow: ../../subflows/fast_login.yaml
- tapOn:
    id: "ds.tab.analytics"
- extendedWaitUntil:
    visible:
      text: "Октябрь 2026"
      childOf:
        id: "ds.period.pick"
    timeout: 15000
- tapOn:
    id: "ds.period.prev"
- extendedWaitUntil:
    visible:
      text: "Сентябрь 2026"
      childOf:
        id: "ds.period.pick"
    timeout: 10000
- scrollUntilVisible:
    element: "Не подписка — РБК"
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?offline=true"
# Resuming from the control link can insert a read-error notice above the retained financial body.
- scrollUntilVisible:
    element: "Не подписка — РБК"
    centerElement: true
- tapOn: "Не подписка — РБК"
- extendedWaitUntil:
    visible: "(?s)Не получилось убрать.*"
    timeout: 10000
- scrollUntilVisible:
    element: "Не подписка — РБК"
- assertVisible: "РБК"
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?offline=false&expect_analytics_dismiss_requests=1"
- scrollUntilVisible:
    element:
      id: "analytics.unknown_mutation"
    direction: UP
- swipe:
    start: "50%, 30%"
    end: "50%, 65%"
- scrollUntilVisible:
    element: "Не подписка — РБК"
- assertVisible: "РБК"
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?expect_analytics_dismiss_requests=1"
# A fresh successful PUT, not a GET, settles the unknown result.
- tapOn: "Не подписка — РБК"
- extendedWaitUntil:
    notVisible: "Не подписка — РБК"
    timeout: 10000
- scrollUntilVisible:
    element: "Не подписка — планшет.*"
- assertNotVisible: "РБК"
- assertNotVisible: "Не подписка — РБК"
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?expect_analytics_dismiss_requests=2"
