appId: ru.finassist.pf.mock.e2e
name: Аналитика — полный блок после одного действия и ручной повтор неизвестного результата
tags:
  - analytics
  - mock-only
---
- runFlow: ../../subflows/clear_state.yaml
- runFlow: ../../subflows/fast_login.yaml
- tapOn:
    id: "ds.tab.analytics"
- extendedWaitUntil:
    visible:
      text: "Октябрь 2026"
      childOf:
        id: "ds.period.pick"
    timeout: 15000
- tapOn:
    id: "ds.period.prev"
- extendedWaitUntil:
    visible:
      text: "Сентябрь 2026"
      childOf:
        id: "ds.period.pick"
    timeout: 10000
# Freeze the full-screen GET path. Only the PUT's complete block can remove this row now.
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?analytics_recalculating_responses=100"
- scrollUntilVisible:
    element: "Не подписка — РБК"
- assertVisible: "РБК"
- tapOn: "Не подписка — РБК"
- extendedWaitUntil:
    notVisible: "Не подписка — РБК"
    timeout: 10000
- assertNotVisible: "РБК"
- scrollUntilVisible:
    element:
      id: "analytics.recalculating"
    direction: UP
- assertVisible: "Пересчитываем после изменений.*"
# Observe the applied PUT block for longer than two 3 s polls while GET still returns the old row.
# The promoted third row is a positive oracle: an offscreen RBC row alone would not prove retention.
- scrollUntilVisible:
    element: "Не подписка — планшет.*"
- evalScript: ${output.markedReadUntil = Date.now() + 7000}
- repeat:
    while:
      true: ${Date.now() < output.markedReadUntil}
    commands:
      - assertVisible: "Не подписка — планшет.*"
      - assertNotVisible: "Не подписка — РБК"
      - assertNotVisible: "РБК"
# The recalculation notice is above the financial cards; check it there before allowing a ready GET.
- scrollUntilVisible:
    element:
      id: "analytics.recalculating"
    direction: UP
- assertVisible:
    id: "analytics.recalculating"
- assertVisible:
    text: "Сентябрь 2026"
    childOf:
      id: "ds.period.pick"
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?analytics_recalculating_responses=0"
- extendedWaitUntil:
    notVisible:
      id: "analytics.recalculating"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "analytics.block.regular_payments"
- assertNotVisible: "РБК"

# An offline result is unknown. Returning online and a read cannot claim this write succeeded.
- runFlow: ../../subflows/clear_state.yaml
- runFlow: ../../subflows/fast_login.yaml
- tapOn:
    id: "ds.tab.analytics"
- extendedWaitUntil:
    visible:
      text: "Октябрь 2026"
      childOf:
        id: "ds.period.pick"
    timeout: 15000
- tapOn:
    id: "ds.period.prev"
- extendedWaitUntil:
    visible:
      text: "Сентябрь 2026"
      childOf:
        id: "ds.period.pick"
    timeout: 10000
- scrollUntilVisible:
    element: "Не подписка — РБК"
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?offline=true"
- tapOn: "Не подписка — РБК"
- extendedWaitUntil:
    visible: "Не получилось убрать.*"
    timeout: 10000
- assertVisible: "РБК"
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?offline=false"
- scrollUntilVisible:
    element:
      id: "analytics.unknown_mutation"
    direction: UP
- swipe:
    start: "50%, 30%"
    end: "50%, 65%"
- scrollUntilVisible:
    element: "Не подписка — РБК"
- assertVisible: "РБК"
# A fresh successful PUT, not a GET, settles the unknown result.
- tapOn: "Не подписка — РБК"
- extendedWaitUntil:
    notVisible: "Не подписка — РБК"
    timeout: 10000
- assertNotVisible: "РБК"
