appId: ru.finassist.pf.mock.e2e
name: Аналитика — прерывание онбординга и новый порядок на чистой установке
tags:
  - analytics
---
- runFlow: ../../subflows/clear_state.yaml
- runFlow: ../../subflows/fast_login.yaml
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?analytics_help=onboarding"
- tapOn:
    id: "ds.tab.analytics"
- extendedWaitUntil:
    visible:
      id: "analytics.tile.daily.help.popup"
    timeout: 15000
- pressKey: HOME
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      id: "analytics.screen"
    timeout: 15000
- assertNotVisible:
    id: "analytics.tile.daily.help.popup"
- assertNotVisible:
    id: "analytics.block.balance.help.popup"
- tapOn:
    id: "ds.tab.operations"
- extendedWaitUntil:
    visible:
      id: "operations.feed"
    timeout: 10000
- tapOn:
    id: "ds.tab.analytics"
- extendedWaitUntil:
    visible:
      id: "analytics.tile.daily.help"
    timeout: 15000
- assertNotVisible:
    id: "analytics.tile.daily.help.popup"
- assertNotVisible:
    id: "analytics.block.balance.help.popup"
- tapOn:
    id: "analytics.tile.daily.help"
- assertVisible:
    id: "analytics.tile.daily.help.popup"
- back
- scrollUntilVisible:
    element:
      id: "analytics.block.balance.help"
    direction: DOWN
- tapOn:
    id: "analytics.block.balance.help"
- assertVisible:
    id: "analytics.block.balance.help.popup"

# Clearing app data models a fresh installation, with the same existing mock account.
- runFlow: ../../subflows/clear_state.yaml
- runFlow: ../../subflows/fast_login.yaml
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?analytics_help=reversed"
- tapOn:
    id: "ds.tab.analytics"
- extendedWaitUntil:
    visible:
      id: "analytics.block.balance.help.popup"
    timeout: 15000
- assertVisible: "Разница показывает, сколько осталось после расходов."
- assertNotVisible:
    id: "analytics.tile.daily.help.popup"
- back
- extendedWaitUntil:
    visible:
      id: "analytics.block.monthly_chart.help.popup"
    timeout: 15000
- back
- scrollUntilVisible:
    element:
      id: "analytics.tile.daily.help"
    direction: UP
- tapOn:
    id: "analytics.tile.daily.help"
- assertVisible:
    id: "analytics.tile.daily.help.popup"
