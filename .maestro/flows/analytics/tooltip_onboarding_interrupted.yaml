appId: ru.finassist.pf.mock.e2e
name: Аналитика — прерывание, порядок без карточки помощника и пропуск подсказок
tags:
  - analytics
---
- runFlow: ../../subflows/clear_state.yaml
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?analytics_help=onboarding"
- runFlow: ../../subflows/fast_login.yaml
- tapOn:
    id: "ds.tab.analytics"
- extendedWaitUntil:
    visible:
      id: "analytics.ask.help.popup"
    timeout: 15000
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?lock_app=true"
- extendedWaitUntil:
    visible:
      id: "applock.unlock"
    timeout: 15000
- assertNotVisible:
    id: "analytics.ask.help.popup"
- assertNotVisible:
    id: "analytics.tile.daily.help.popup"
- runFlow:
    file: ../../subflows/enter_code.yaml
    env:
      CODE: "1234"
- extendedWaitUntil:
    visible:
      id: "analytics.screen"
    timeout: 15000
- assertNotVisible:
    id: "analytics.ask.help.popup"
- assertNotVisible:
    id: "analytics.tile.daily.help.popup"
- scrollUntilVisible:
    element:
      id: "analytics.tile.daily.help"
    centerElement: true
- tapOn:
    id: "analytics.tile.daily.help"
- assertVisible:
    id: "analytics.tile.daily.help.popup"
- back
- scrollUntilVisible:
    element:
      id: "analytics.block.balance.help"
- tapOn:
    id: "analytics.block.balance.help"
- assertVisible:
    id: "analytics.block.balance.help.popup"
- back

# The clean installation orders monthly chart before balance, although the server gives balance help_order=1.
- runFlow: ../../subflows/clear_state.yaml
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?analytics_help=reversed&flag.assistant=false"
- runFlow: ../../subflows/fast_login.yaml
- tapOn:
    id: "ds.tab.analytics"
- extendedWaitUntil:
    visible:
      id: "analytics.block.monthly_chart.help.popup"
    timeout: 15000
- assertNotVisible:
    id: "analytics.block.balance.help.popup"
- back
- extendedWaitUntil:
    visible:
      id: "analytics.block.expense_categories.help.popup"
    timeout: 15000
- tapOn:
    id: "analytics.block.expense_categories.help.popup.skip"
- assertNotVisible:
    id: "analytics.block.balance.help.popup"
- scrollUntilVisible:
    element:
      id: "analytics.block.balance.help"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "analytics.block.balance.help"
- assertVisible: "Разница показывает, сколько осталось после расходов."
- back
- scrollUntilVisible:
    element:
      id: "analytics.tile.daily.help"
    direction: UP
    centerElement: true
- assertNotVisible:
    id: "analytics.ask.help"
- tapOn:
    id: "analytics.tile.daily.help"
- assertVisible:
    id: "analytics.tile.daily.help.popup"
