appId: ru.finassist.pf.mock.e2e
name: Аналитика — готовый снимок при пересчёте и подготовка другого периода
tags:
  - analytics
  - mock-only
---
- runFlow: ../../subflows/clear_state.yaml
- runFlow: ../../subflows/fast_login.yaml
- tapOn:
    id: "ds.tab.analytics"
- extendedWaitUntil:
    visible: "Октябрь 2026"
    timeout: 15000
- tapOn:
    id: "ds.period.prev"
- extendedWaitUntil:
    visible: "Сентябрь 2026"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "analytics.expense_category"
# The intermediate response has changed blocks. Merely retaining the recalculating payload would fail.
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?analytics_recalculating_responses=100&failing_blocks=expense_categories"
- runFlow:
    file: ../../subflows/reveal_tag_up.yaml
    env:
      TARGET_ID: "analytics.recalculating"
- assertVisible: "Пересчитываем после изменений.*"
- scrollUntilVisible:
    element:
      id: "analytics.expense_category"
    centerElement: true
- assertVisible:
    id: "analytics.expense_category"
- assertNotVisible: "Не получилось посчитать.*"
# Give the next phase its own full client budget, even if observation consumed the current one.
- runFlow:
    file: ../../subflows/reveal_tag_up.yaml
    env:
      TARGET_ID: "analytics.recalculating"
- extendedWaitUntil:
    visible: "Не удалось обновить показатели.*"
    timeout: 40000
- assertVisible:
    id: "analytics.retry"
    enabled: true
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?analytics_recalculating_responses=4"
- assertVisible: "Не удалось обновить показатели.*"
- tapOn:
    id: "analytics.retry"
# No more control links or refreshes: the marked Retry response must advance to ready via polling.
- scrollUntilVisible:
    element: "Расходы по категориям"
    centerElement: true
- extendedWaitUntil:
    visible: "Не получилось посчитать.*"
    timeout: 20000
- assertNotVisible:
    id: "analytics.expense_category"
- runFlow:
    file: ../../subflows/reveal_text_up.yaml
    env:
      TARGET_TEXT: "Сентябрь 2026"
      PARENT_ID: "ds.period.pick"
- assertNotVisible:
    id: "analytics.recalculating"

# The companion checks retained-unavailable recovery and uncached-Year preparation with held replies.
# Keep the independent refused-mutation journey below on the real app.

# Regression: a failed mutation must not silently kill an active recalculation read.
- scrollUntilVisible:
    element:
      id: "ds.segment.0"
    direction: UP
- swipe:
    start: "50%, 30%"
    end: "50%, 65%"
- tapOn:
    id: "ds.segment.0"
- extendedWaitUntil:
    visible: "Сентябрь 2026"
    timeout: 10000
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?analytics_recalculating_responses=100&error_operation=analytics_dismiss&error_scenario=retry_forbidden"
- scrollUntilVisible:
    element:
      id: "analytics.recalculating"
- assertVisible: "Пересчитываем после изменений.*"
- scrollUntilVisible:
    element: "Не подписка — РБК"
    timeout: 15000
- assertVisible: "РБК"
- tapOn: "Не подписка — РБК"
- extendedWaitUntil:
    visible: "Не получилось убрать.*"
    timeout: 10000
- assertVisible: "РБК"
- runFlow:
    file: ../../subflows/reveal_tag_up.yaml
    env:
      TARGET_ID: "analytics.recalculating"
# Do not open another control activity, pull-refresh or leave the screen before this check:
# a resume could restart the cancelled poll and hide the original bug. The resumed GETs reach
# the bounded wait themselves; before the fix the promise remains forever without a Retry link.
- extendedWaitUntil:
    visible: "Не удалось обновить показатели.*"
    timeout: 40000
- assertVisible:
    id: "analytics.retry"
    enabled: true
- assertNotVisible:
    id: "analytics.updating"
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?expect_error_requests=1&expect_analytics_dismiss_requests=1&error_operation=off&analytics_recalculating_responses=0"
- assertVisible: "Не удалось обновить показатели.*"
- tapOn:
    id: "analytics.retry"
- extendedWaitUntil:
    notVisible:
      id: "analytics.recalculating"
    timeout: 15000
# Removing the notice preserves the body offset and can leave the period header above the viewport.
- runFlow:
    file: ../../subflows/reveal_text_up.yaml
    env:
      TARGET_TEXT: "Сентябрь 2026"
      PARENT_ID: "ds.period.pick"
- assertVisible:
    text: "Сентябрь 2026"
    childOf:
      id: "ds.period.pick"
- assertVisible:
    id: "ds.segment.0"
    checked: true
- scrollUntilVisible:
    element: "Не подписка — РБК"
- assertVisible: "РБК"
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?expect_error_requests=1&expect_analytics_dismiss_requests=1"
