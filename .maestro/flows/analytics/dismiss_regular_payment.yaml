appId: ru.finassist.pf.mock.e2e
name: Не подписка — ожидание публикации, таймаут и повтор только чтения
tags:
  - analytics
  - mock-only
---
- runFlow: ../../subflows/clear_state.yaml
- runFlow: ../../subflows/fast_login.yaml
- tapOn:
    id: "ds.tab.analytics"
- extendedWaitUntil:
    visible:
      text: "Октябрь 2026"
      childOf:
        id: "ds.period.pick"
    timeout: 15000
- tapOn:
    id: "ds.period.prev"
- extendedWaitUntil:
    visible:
      text: "Сентябрь 2026"
      childOf:
        id: "ds.period.pick"
    timeout: 15000
- scrollUntilVisible:
    element: "Не подписка — РБК"
    direction: DOWN
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?offline=true"
- tapOn: "Не подписка — РБК"
- extendedWaitUntil:
    visible: "(?s).*Не получилось убрать.*"
    timeout: 15000
- assertVisible: "Не подписка — РБК"
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?offline=false&dismissal_stale_reads=9"
- doubleTapOn: "Не подписка — РБК"
# The successful write is still unpublished: the row stays, and a second tap is disabled.
- assertVisible:
    text: "Не подписка — РБК"
    enabled: false
- assertVisible: "Обновляем…"
- scrollUntilVisible:
    element: "Пересчитываем после изменений — цифры обновятся через несколько секунд"
    direction: UP
- assertVisible: "Пересчитываем после изменений — цифры обновятся через несколько секунд"
- extendedWaitUntil:
    notVisible: "Пересчитываем после изменений — цифры обновятся через несколько секунд"
    timeout: 40000
- scrollUntilVisible:
    element: "Не подписка — Ростелеком"
    direction: DOWN
- assertNotVisible: "Не подписка — РБК"
- assertVisible: "Не подписка — Ростелеком"
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?expect_dismissal_writes=1&dismissal_stale_reads=10"
# Ten stale GETs exhaust the automatic budget; the next fresh GET must be an explicit retry.
- tapOn: "Не подписка — Ростелеком"
- assertVisible:
    text: "Не подписка — Ростелеком"
    enabled: false
- assertVisible: "Обновляем…"
- scrollUntilVisible:
    element: "Пересчитываем после изменений — цифры обновятся через несколько секунд"
    direction: UP
- extendedWaitUntil:
    visible: "Не удалось обновить показатели. Показаны данные до изменений"
    timeout: 45000
- assertVisible:
    id: "analytics.retry"
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?expect_dismissal_writes=2"
# Returning from the control activity must not resume timed-out polling.
- assertVisible: "Не удалось обновить показатели. Показаны данные до изменений"
- tapOn:
    id: "analytics.retry"
- extendedWaitUntil:
    notVisible: "Не удалось обновить показатели. Показаны данные до изменений"
    timeout: 15000
- scrollUntilVisible:
    element: "Не подписка — Мой телефон.*"
    direction: DOWN
- assertVisible: "Не подписка — Мой телефон.*"
- assertNotVisible: "Не подписка — РБК"
- assertNotVisible: "Не подписка — Ростелеком"
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?expect_dismissal_writes=2"
- tapOn:
    id: "ds.tab.operations"
- tapOn:
    id: "ds.tab.analytics"
- scrollUntilVisible:
    element: "Не подписка — Мой телефон.*"
    direction: DOWN
- assertVisible: "Не подписка — Мой телефон.*"
- assertNotVisible: "Не подписка — РБК"
- assertNotVisible: "Не подписка — Ростелеком"
