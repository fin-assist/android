appId: ru.finassist.pf.mock.e2e
name: Аналитика — подсказки по раскладке и повторное ручное открытие
tags:
  - analytics
---
- runFlow: ../../subflows/clear_state.yaml
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?analytics_help=onboarding"
- runFlow: ../../subflows/fast_login.yaml
- tapOn:
    id: "ds.tab.analytics"
- extendedWaitUntil:
    visible:
      id: "analytics.ask.help.popup"
    timeout: 15000
- assertVisible: "Помощник отвечает по вашим операциям, 5 вопросов в день"
- back
- extendedWaitUntil:
    visible:
      id: "analytics.tile.daily.help.popup"
    timeout: 15000
- assertNotVisible:
    id: "analytics.block.monthly_chart.help.popup"
- back
- extendedWaitUntil:
    visible:
      id: "analytics.block.expense_categories.help.popup"
    timeout: 15000
- assertVisible: "Категории проставили мы — любую можно поправить в операции"
- back
- extendedWaitUntil:
    visible:
      id: "analytics.block.balance.help.popup"
    timeout: 15000
- assertVisible: "Доходов за период нет"
- back
- assertVisible:
    id: "analytics.block.balance.help"
- tapOn:
    id: "ds.tab.operations"
- extendedWaitUntil:
    visible:
      id: "operations.feed"
    timeout: 10000
- tapOn:
    id: "ds.tab.analytics"
- scrollUntilVisible:
    element:
      id: "analytics.ask.help"
    direction: UP
    centerElement: true
- assertNotVisible:
    id: "analytics.ask.help.popup"
- tapOn:
    id: "analytics.ask.help"
- assertVisible:
    id: "analytics.ask.help.popup"
- assertNotVisible:
    id: "analytics.ask.help.popup.skip"
- back
- tapOn:
    id: "analytics.ask"
- extendedWaitUntil:
    visible:
      id: "assistant.chat"
    timeout: 10000
- back
- extendedWaitUntil:
    visible:
      id: "analytics.screen"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "analytics.block.expense_categories.help"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "analytics.block.expense_categories.help"
- assertVisible:
    id: "analytics.block.expense_categories.help.popup"
- back
- scrollUntilVisible:
    element:
      id: "analytics.expense_category"
      index: 0
    direction: DOWN
    centerElement: true
- tapOn:
    id: "analytics.expense_category"
    index: 0
- extendedWaitUntil:
    visible:
      id: "operations.search"
    timeout: 10000
