appId: ru.finassist.pf.mock.e2e
name: Аналитика — блок неизвестного типа и неизвестная блокировка показываются текстом сервера
tags:
  - analytics
---
# FIN-4/FIN-83 with `unknown_codes=true`: a block of a type this client cannot draw is shown by its text version, a card
# locked for a reason it does not know — with the server's lock text.
- runFlow: ../../subflows/clear_state.yaml
- runFlow: ../../subflows/login.yaml
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?unknown_codes=true"
- tapOn:
    id: "ds.tab.analytics"
- extendedWaitUntil:
    visible:
      id: "analytics.block.tiles"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "analytics.block.e2e_unknown"
- assertVisible: "Карта расходов по районам — обновите приложение, чтобы её увидеть"
- scrollUntilVisible:
    element:
      id: "analytics.block.e2e_locked"
- assertVisible: ".*Откроется, когда подключите второй банк.*"
