appId: ru.finassist.pf.mock.e2e
name: Аналитика — вся история по страницам и возврат к выбранному месяцу
tags:
  - analytics
  - mock-only
---
- runFlow: ../../subflows/clear_state.yaml
# Keep cold fixture loading outside sign-in, then complete the existing UI setup.
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      id: "auth.phone.document"
    timeout: 60000
- runFlow: ../../subflows/login.yaml
# Replace the preloaded year through the public UI with synthetic history spanning 2000–2026.
- tapOn:
    id: "ds.tab.profile"
- extendedWaitUntil:
    visible:
      id: "profile.statements"
    timeout: 10000
- tapOn:
    id: "profile.statements"
- extendedWaitUntil:
    visible:
      id: "statements.history.row"
    timeout: 10000
- tapOn:
    id: "statements.history.delete"
    index: 0
- tapOn:
    id: "ds.dialog.confirm"
- extendedWaitUntil:
    visible:
      id: "statements.history.empty"
    timeout: 10000
- tapOn:
    id: "statements.history.upload"
- scrollUntilVisible:
    element:
      id: "statements.upload.pick"
- tapOn:
    id: "statements.upload.pick"
- scrollUntilVisible:
    element:
      id: "e2e.picker.chart-history.ofx"
- tapOn:
    id: "e2e.picker.chart-history.ofx"
- extendedWaitUntil:
    visible:
      id: "statements.result"
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "statements.result.analytics"
- tapOn:
    id: "statements.result.analytics"
- extendedWaitUntil:
    visible:
      text: "Октябрь 2026"
      childOf:
        id: "ds.period.pick"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "analytics.block.monthly_chart"
    centerElement: true
- assertVisible:
    id: "analytics.expense.monthly.point.2026-10"
# The initial server page covers 2021-11..2026-10. Reach page 3 so page 0 is evicted,
# then the reverse journey must exercise the real newer-edge request as well as older paging.
# The companion covers the exhaustive 2000..2026 traversal, eviction and reverse reloads without hundreds of gestures.
- repeat:
    times: 250
    while:
      notVisible:
        id: "analytics.expense.monthly.point.2011-10"
    commands:
      - swipe:
          from:
            id: "analytics.expense.monthly"
          direction: RIGHT
          duration: 300
# First visibility can be a clipped sliver; one more drag reaches the oldest edge before tapping.
- swipe:
    from:
      id: "analytics.expense.monthly"
    direction: RIGHT
    duration: 300
- assertVisible:
    id: "analytics.expense.monthly.point.2011-10"
# A covered zero from page 3 is a complete selectable month.
- tapOn:
    id: "analytics.expense.monthly.point.2011-10"
- extendedWaitUntil:
    visible:
      id: "analytics.expense.monthly.point.2011-10"
      checked: true
    timeout: 10000
# A clipped picker can be visible while its title is above the viewport.
- runFlow:
    file: ../../subflows/reveal_text.yaml
    env:
      TARGET_TEXT: "Октябрь 2011"
      PARENT_ID: "ds.period.pick"
      DIRECTION: UP
- assertVisible:
    text: "Октябрь 2011"
    childOf:
      id: "ds.period.pick"
- scrollUntilVisible:
    element:
      id: "analytics.block.monthly_chart"
    centerElement: true
# Reload the evicted newest page through real reverse gestures without changing the selected period.
- repeat:
    times: 250
    while:
      notVisible:
        id: "analytics.expense.monthly.point.2026-10"
    commands:
      - swipe:
          from:
            id: "analytics.expense.monthly"
          direction: LEFT
          duration: 300
# Likewise expose the newest edge completely before the later explicit selection.
- swipe:
    from:
      id: "analytics.expense.monthly"
    direction: LEFT
    duration: 300
- assertVisible:
    id: "analytics.expense.monthly.point.2026-10"
# A clipped picker can be visible while its title is above the viewport.
- runFlow:
    file: ../../subflows/reveal_text.yaml
    env:
      TARGET_TEXT: "Октябрь 2011"
      PARENT_ID: "ds.period.pick"
      DIRECTION: UP
- assertVisible:
    text: "Октябрь 2011"
    childOf:
      id: "ds.period.pick"
- scrollUntilVisible:
    element:
      id: "analytics.block.monthly_chart"
    centerElement: true
- tapOn:
    id: "analytics.expense.monthly.point.2026-10"
- extendedWaitUntil:
    visible:
      id: "analytics.expense.monthly.point.2026-10"
      checked: true
    timeout: 10000
# A clipped picker can be visible while its title is above the viewport.
- runFlow:
    file: ../../subflows/reveal_text.yaml
    env:
      TARGET_TEXT: "Октябрь 2026"
      PARENT_ID: "ds.period.pick"
      DIRECTION: UP
- assertVisible:
    text: "Октябрь 2026"
    childOf:
      id: "ds.period.pick"
