appId: ru.finassist.pf.mock.e2e
name: Аналитика за всё время — годы, переводы, повтор и изменение источников
# Mock-only: offline control and a synthetic picker file do not alter stage services.
tags:
  - analytics
  - mock-only
---
- runFlow: ../../subflows/clear_state.yaml
- runFlow: ../../subflows/fast_login.yaml
- tapOn:
    id: "ds.tab.analytics"
- extendedWaitUntil:
    visible:
      text: "Октябрь 2026"
      childOf:
        id: "ds.period.pick"
    timeout: 15000
# Bounded horizontal reveal: on wide screens this clamps without moving the row.
- swipe:
    from:
      id: "analytics.period.types"
    direction: LEFT
- tapOn:
    id: "analytics.period.all_time"
- extendedWaitUntil:
    visible:
      id: "analytics.period.all_time"
      checked: true
    timeout: 15000
- assertVisible:
    text: "За всё время.*"
    childOf:
      id: "ds.period.pick"
- assertVisible:
    id: "analytics.period.all_time.range"
    text: ".*2025.*2026.*"
- tapOn:
    id: "analytics.transfers"
- tapOn:
    text: "Без переводов.*"
- extendedWaitUntil:
    visible:
      text: "Без переводов.*"
      childOf:
        id: "analytics.transfers"
    timeout: 10000
# Calendar selection is restored; a failed all-time transition retains that exact screen.
- swipe:
    from:
      id: "analytics.period.types"
    direction: RIGHT
- tapOn:
    id: "ds.segment.0"
- extendedWaitUntil:
    visible:
      text: "Октябрь 2026"
      childOf:
        id: "ds.period.pick"
    timeout: 10000
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?offline=true"
# Bounded horizontal reveal: on wide screens this clamps without moving the row.
- swipe:
    from:
      id: "analytics.period.types"
    direction: LEFT
- tapOn:
    id: "analytics.period.all_time"
- extendedWaitUntil:
    visible:
      id: "analytics.period.retry"
    timeout: 15000
- assertVisible:
    text: "Октябрь 2026"
    childOf:
      id: "ds.period.pick"
- swipe:
    from:
      id: "analytics.period.types"
    direction: RIGHT
- assertVisible:
    id: "ds.segment.0"
    checked: true
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?offline=false"
- tapOn:
    id: "analytics.period.retry"
- extendedWaitUntil:
    visible:
      id: "analytics.period.all_time"
      checked: true
    timeout: 15000
- assertVisible:
    text: "Без переводов.*"
    childOf:
      id: "analytics.transfers"
- assertNotVisible:
    id: "analytics.period.retry"
# An older source extends the existing all-time tab; it is not a rolling twelve-month view.
- tapOn:
    id: "ds.tab.profile"
- tapOn:
    id: "profile.statements"
- extendedWaitUntil:
    visible:
      id: "statements.history"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "statements.history.upload"
- tapOn:
    id: "statements.history.upload"
- scrollUntilVisible:
    element:
      id: "statements.upload.pick"
- tapOn:
    id: "statements.upload.pick"
- tapOn:
    id: "e2e.picker.all-time.ofx"
- extendedWaitUntil:
    visible:
      id: "statements.result"
    timeout: 20000
- tapOn:
    id: "statements.result.done"
- tapOn:
    id: "ds.tab.analytics"
- extendedWaitUntil:
    visible:
      id: "analytics.period.all_time.range"
      text: ".*1.января.2024.*7.октября.2026.*"
    timeout: 15000
- assertVisible:
    id: "analytics.period.all_time"
    checked: true
- assertVisible:
    text: "Без переводов.*"
    childOf:
      id: "analytics.transfers"
- scrollUntilVisible:
    element:
      id: "analytics.tile.expense"
- tapOn:
    id: "analytics.tile.expense"
- extendedWaitUntil:
    visible:
      id: "operations.search.count"
    timeout: 15000
- scrollUntilVisible:
    element: "История 2024 FIN-400"
    direction: DOWN
- assertVisible: "История 2024 FIN-400"
- back
# Delete the synthetic source; the retained selection shrinks to the original source envelope.
- tapOn:
    id: "ds.tab.profile"
- runFlow:
    when:
      notVisible:
        id: "statements.history"
    commands:
      - tapOn:
          id: "profile.statements"
- extendedWaitUntil:
    visible:
      id: "statements.history.row"
      index: 1
    timeout: 10000
- tapOn:
    id: "statements.history.delete"
    index: 0
- tapOn:
    id: "ds.dialog.confirm"
- extendedWaitUntil:
    notVisible:
      id: "statements.history.row"
      index: 1
    timeout: 15000
- back
- tapOn:
    id: "ds.tab.analytics"
- scrollUntilVisible:
    element:
      id: "analytics.period.all_time.range"
    direction: UP
- extendedWaitUntil:
    visible:
      id: "analytics.period.all_time.range"
      text: ".*2025.*2026.*"
    timeout: 15000
- assertNotVisible:
    id: "analytics.period.all_time.range"
    text: ".*2024.*"
- assertVisible:
    id: "analytics.period.all_time"
    checked: true
- tapOn:
    id: "ds.tab.profile"
- tapOn:
    id: "profile.statements"
- tapOn:
    id: "statements.history.delete"
    index: 0
- tapOn:
    id: "ds.dialog.confirm"
- extendedWaitUntil:
    notVisible:
      id: "statements.history.row"
    timeout: 15000
- back
- tapOn:
    id: "ds.tab.analytics"
- extendedWaitUntil:
    visible:
      id: "analytics.empty"
    timeout: 15000
- assertNotVisible:
    id: "analytics.block.tiles"
