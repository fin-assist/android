appId: ru.finassist.pf.mock.e2e
name: Обрыв потока без терминального события — поток переоткрывается, ошибки нет
tags:
  - offline
---
# FIN-170 (api.md «SSE»): `stream_drops=<n>` makes the fake server close the next n stream openings right after their
# first event, without a terminal one. The app re-opens each with a pause (0.5–1 s, then 1–2 s) and carries on; the
# user sees no «нет сети» and no error — on the call screen, during an import and while an answer is generated.

# ---- 1.2: the call screen ----
- runFlow: ../../subflows/clear_state.yaml
- launchApp
- extendedWaitUntil:
    visible:
      id: "auth.phone"
    timeout: 20000
# The call «arrives» after 6 s: two drops and their pauses fit into the wait.
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?call_delay_ms=6000&stream_drops=2"
- extendedWaitUntil:
    visible:
      id: "auth.phone"
    timeout: 10000
- tapOn:
    id: "auth.phone.input"
- inputText: "9161234567"
- hideKeyboard
- tapOn:
    id: "auth.phone.submit"
- extendedWaitUntil:
    visible:
      id: "auth.call"
    timeout: 10000
- assertVisible:
    id: "auth.call.dial"
- assertNotVisible: "Нет сети — не можем дождаться звонка. Проверьте интернет"
# The re-opened stream brings `verified`: sign-in goes on to the passcode.
- runFlow: ../../subflows/set_passcode.yaml
- extendedWaitUntil:
    visible:
      id: "operations.row"
    timeout: 40000

# ---- 3.3: the import progress ----
- tapOn:
    id: "ds.tab.profile"
- extendedWaitUntil:
    visible:
      id: "profile.statements"
    timeout: 10000
- tapOn:
    id: "profile.statements"
- extendedWaitUntil:
    visible:
      id: "statements.history"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "statements.history.upload"
- tapOn:
    id: "statements.history.upload"
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?stream_drops=2"
- scrollUntilVisible:
    element:
      id: "statements.upload.pick"
- tapOn:
    id: "statements.upload.pick"
- tapOn:
    id: "e2e.picker.october.ofx"
- extendedWaitUntil:
    visible:
      id: "statements.result"
    timeout: 30000
- assertVisible:
    id: "statements.result.new"
- assertNotVisible:
    id: "statements.upload.error.processing_failed"
- assertNotVisible:
    id: "statements.upload.offline"

# ---- 7.2: the assistant answer ----
- tapOn:
    id: "statements.result.done"
- extendedWaitUntil:
    notVisible:
      id: "statements.result"
    timeout: 10000
- tapOn:
    id: "ds.tab.analytics"
- extendedWaitUntil:
    visible:
      id: "analytics.ask"
    timeout: 15000
- tapOn:
    id: "analytics.ask"
- extendedWaitUntil:
    visible:
      id: "assistant.chat"
    timeout: 10000
- tapOn:
    id: "ds.chat.input"
- inputText: "Krabsbir"
- tapOn:
    id: "ds.chat.send"
- extendedWaitUntil:
    visible:
      id: "assistant.consent"
    timeout: 10000
- tapOn:
    id: "assistant.consent.checkbox"
# Set right before the question goes: the answer stream is the next one to open.
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?stream_drops=2"
- tapOn:
    id: "assistant.consent.submit"
- extendedWaitUntil:
    visible:
      id: "assistant.answer"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "ds.chat.input"
      enabled: true
    timeout: 30000
- assertVisible: ".*[Оо]сталось 4 из 5.*"
- assertNotVisible:
    id: "ds.chat.offline"
- assertNotVisible: "Не получилось ответить.*"
