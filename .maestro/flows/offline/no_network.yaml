appId: ru.finassist.pf.mock.e2e
name: Ошибка соединения — подсказка и «Повторить»
tags:
  - offline
---
- runFlow: ../../subflows/clear_state.yaml
- runFlow: ../../subflows/fast_login.yaml
# Every request of the fake backend fails from now on (until the process restarts or offline=false).
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?offline=true"
- tapOn:
    id: "ds.tab.analytics"
- extendedWaitUntil:
    visible:
      id: "analytics.offline"
    timeout: 15000
- assertVisible: "Не удаётся подключиться к серверу"
- assertVisible: "Проверьте интернет и попробуйте ещё раз"
- assertNotVisible: "Попробуйте отключить VPN и повторить подключение"
- assertVisible:
    id: "analytics.retry"
    enabled: true
- tapOn:
    id: "ds.tab.profile"
- extendedWaitUntil:
    visible:
      id: "profile.offline"
    timeout: 15000
- assertVisible: "Не удаётся подключиться к серверу"
- assertVisible: "Проверьте интернет и попробуйте ещё раз"

- assertVisible:
    id: "profile.retry"
    enabled: true
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?offline=false"
# Resume can finish recovery between a visibility check and the tap (FIN-470).
# Only the disappearing recovery action is optional; the loaded-state checks stay mandatory.
- tapOn:
    id: "profile.retry"
    optional: true
- extendedWaitUntil:
    visible:
      id: "profile.phone"
    timeout: 15000
- assertNotVisible:
    id: "profile.offline"
- assertNotVisible: "Проверьте интернет и попробуйте ещё раз"
- tapOn:
    id: "ds.tab.analytics"
- tapOn:
    id: "analytics.retry"
    optional: true
- extendedWaitUntil:
    visible:
      id: "analytics.block.tiles"
    timeout: 15000
- assertNotVisible:
    id: "analytics.offline"
- assertNotVisible: "Не удаётся подключиться к серверу"
