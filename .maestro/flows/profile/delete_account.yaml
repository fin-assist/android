appId: ru.finassist.pf.mock.e2e
name: Удаление аккаунта — код-пароль, затем подтверждение в диалоге
tags:
  - profile
---
- runFlow: ../../subflows/clear_state.yaml
- runFlow: ../../subflows/login.yaml
- tapOn:
    id: "ds.tab.profile"
- scrollUntilVisible:
    element:
      id: "profile.delete_account"
- tapOn:
    id: "profile.delete_account"
- extendedWaitUntil:
    visible:
      id: "applock.confirm"
    timeout: 10000
- assertVisible: "Удаление аккаунта"
# A wrong code is refused; the right one opens the confirmation over the profile.
- runFlow:
    file: ../../subflows/enter_code.yaml
    env:
      CODE: "9999"
- extendedWaitUntil:
    visible: "Неверный код"
    timeout: 5000
- runFlow:
    file: ../../subflows/enter_code.yaml
    env:
      CODE: "1234"
- extendedWaitUntil:
    visible: "Удалить аккаунт?"
    timeout: 10000
- tapOn:
    id: "ds.dialog.confirm"
- extendedWaitUntil:
    visible:
      id: "auth.deleted"
    timeout: 15000
- assertVisible: "Аккаунт удалён"
- tapOn:
    id: "auth.deleted.done"
- extendedWaitUntil:
    visible:
      id: "auth.phone"
    timeout: 10000
