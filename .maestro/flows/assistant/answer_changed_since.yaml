appId: ru.finassist.pf.mock.e2e
name: Помощник — «с тех пор данные менялись» под прежним ответом
tags:
  - assistant
---
# FIN-135: after an answer, the user changes a category and then deletes the statement. The line under the answer in
# the history says what changed since it was calculated (api.md 7.2–7.3); before the fix it never appeared.
- runFlow: ../../subflows/clear_state.yaml
- runFlow: ../../subflows/fast_login.yaml
- tapOn:
    id: "ds.tab.analytics"
- extendedWaitUntil:
    visible:
      id: "analytics.ask"
    timeout: 15000
- tapOn:
    id: "analytics.ask"
- extendedWaitUntil:
    visible:
      id: "assistant.chat"
    timeout: 10000
- tapOn:
    id: "ds.chat.input"
- inputText: "Krabsbir"
- tapOn:
    id: "ds.chat.send"
- extendedWaitUntil:
    visible:
      id: "assistant.consent"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "assistant.consent.checkbox"
- tapOn:
    id: "assistant.consent.checkbox"
- scrollUntilVisible:
    element:
      id: "assistant.consent.submit"
- tapOn:
    id: "assistant.consent.submit"
# FIN-394: consent returns to the draft; sending is a separate explicit action.
- extendedWaitUntil:
    visible:
      id: "assistant.chat"
    timeout: 10000
- assertNotVisible:
    id: "assistant.question"
- tapOn:
    id: "ds.chat.send"
- extendedWaitUntil:
    visible:
      id: "assistant.answer"
    timeout: 20000
# A fresh answer: nothing changed since it was calculated.
- assertVisible: "По вашим операциям.*"
- assertNotVisible: "С тех пор.*"

# Change the category of an operation.
- tapOn:
    id: "ds.back"
- tapOn:
    id: "ds.tab.operations"
- extendedWaitUntil:
    visible:
      id: "operations.row"
    timeout: 10000
- tapOn:
    id: "operations.row"
    index: 0
- extendedWaitUntil:
    visible:
      id: "operations.detail"
    timeout: 10000
- tapOn:
    id: "operations.detail.category"
- extendedWaitUntil:
    visible:
      id: "operations.category.search"
    timeout: 5000
- tapOn:
    id: "operations.category.option"
    index: 1
# The first options may include the current category: then «Сохранить» stays disabled, take another one.
- runFlow:
    when:
      visible:
        id: "operations.detail.save"
        enabled: false
    commands:
      - tapOn:
          id: "operations.category.option"
          index: 2
- tapOn:
    id: "operations.detail.save"
- extendedWaitUntil:
    notVisible:
      id: "operations.category.search"
    timeout: 10000
- tapOn:
    id: "ds.back"

# The history marks the earlier answer: categories changed since.
- tapOn:
    id: "ds.tab.profile"
- extendedWaitUntil:
    visible:
      id: "profile.assistant"
    timeout: 10000
- tapOn:
    id: "profile.assistant"
- extendedWaitUntil:
    visible:
      id: "assistant.answer"
    timeout: 10000
- assertVisible: "С тех пор категории менялись"

# Delete the statement as well: both kinds of change are reported.
- tapOn:
    id: "ds.back"
- extendedWaitUntil:
    visible:
      id: "profile.statements"
    timeout: 10000
- tapOn:
    id: "profile.statements"
- extendedWaitUntil:
    visible:
      id: "statements.history.row"
    timeout: 10000
- tapOn:
    id: "statements.history.delete"
    index: 0
- assertVisible: "Удалить загрузку .*\\?"
- tapOn:
    id: "ds.dialog.confirm"
- extendedWaitUntil:
    visible:
      id: "statements.history.empty"
    timeout: 10000
- tapOn:
    id: "ds.back"
- extendedWaitUntil:
    visible:
      id: "profile.assistant"
    timeout: 10000
- tapOn:
    id: "profile.assistant"
- extendedWaitUntil:
    visible:
      id: "assistant.answer"
    timeout: 10000
# Two codes: the client shows its generic line for a combination (AnswerFormat.changedSince).
- assertVisible: "С тех пор данные менялись"
