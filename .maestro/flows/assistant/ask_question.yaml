appId: ru.finassist.pf.mock.e2e
name: Помощник — согласие, вопрос, ответ, переход к операциям
tags:
  - smoke
  - assistant
---
- runFlow: ../../subflows/clear_state.yaml
- runFlow: ../../subflows/fast_login.yaml
- tapOn:
    id: "ds.tab.analytics"
- extendedWaitUntil:
    visible:
      id: "analytics.ask"
    timeout: 15000
- tapOn:
    id: "analytics.ask"

- extendedWaitUntil:
    visible:
      id: "assistant.chat"
    timeout: 10000
- assertVisible: ".*[Оо]сталось 5 из 5.*"

# A merchant from the fixture. The first question asks for consent (off by default, the server answers
# CONSENT_REQUIRED); after it the draft waits for an explicit send.
- tapOn:
    id: "ds.chat.input"
- inputText: "Krabsbir"
- tapOn:
    id: "ds.chat.send"
- extendedWaitUntil:
    visible:
      id: "assistant.consent"
    timeout: 10000
# FIN-366: assert both the disclosed text and its included/excluded group.
- scrollUntilVisible:
    element:
      text: "Передаём"
- assertVisible: "Передаём"
- scrollUntilVisible:
    element:
      text: "Ваш вопрос и историю диалога"
- assertVisible:
    id: "assistant.consent.included.item"
    text: "Ваш вопрос и историю диалога"
- scrollUntilVisible:
    element:
      text: "Не передаём"
- assertVisible: "Не передаём"
- scrollUntilVisible:
    element:
      text: "Номер телефона из аккаунта"
- assertVisible:
    id: "assistant.consent.excluded.item"
    text: "Номер телефона из аккаунта"
- scrollUntilVisible:
    element:
      text: "Файлы выписок"
- assertVisible:
    id: "assistant.consent.excluded.item"
    text: "Файлы выписок"
- scrollUntilVisible:
    element:
      text: ".*полного обезличивания это не гарантирует.*"
- assertVisible: ".*Имена и другие личные сведения в свободном тексте могут остаться.*"
- scrollUntilVisible:
    element:
      id: "assistant.consent.submit"
- tapOn:
    id: "assistant.consent.submit"
- assertVisible: "Без согласия помощник не сможет ответить"
- scrollUntilVisible:
    element:
      id: "assistant.consent.checkbox"
- tapOn:
    id: "assistant.consent.checkbox"
- scrollUntilVisible:
    element:
      id: "assistant.consent.submit"
- tapOn:
    id: "assistant.consent.submit"
# FIN-394: consent returns to the draft; sending is a separate explicit action.
- extendedWaitUntil:
    visible:
      id: "assistant.chat"
    timeout: 10000
- assertNotVisible:
    id: "assistant.question"
- assertVisible:
    id: "ds.chat.input"
    text: "Krabsbir"
    enabled: true
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?expect_assistant_asks=1&expect_assistant_questions=0&expect_assistant_answers=0"
- tapOn:
    id: "ds.chat.send"
- extendedWaitUntil:
    visible:
      id: "assistant.chat"
    timeout: 10000
- assertVisible:
    id: "assistant.question"

# The mock answers with totals, a chart and two chips; one question is spent.
- extendedWaitUntil:
    visible:
      id: "assistant.answer"
    timeout: 20000
- assertVisible: ".*[Оо]сталось 4 из 5.*"
- assertVisible:
    id: "assistant.answer.chip.operations"
- assertVisible:
    id: "assistant.answer.chip.analytics"

- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?expect_assistant_asks=2&expect_assistant_questions=1&expect_assistant_answers=1"

# The operations chip opens search scoped to the answer.
- tapOn:
    id: "assistant.answer.chip.operations"
- extendedWaitUntil:
    visible:
      id: "operations.search"
    timeout: 10000
# The scope chip comes after the filter chips, off screen in the sideways-scrolling row.
- swipe:
    from:
      id: "operations.search.chip.category"
    direction: LEFT
- assertVisible:
    id: "operations.search.chip.scope"
- assertVisible:
    id: "operations.row"
    containsDescendants:
      - text: "Krabsbir"
- tapOn:
    id: "ds.back"
- assertVisible:
    id: "assistant.chat"
