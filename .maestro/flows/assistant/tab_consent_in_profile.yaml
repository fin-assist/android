appId: ru.finassist.pf.mock.e2e
name: Согласие из Профиля разблокирует сохранённый черновик вкладки помощника
tags:
  - assistant
---
- runFlow: ../../subflows/clear_state.yaml
- runFlow: ../../subflows/fast_login.yaml
- tapOn:
    id: "ds.tab.assistant"
- extendedWaitUntil:
    visible:
      id: "assistant.chat"
    timeout: 10000
- tapOn:
    id: "ds.chat.input"
- inputText: "Kaspersky"
- hideKeyboard
- tapOn:
    id: "ds.chat.send"
- extendedWaitUntil:
    visible:
      id: "assistant.consent"
    timeout: 10000
- tapOn:
    id: "ds.back"
- assertVisible:
    id: "assistant.consent.reopen"
- assertVisible:
    id: "ds.chat.input"
    text: "Kaspersky"
- assertNotVisible:
    id: "assistant.question"
- tapOn:
    id: "ds.tab.profile"
- scrollUntilVisible:
    element:
      id: "profile.assistant.consent"
- tapOn:
    id: "profile.assistant.consent"
- extendedWaitUntil:
    visible:
      id: "assistant.consent"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "assistant.consent.checkbox"
- tapOn:
    id: "assistant.consent.checkbox"
- scrollUntilVisible:
    element:
      id: "assistant.consent.submit"
- tapOn:
    id: "assistant.consent.submit"
- extendedWaitUntil:
    visible:
      id: "ds.tab.profile"
      selected: true
    timeout: 10000
- tapOn:
    id: "ds.tab.assistant"
- extendedWaitUntil:
    visible:
      id: "ds.chat.send"
      enabled: true
    timeout: 10000
- assertVisible: "Kaspersky"
- assertNotVisible:
    id: "assistant.consent.reopen"
- assertNotVisible:
    id: "assistant.question"
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?expect_assistant_asks=1&expect_assistant_questions=0&expect_assistant_answers=0"
- tapOn:
    id: "ds.chat.send"
- extendedWaitUntil:
    visible:
      id: "assistant.answer"
    timeout: 20000
- assertVisible: ".*[Оо]сталось 4 из 5.*"
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?expect_assistant_asks=2&expect_assistant_questions=1&expect_assistant_answers=1"
