appId: ru.finassist.pf.mock.e2e
name: Помощник — нет сети вместо поля ввода и «Повторить»
tags:
  - assistant
  - offline
---
- runFlow: ../../subflows/clear_state.yaml
- runFlow: ../../subflows/fast_login.yaml
- tapOn:
    id: "ds.tab.analytics"
- extendedWaitUntil:
    visible:
      id: "analytics.ask"
    timeout: 15000
- tapOn:
    id: "analytics.ask"
- extendedWaitUntil:
    visible:
      id: "assistant.chat"
    timeout: 10000

# The first question asks for consent; give it while online.
- tapOn:
    id: "ds.chat.input"
- inputText: "Krabsbir"
- tapOn:
    id: "ds.chat.send"
- extendedWaitUntil:
    visible:
      id: "assistant.consent"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "assistant.consent.checkbox"
- tapOn:
    id: "assistant.consent.checkbox"
- scrollUntilVisible:
    element:
      id: "assistant.consent.submit"
- tapOn:
    id: "assistant.consent.submit"
# FIN-394: consent returns to the draft; sending is a separate explicit action.
- extendedWaitUntil:
    visible:
      id: "assistant.chat"
    timeout: 10000
- assertNotVisible:
    id: "assistant.question"
- tapOn:
    id: "ds.chat.send"
- extendedWaitUntil:
    visible:
      id: "assistant.answer"
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: "ds.chat.input"
      enabled: true
    timeout: 20000

# Keep the draft before the control activity pauses Chat. Resume reads history and hides the composer on failure.
- tapOn:
    id: "ds.chat.input"
- inputText: "Krabsbir again"
- hideKeyboard
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?offline=true"
- extendedWaitUntil:
    visible:
      id: "ds.chat.offline"
    timeout: 15000
- assertVisible:
    text: "Не удаётся подключиться к серверу. Проверьте интернет и попробуйте ещё раз"
    childOf:
      id: "ds.chat.offline"
- assertNotVisible:
    id: "ds.chat.input"
- assertVisible: ".*[Оо]сталось 4 из 5.*"
- assertNotVisible:
    text: "Krabsbir again"
    childOf:
      id: "assistant.question"

# A read failure has no pending Ask. Retry restores the draft without sending it, even while still offline.
- tapOn:
    id: "ds.chat.retry"
- extendedWaitUntil:
    visible:
      id: "ds.chat.input"
      text: "Krabsbir again"
      enabled: true
    timeout: 10000
- assertVisible: ".*[Оо]сталось 4 из 5.*"
- assertNotVisible:
    text: "Krabsbir again"
    childOf:
      id: "assistant.question"
# Only this explicit Send creates a pending question; the failed send replaces the input again.
- tapOn:
    id: "ds.chat.send"
- extendedWaitUntil:
    visible:
      id: "ds.chat.offline"
    timeout: 15000
- assertNotVisible:
    id: "ds.chat.input"
- assertVisible: ".*[Оо]сталось 4 из 5.*"
# Retrying the pending Ask while offline must neither append a question nor consume quota.
- tapOn:
    id: "ds.chat.retry"
- extendedWaitUntil:
    visible:
      id: "ds.chat.offline"
    timeout: 15000
- assertVisible: ".*[Оо]сталось 4 из 5.*"
- assertNotVisible:
    text: "Krabsbir again"
    childOf:
      id: "assistant.question"

# Online resume recovers the history read, not the POST. The same pending draft still needs explicit Send.
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?offline=false"
- extendedWaitUntil:
    visible:
      id: "ds.chat.input"
      text: "Krabsbir again"
      enabled: true
    timeout: 10000
- assertNotVisible:
    id: "ds.chat.offline"
- assertVisible: ".*[Оо]сталось 4 из 5.*"
- assertNotVisible:
    text: "Krabsbir again"
    childOf:
      id: "assistant.question"
- tapOn:
    id: "ds.chat.send"
- extendedWaitUntil:
    visible: ".*[Оо]сталось 3 из 5.*"
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: "ds.chat.input"
      enabled: true
    timeout: 20000
- assertVisible:
    id: "assistant.answer"
# Chat uses a lazy list: quota proves one new accepted question without relying on two answers being on screen.
- assertVisible: ".*[Оо]сталось 3 из 5.*"
- assertNotVisible:
    id: "assistant.chat.send_failed"
