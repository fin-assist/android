appId: ru.finassist.pf.mock.e2e
name: Помощник — нет сети вместо поля ввода и «Повторить»
tags:
  - assistant
  - offline
---
- runFlow: ../../subflows/clear_state.yaml
- runFlow: ../../subflows/fast_login.yaml
- tapOn:
    id: "ds.tab.analytics"
- extendedWaitUntil:
    visible:
      id: "analytics.ask"
    timeout: 15000
- tapOn:
    id: "analytics.ask"
- extendedWaitUntil:
    visible:
      id: "assistant.chat"
    timeout: 10000

# The first question asks for consent; give it while online.
- tapOn:
    id: "ds.chat.input"
- inputText: "Krabsbir"
- tapOn:
    id: "ds.chat.send"
- extendedWaitUntil:
    visible:
      id: "assistant.consent"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "assistant.consent.checkbox"
- tapOn:
    id: "assistant.consent.checkbox"
- scrollUntilVisible:
    element:
      id: "assistant.consent.submit"
- tapOn:
    id: "assistant.consent.submit"
- extendedWaitUntil:
    visible:
      id: "assistant.answer"
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: "ds.chat.input"
      enabled: true
    timeout: 20000

# Without the network the question is not sent: the notice replaces the input (mockup `ChatOffline`).
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?offline=true"
- tapOn:
    id: "ds.chat.input"
- inputText: "Krabsbir"
- tapOn:
    id: "ds.chat.send"
- extendedWaitUntil:
    visible:
      id: "ds.chat.offline"
    timeout: 15000
- assertVisible: "Не удаётся подключиться к серверу. Проверьте интернет и попробуйте ещё раз"
- assertNotVisible:
    id: "ds.chat.input"

# Back online, «Повторить» sends the same question: the input returns and a second answer comes.
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?offline=false"
- tapOn:
    id: "ds.chat.retry"
- extendedWaitUntil:
    notVisible:
      id: "ds.chat.offline"
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: "assistant.answer"
      index: 1
    timeout: 20000
- assertVisible: ".*[Оо]сталось 3 из 5.*"
