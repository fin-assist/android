appId: ru.finassist.pf.mock.e2e
name: OFF_TOPIC — недельная блокировка сохраняет черновик и дневной остаток
tags:
  - assistant
  - errors
---
- runFlow: ../../subflows/clear_state.yaml
- runFlow: ../../subflows/fast_login.yaml
- tapOn:
    id: "ds.tab.analytics"
- extendedWaitUntil:
    visible:
      id: "analytics.ask"
    timeout: 15000
- tapOn:
    id: "analytics.ask"
- extendedWaitUntil:
    visible:
      id: "assistant.chat"
    timeout: 10000

# FIN-223: a question not about the user's finances is OFF_TOPIC (the fake server recognises «weather»).
- tapOn:
    id: "ds.chat.input"
- inputText: "What is the weather today?"
- tapOn:
    id: "ds.chat.send"
# The first question asks for consent; after it the question goes out by itself.
- extendedWaitUntil:
    visible:
      id: "assistant.consent"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "assistant.consent.checkbox"
- tapOn:
    id: "assistant.consent.checkbox"
- scrollUntilVisible:
    element:
      id: "assistant.consent.submit"
- tapOn:
    id: "assistant.consent.submit"
- extendedWaitUntil:
    visible:
      id: "assistant.answer.failed"
    timeout: 20000
# The server's text is shown as is; retryable is false, so there is no «Повторить».
- assertVisible: "Вопрос не по теме — помощник отвечает только на вопросы о ваших финансах.*"
- assertNotVisible:
    id: "assistant.answer.failed.retry"
# The attempt is returned: still 5 of 5.
- assertVisible: ".*[Оо]сталось 5 из 5.*"

# Four more terminal outcomes reach the real rolling-window threshold.
- repeat:
    times: 4
    commands:
      - tapOn:
          id: "ds.chat.input"
      - inputText: "What is the weather tomorrow?"
      - tapOn:
          id: "ds.chat.send"
      - extendedWaitUntil:
          visible:
            id: "ds.chat.send"
            enabled: true
          timeout: 20000
      - assertVisible: ".*[Оо]сталось 5 из 5.*"
- tapOn:
    id: "ds.chat.input"
- inputText: "Krabsbir"
- tapOn:
    id: "ds.chat.send"
- extendedWaitUntil:
    visible:
      id: "assistant.chat.send_failed"
    timeout: 20000
- assertVisible: "Слишком много запросов[.] Попробуйте позже"
- assertVisible: "Krabsbir"
- assertVisible: ".*[Оо]сталось 5 из 5.*"
- assertVisible:
    id: "assistant.answer.failed"
- assertNotVisible:
    id: "assistant.answer.failed.retry"
- pressKey: back
- tapOn:
    id: "analytics.ask"
- extendedWaitUntil:
    visible:
      id: "assistant.answer.failed"
    timeout: 15000
- assertVisible: ".*[Оо]сталось 5 из 5.*"
