appId: ru.finassist.pf.mock.e2e
name: Помощник — «Повторить» после сбоя модели сохраняет режим «Без переводов»
tags:
  - assistant
---
# FIN-76: a question asked «Без переводов» whose answer fails (MODEL_ERROR) is answered without transfers after
# «Повторить» too: the source line of the new answer says so.
- runFlow: ../../subflows/clear_state.yaml
- runFlow: ../../subflows/fast_login.yaml
# The next answer fails like a model would (process-scoped: set after the app is up).
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?assistant_model_errors=1"
- tapOn:
    id: "ds.tab.analytics"
- extendedWaitUntil:
    visible:
      id: "analytics.transfers"
    timeout: 15000
- tapOn:
    id: "analytics.transfers"
- tapOn:
    id: "analytics.transfers.without"
- extendedWaitUntil:
    visible: "Без переводов"
    timeout: 5000
- tapOn:
    id: "analytics.ask"
- extendedWaitUntil:
    visible:
      id: "assistant.chat"
    timeout: 10000
- tapOn:
    id: "ds.chat.input"
- inputText: "Krabsbir"
- tapOn:
    id: "ds.chat.send"
- extendedWaitUntil:
    visible:
      id: "assistant.consent"
    timeout: 10000
- tapOn:
    id: "assistant.consent.checkbox"
- tapOn:
    id: "assistant.consent.submit"

# The model fails: the question is not spent, «Повторить» is offered.
- extendedWaitUntil:
    visible:
      id: "assistant.answer.failed"
    timeout: 20000
- assertVisible: ".*[Оо]сталось 5 из 5.*"
- tapOn: "Повторить"

# The new answer replaces the failed one and is counted «без переводов», like the question.
- extendedWaitUntil:
    visible:
      id: "assistant.answer"
    timeout: 20000
- assertNotVisible:
    id: "assistant.answer.failed"
- assertVisible: ".*[Оо]сталось 4 из 5.*"
- scrollUntilVisible:
    element: ".*· без переводов"
    direction: DOWN
