appId: ru.finassist.pf.mock.e2e
name: Помощник — ответ не получился, двойное нажатие «Повторить» даёт один ответ без ошибки
tags:
  - assistant
---
- runFlow: ../../subflows/clear_state.yaml
- runFlow: ../../subflows/login.yaml
- tapOn:
    id: "ds.tab.analytics"
- extendedWaitUntil:
    visible:
      id: "analytics.ask"
    timeout: 15000
- tapOn:
    id: "analytics.ask"
- extendedWaitUntil:
    visible:
      id: "assistant.chat"
    timeout: 10000

# The model is down: the answer fails with MODEL_ERROR, the question is not spent.
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?assistant_model_errors=1"
- tapOn:
    id: "ds.chat.input"
- inputText: "Krabsbir"
- tapOn:
    id: "ds.chat.send"
# The first question asks for consent; after it the question goes out by itself.
- extendedWaitUntil:
    visible:
      id: "assistant.consent"
    timeout: 10000
- tapOn:
    id: "assistant.consent.checkbox"
- tapOn:
    id: "assistant.consent.submit"
- extendedWaitUntil:
    visible:
      id: "assistant.answer.failed"
    timeout: 20000
- assertVisible: "Не получилось ответить. Вопрос не потрачен"
- assertVisible: ".*[Оо]сталось 5 из 5.*"

# FIN-75: the next answer is fine; a double tap on «Повторить» while the first request is on its way (1.5 s latency)
# must not send it twice — the second request with the same key got 409 and showed «Не получилось отправить
# вопрос» although the first one had succeeded.
- runFlow:
    file: ../../subflows/config.yaml
    env:
      LINK: "pfe2e://config?network_delay_ms=1500"
- doubleTapOn:
    id: "assistant.answer.failed.retry"
- extendedWaitUntil:
    visible:
      id: "assistant.answer"
    timeout: 20000
- assertNotVisible:
    id: "assistant.answer.failed"
- assertNotVisible:
    id: "assistant.chat.send_failed"
- assertVisible: ".*[Оо]сталось 4 из 5.*"
