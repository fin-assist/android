appId: ru.finassist.pf.mock.e2e
name: «Забыли код?» — выход и новый вход
tags:
  - applock
---
- clearState
- runFlow: ../../subflows/login.yaml
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "applock.unlock"
    timeout: 20000
- tapOn:
    id: "applock.unlock.forgot"
- assertVisible:
    id: "ds.dialog"
- assertVisible: "Выйти из аккаунта?"
# «Отмена» keeps the lock.
- tapOn:
    id: "ds.dialog.cancel"
- assertVisible:
    id: "applock.unlock"
- tapOn:
    id: "applock.unlock.forgot"
- tapOn:
    id: "ds.dialog.confirm"
- extendedWaitUntil:
    visible:
      id: "auth.phone"
    timeout: 15000
